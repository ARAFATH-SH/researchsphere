# ResearchSphere CI (NFR-7): runs on every pull request to main and every push to main, and
# nightly for the real-ClamAV test and the real AI model (docs/decisions.md, 2026-11-12 and
# 2026-11-14).
#
# Order: detect, then the fast checks (backend, frontend, ai) in parallel, then the stack job
# (PostgreSQL, Redis, MinIO, migrations, database and repository tests) once they pass. The
# clamav job (EICAR with a real clamd) runs only on push to main, nightly and by hand. The
# ai-model job (the real embedding model, about 1.1 GB to download) runs only nightly and by
# hand; on pull requests the ai job tests the service with a stub model.
#
# A change that touches only docs/**, design/** or Markdown files (never docs/openapi.yaml,
# never testdata) skips every job but detect. The jobs then show as skipped, which branch
# protection counts as passing; a workflow-level paths-ignore would leave required checks
# pending forever. The job names are the status check names: do not rename them.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run that is still going. Runs on main are never
# cancelled, so every merge gets a result; the nightly run has a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
      go: ${{ steps.detect.outputs.go }}
      node: ${{ steps.detect.outputs.node }}
      python: ${{ steps.detect.outputs.python }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base: depth 2
      # is enough to diff it. A push needs the commit before it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      # code=false only when every changed file is documentation or design. Anything the
      # diff cannot be computed for (a new branch, a force push, a manual run) counts as code;
      # the nightly run checks only ClamAV.
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="HEAD^1" ;;
            push) base="$BEFORE" ;;
            schedule) echo "code=false" >> "$GITHUB_OUTPUT"; echo "Nightly run: ClamAV only."; exit 0 ;;
            *) base="" ;;
          esac
          if [[ -z "$base" ]] || ! files=$(git diff --name-only "$base" HEAD 2>/dev/null); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No diff to compare; all jobs run."
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if [[ "$f" == docs/openapi.yaml || "$f" == */testdata/* ]] ||
               ! [[ "$f" == docs/* || "$f" == design/* || "$f" == *.md ]]; then
              code=true
              echo "code change: $f"
            fi
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [[ "$code" == true ]] || echo "Only docs, design or Markdown changed; the other jobs are skipped."

      # A job is skipped only when its folder has no manifest AND no source files.
      # Source files without a manifest fail here, so a missing manifest cannot hide code.
      - name: Detect manifests
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          status=0

          detect() {
            local key=$1 dir=$2 manifest=$3; shift 3
            if [[ -f "$dir/$manifest" ]]; then
              echo "$key=true" >> "$GITHUB_OUTPUT"
              echo "$dir: found $manifest, job runs"
              return
            fi
            local sources
            sources=$(find "$dir" \( -name node_modules -o -name .next -o -name .venv \) -prune -o -type f \( "$@" \) -print)
            if [[ -n "$sources" ]]; then
              echo "::error::$dir has source files but no $manifest:"
              echo "$sources"
              status=1
            fi
            echo "$key=false" >> "$GITHUB_OUTPUT"
            echo "$dir: no $manifest, job skipped"
          }

          detect go     backend  go.mod         -name '*.go'
          detect node   frontend package.json   -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o -name '*.mjs'
          detect python ai       pyproject.toml -name '*.py'
          exit "$status"

  backend:
    name: Backend (Go)
    needs: detect
    if: needs.detect.outputs.code == 'true' && needs.detect.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # oapi-codegen is pinned by the tool directive in go.mod.
      - name: Check generated code is up to date
        run: |
          go generate ./...
          if [[ -n "$(git status --porcelain -- .)" ]]; then
            git status --short -- .
            git diff -- .
            echo "::error::Generated code is out of date: run make generate and commit the result."
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (Node.js)
    needs: detect
    if: needs.detect.outputs.code == 'true' && needs.detect.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Check generated API types are up to date
        run: |
          npm run generate
          if [[ -n "$(git status --porcelain -- src/lib/api)" ]]; then
            git status --short -- src/lib/api
            git diff -- src/lib/api
            echo "::error::Generated API types are out of date: run make generate and commit the result."
            exit 1
          fi

      # No --if-present: package.json must define lint, typecheck, test and build.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  ai:
    name: AI (Python, uv)
    needs: detect
    if: needs.detect.outputs.code == 'true' && needs.detect.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no major tags (v8 onwards), so it is pinned to an exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: ai/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # pytest exits with 5 when it collects no tests; that stays a failure.
      - name: Test
        run: uv run pytest

  # Runs after the fast checks pass (a job skipped for a missing manifest counts as passed).
  # It starts no ClamAV: the real-clamd test is the clamav job's.
  stack:
    name: Stack (integration)
    needs: [detect, backend, frontend, ai]
    if: >-
      !cancelled() &&
      needs.detect.result == 'success' && needs.detect.outputs.code == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.ai.result == 'success' || needs.ai.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from .env.example
        run: cp .env.example .env

      # make up also starts MinIO and creates the private bucket; make check confirms both.
      # CLAMAV=0 leaves clamd out (1.5 to 3 GB and up to 90 s); make check then shows it as
      # not ready, which is not a failure.
      - name: Start PostgreSQL, Redis, Mailpit and MinIO
        run: make up CLAMAV=0 AI=0

      - name: Check services
        run: make check

      # The checksum is the one published in the release's sha256sum.txt.
      - name: Install golang-migrate
        env:
          MIGRATE_VERSION: v4.18.3
          MIGRATE_SHA256: 60c59c0cac50e99172d95135b2f421863c4b2f4a67709e66daae024d652fa1b5
        run: |
          curl -fsSL -o /tmp/migrate.tar.gz \
            "https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz"
          echo "${MIGRATE_SHA256}  /tmp/migrate.tar.gz" | sha256sum --check
          sudo tar -xzf /tmp/migrate.tar.gz -C /usr/local/bin migrate
          migrate -version

      # NFR-11.1: every migration must apply, undo completely and apply again.
      - name: Apply migrations
        run: make migrate

      - name: Undo all migrations
        run: |
          set -a; source .env; set +a
          migrate -path backend/db/migrations -database "$DATABASE_URL" down -all

      - name: Check that nothing is left after undoing
        run: |
          set -a; source .env; set +a
          leftovers=$(docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -tA \
            -v ON_ERROR_STOP=1 < backend/db/tests/leftovers.sql)
          if [[ -n "$leftovers" ]]; then
            echo "::error::Down migrations left objects behind:"
            echo "$leftovers"
            exit 1
          fi
          echo "Database is empty."

      - name: Apply migrations again
        run: make migrate

      # The tests use their own database (researchsphere_test, created and migrated here)
      # and Redis DB 15, as they do locally; make test-db and make test-integration would
      # also run this step themselves.
      - name: Prepare test database
        run: make test-prepare

      - name: Database tests
        run: make test-db

      # Go lint and unit tests run in the backend job, which needs no database. Only the
      # repository tests (build tag "integration") run here, against the test database,
      # Redis DB 15 and MinIO (TEST_ and S3_ settings from .env). TEST_CLAMAV_ADDR is unset,
      # so the real-clamd test skips; the clamav job runs it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Repository tests (Go)
        run: make test-integration

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: make down

  # FR-16.7: scans the EICAR string with a real clamd. Only on push to main, nightly (new
  # signatures) and by hand, never on a pull request. It needs no database, only clamd. When
  # clamd does not come up in 5 minutes, for example when the signature download is
  # rate-limited, TEST_CLAMAV_ADDR stays unset and the test skips with a warning instead of
  # failing (docs/decisions.md, 2026-11-09 and 2026-11-12).
  clamav:
    name: ClamAV (EICAR)
    needs: detect
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.detect.outputs.code == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Start ClamAV
        run: docker compose up -d clamav

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Wait for ClamAV
        continue-on-error: true
        run: |
          id=$(docker compose ps -q clamav)
          if timeout 300 bash -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' $id)\" = healthy ]; do sleep 5; done"; then
            echo "TEST_CLAMAV_ADDR=127.0.0.1:3310" >> "$GITHUB_ENV"
            echo "clamd is ready; the EICAR test will run."
          else
            echo "::warning::clamd did not become healthy; the EICAR test will be skipped."
          fi

      - name: EICAR test (Go)
        working-directory: backend
        run: go test -tags integration -count=1 -v -run '^TestRealClamd$' ./internal/media/adapter/clamav/

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down

  # The AI service with the real model (AI-1): builds the image, downloads the model at its
  # pinned revision, and checks dimensions, normalisation, the e5 prefixes and that a Bangla
  # translation lands near its English text. Nightly and by hand only, never on a pull
  # request or a push (CI minutes, docs/decisions.md 2026-11-14). Not a required check.
  ai-model:
    name: AI model (e5)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build the image
        run: docker compose build ai

      - name: Start the service (downloads the model)
        run: docker compose up -d --wait --wait-timeout 900 ai

      - name: Smoke test with the real model
        run: |
          set -a; source .env; set +a
          python3 ai/scripts/smoke.py "http://127.0.0.1:${AI_SERVICE_PORT}"

      - name: Image size and memory after loading
        if: always()
        run: |
          docker image ls researchsphere-ai:local --format 'image {{.Repository}}:{{.Tag}} {{.Size}}'
          docker stats --no-stream --format 'memory {{.Name}} {{.MemUsage}}' $(docker compose ps -q ai)

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color ai

      - name: Stop services
        if: always()
        run: docker compose down
