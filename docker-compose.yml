# ResearchSphere: local development services (PostgreSQL, Redis, Mailpit, MinIO, ClamAV, AI).
# Start with `make up`, stop with `make down`. Values come from .env (see .env.example).
name: researchsphere

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-researchsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-researchsphere}
    ports:
      # Bound to this machine only. 5433 avoids a clash with a PostgreSQL installed on Ubuntu.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local email (FR-1.3): catches every message the API sends. Inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"   # SMTP
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"  # web inbox
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage (FR-4.6, NFR-13): S3-compatible, console at http://localhost:9001.
  # MinIO publishes no images any more; this is Chainguard's build from the MinIO source,
  # pinned by digest because the free tier has only a `latest` tag (docs/decisions.md).
  minio:
    image: cgr.dev/chainguard/minio@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-researchsphere}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-dev-only-minio-secret}
      # Lets `mc ready local` in the healthcheck reach this server.
      MC_HOST_local: http://${S3_ACCESS_KEY:-researchsphere}:${S3_SECRET_KEY:-local-dev-only-minio-secret}@localhost:9000
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"          # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"  # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the bucket and makes sure it is private (no anonymous access), then exits.
  # `make up` runs it with `docker compose run`; the profile keeps it out of `up --wait`,
  # which treats a container that has exited as a failure.
  #
  # It also sets which web origins may send figures straight to storage with a presigned POST
  # (FR-12.2, docs/decisions.md 2026-11-18): the web client on ports 3000 and 3001, by name
  # and by address. This MinIO build has no per-bucket CORS (`mc cors set` answers "not
  # implemented"), so it is the server's `api cors_allow_origin`, which takes effect at once
  # and is kept in the minio volume. MINIO_CORS_ALLOW_ORIGINS overrides the list.
  minio-init:
    profiles: [init]
    image: cgr.dev/chainguard/minio@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-researchsphere}:${S3_SECRET_KEY:-local-dev-only-minio-secret}@minio:9000
      S3_BUCKET: ${S3_BUCKET:-researchsphere}
      CORS_ORIGINS: ${MINIO_CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mc mb --ignore-existing "local/$$S3_BUCKET" && mc anonymous set private "local/$$S3_BUCKET" &&
        mc admin config set local api cors_allow_origin="$$CORS_ORIGINS"
    restart: "no"

  # Malware scanner for message attachments (FR-16.7, NFR-13). The API streams each file to
  # clamd over TCP (INSTREAM). The image under this tag carries signatures that are rebuilt
  # daily; the volume keeps the ones freshclam updates, so they are not downloaded again on
  # every start. clamd needs about 1.5 to 3 GB of memory and 30 to 90 seconds to load its
  # signatures: `make up` starts it without waiting, and the scan worker waits for it
  # (docs/decisions.md, 2026-11-09).
  #
  # Size limits (docs/decisions.md, 2026-11-18): figures may be up to FIGURE_MAX_BYTES, 50 MB
  # by default and at most 200 MiB, so clamd takes a stream of 210M and scans a file of that
  # size whole; the API's CLAMAV_MAX_BYTES (210M) is the same limit on its side, and the API
  # refuses to start with FIGURE_MAX_BYTES above it. MaxScanSize leaves room for what clamd
  # unpacks from a PDF. AlertExceedsMax makes clamd say when it could not scan a file whole,
  # instead of passing it as clean; the API then marks the file failed, never serves it.
  # The image writes each CLAMD_CONF_ variable into clamd.conf at start.
  clamav:
    image: clamav/clamav:1.4.6
    environment:
      CLAMD_CONF_StreamMaxLength: 210M
      CLAMD_CONF_MaxFileSize: 210M
      CLAMD_CONF_MaxScanSize: 420M
      CLAMD_CONF_AlertExceedsMax: "yes"
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamavdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # AI service (AI-1): text embeddings with intfloat/multilingual-e5-base, CPU only. Internal:
  # only the API calls it, with the AI_SERVICE_TOKEN header; it is published on this machine
  # only, for `make api` and local testing, never on a public port. The model is not in the
  # image: the first start downloads it (about 1.1 GB, pinned revision) into the aimodels
  # volume, which keeps it across rebuilds; `make ai-fetch-model` does it ahead of time.
  # Loaded, it needs about 1.5 GB of memory. `make up` starts it without waiting, and the
  # API reports it as degraded, not down, until /ready answers (docs/decisions.md, 2026-11-14).
  ai:
    build: ./ai
    image: researchsphere-ai:local
    environment:
      # Empty or shorter than 32 characters: the service exits with a message saying so.
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8090}:8000"
    volumes:
      - aimodels:/models
    mem_limit: 3g

  # Sync server (slice 22, docs/sync.md): real-time editing. Not started by `make up`: in
  # development it runs on the host with `make sync`, beside `make api`, whose internal listener
  # it calls. This service builds and runs the production image (profile `sync`), for example
  # with `docker compose --profile sync up sync` and the API reachable from the container
  # (API_INTERNAL_URL). It stores everything on SIGTERM; stop_grace_period leaves it the time.
  sync:
    profiles: ["sync"]
    build: ./sync
    image: researchsphere-sync:local
    environment:
      SYNC_SERVICE_TOKEN: ${SYNC_SERVICE_TOKEN:-}
      REDIS_URL: ${SYNC_DOCKER_REDIS_URL:-redis://redis:6379/0}
      API_INTERNAL_URL: ${SYNC_DOCKER_API_URL:-http://host.docker.internal:8081/api/v1}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SYNC_MAX_EDITORS_PER_FILE: ${SYNC_MAX_EDITORS_PER_FILE:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${SYNC_PORT:-8091}:8091"
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  clamavdb:
  aimodels:
