    MessageReportPerson:
      type: object
      required: [userId, fullName, photoUrl, headline, role]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        photoUrl:
          type: string
          nullable: true
          description: The profile photo as `/api/v1/media/{fileId}`; null when not set.
        headline:
          type: string
          nullable: true

    MessageReport:
      type: object
      required: [id, conversationId, status, reason, details, messageId, reporter, reportedUser, createdAt, outcome, note, resolvedAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        status:
          type: string
