                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/languages:
    post:
      operationId: addMyLanguage
      summary: Add a language to the logged-in user's profile (FR-4.9)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The name is trimmed and kept in the casing the user typed.
        A user has at most 20 languages, and no two whose names differ only in letter case.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanguageCreate"
      responses:
        "201":
          description: The stored language.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Language"
        "400":
          $ref: "#/components/responses/InvalidLanguage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The user already has a language with this name, ignoring letter case
            (`language_exists`), or already has 20 languages (`language_limit_reached`).
            The name is checked first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/languages/{languageId}:
    patch:
      operationId: updateMyLanguage
      summary: Change the name or proficiency of one of the logged-in user's languages (FR-4.9)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). A field that is missing keeps its value; `null` is
        refused, because both fields are required. The rules of LanguageCreate apply to
        the entry after the change; changing only the letter case of its own name is
        allowed. An entry that does not exist and one that belongs to someone else both
        get 404 `not_found`.
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/LanguageID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanguageUpdate"
      responses:
        "200":
          description: The language after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Language"
        "400":
          $ref: "#/components/responses/InvalidLanguage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The user has no language with this ID (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another of the user's languages has this name, ignoring letter case (`language_exists`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeMyLanguage
      summary: Remove one of the logged-in user's languages (FR-4.9)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). An entry that does not exist and one that belongs to
        someone else both get 404 `not_found`.
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/LanguageID"
      responses:
        "204":
          description: The language is removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The user has no language with this ID (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/contact:
    get:
      operationId: getMyContact
      summary: Return the logged-in user's contact info and who may see each item (FR-4.7)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). A user who never saved contact info gets
        no phone, no birthday, every visibility `only_me` and no links.
      tags: [profile]
      responses:
        "200":
          description: The caller's contact info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateMyContact
      summary: Replace the logged-in user's phone, birthday and visibility settings (FR-4.7)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Replaces every field in the body: a missing or null
        `phone` or `birthday` clears it. The email address itself is changed nowhere here;
        only who may see it. Links are not changed here.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: The saved contact info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: |
            A field is not valid. The code names the first invalid field, in this order:
            `invalid_phone`, `invalid_birthday`, `invalid_visibility`. A body that is not
            JSON gets `bad_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/links:
    post:
      operationId: addMyLink
      summary: Add a link to the logged-in user's profile (FR-4.7)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The URL is trimmed. A user has at most 5 links. Links
        are visible to every logged-in user.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLinkRequest"
      responses:
        "201":
          description: The stored link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLink"
        "400":
          description: |
            The kind is not one of the listed kinds (`invalid_link_kind`), the URL is not an
            https URL with a host, has whitespace or is longer than 300 characters
            (`invalid_link_url`), or the body is not JSON (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The user already has 5 links (`link_limit_reached`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/links/{linkId}:
    delete:
      operationId: removeMyLink
      summary: Remove one of the logged-in user's links (FR-4.7)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). A link that does not exist and one that belongs to
        someone else both get 404 `not_found`.
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/LinkID"
      responses:
        "204":
          description: The link is removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The user has no link with this ID (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/publications:
    get:
      operationId: listMyPublications
      summary: List the logged-in user's confirmed publications (FR-5.5)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Only publications the user has confirmed
        are listed, sorted by year, newest first (no year last), then by when the user
        added them, newest first.
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/PublicationListPage"
        - $ref: "#/components/parameters/PublicationListPageSize"
      responses:
        "200":
          description: One page of the caller's publications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationPage"
        "400":
          description: "`page` or `pageSize` is not a whole number of at least 1 (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: addMyPublication
      summary: Add a publication to the logged-in user's profile by hand (FR-5.1, FR-5.4)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Text is trimmed; an optional field that is missing, null
        or empty after trimming is stored as null. The DOI is stored in its bare,
        lower-case form: a leading `https://doi.org/`, `http://doi.org/`,
        `https://dx.doi.org/`, `http://dx.doi.org/` or `doi:` is removed. A publication
        with a given DOI is stored once (FR-5.4): when one with the same DOI already
        exists, the caller is linked to it, the other fields in the body are ignored, and
        the answer is the existing record with `linked` true. The caller's link is
        confirmed. A user has at most 300 publications.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationCreate"
      responses:
        "201":
          description: The stored publication, or the existing one the caller is now linked to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationAdded"
        "400":
          $ref: "#/components/responses/InvalidPublication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The user already has 300 publications (`publication_limit_reached`), or already
            has the publication with this DOI on their profile (`publication_already_added`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/publications/{publicationId}:
    patch:
      operationId: updateMyPublication
      summary: Change some fields of one of the logged-in user's publications (FR-5.1)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). A field that is missing keeps its value; `null` clears
        `venue`, `abstract`, `url` or `doi`. The rules of PublicationCreate apply to the
        record after the change. Only a publication that was added by hand and that no
        other user is linked to can be changed. A publication the caller is not linked to
        gets 404 `not_found`, before the body is checked.
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/PublicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationUpdate"
      responses:
        "200":
          description: The publication after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "400":
          $ref: "#/components/responses/InvalidPublication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The user has no publication with this ID (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Another user is linked to the publication or it was not added by hand
            (`publication_shared_readonly`), or another publication already has the new DOI
            (`duplicate_doi`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeMyPublication
      summary: Remove a publication from the logged-in user's profile (FR-5.7)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Removes only the caller's link; the publication stays for
        every other linked user and is deleted when no user is linked to it any more. A
        publication the caller is not linked to gets 404 `not_found`.
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/PublicationID"
      responses:
        "204":
          description: The publication is removed from the caller's profile.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The user has no publication with this ID (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/{userId}/publications:
    get:
      operationId: listPublications
      summary: List any user's confirmed publications to a logged-in user (FR-5.5)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Only publications the user has confirmed
        are listed, in the order of `listMyPublications`. An unknown, suspended or
        unverified account gets the same 404 `not_found`, as for the profile.
      tags: [profile]
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            The user's ID, a UUID. It is declared as a plain string so that the login check
            runs before it is read (FR-3.1); a value that is not a UUID names no user and
            gets 404 `not_found`.
          schema:
            type: string
        - $ref: "#/components/parameters/PublicationListPage"
        - $ref: "#/components/parameters/PublicationListPageSize"
      responses:
        "200":
          description: One page of the user's publications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationPage"
        "400":
          description: "`page` or `pageSize` is not a whole number of at least 1 (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/photo:
    put:
      operationId: uploadMyPhoto
      summary: Upload or replace the logged-in user's profile photo (FR-4.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The file may be at most 5 MB. Its type is read from its
        first bytes, not its name or header: JPEG, PNG or WebP (not animated). Its width
        and height are read before it is decoded, and an image over 8000 pixels on a side
        is refused. The image is cropped to a centred square and stored as a 400x400 JPEG,
        so nothing else in the file (EXIF, GPS, other data) is kept. A previous photo is
        removed. A user may upload at most 5 images (photo and cover together) per hour;
        refused files do not count.
      tags: [media]
      requestBody:
        $ref: "#/components/requestBodies/ImageUpload"
      responses:
        "200":
          $ref: "#/components/responses/ProfileImageStored"
        "400":
          $ref: "#/components/responses/InvalidImage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NoProfile"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedImageType"
        "429":
          $ref: "#/components/responses/UploadRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeMyPhoto
      summary: Remove the logged-in user's profile photo (FR-4.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Succeeds also when no photo is set. Not rate limited.
      tags: [media]
      responses:
        "204":
          description: The profile has no photo.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/cover:
    put:
      operationId: uploadMyCover
      summary: Upload or replace the logged-in user's cover image (FR-4.6)
      description: |
        As `PUT /profiles/me/photo`, except that the file may be at most 8 MB and the
        image is cropped to a centred 4:1 rectangle and stored as a 1584x396 JPEG.
      tags: [media]
      requestBody:
        $ref: "#/components/requestBodies/ImageUpload"
      responses:
        "200":
          $ref: "#/components/responses/ProfileImageStored"
        "400":
          $ref: "#/components/responses/InvalidImage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NoProfile"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedImageType"
        "429":
          $ref: "#/components/responses/UploadRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeMyCover
      summary: Remove the logged-in user's cover image (FR-4.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Succeeds also when no cover is set. Not rate limited.
      tags: [media]
      responses:
        "204":
          description: The profile has no cover image.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /media/{fileId}:
    get:
      operationId: getMedia
      summary: Redirect to a stored file after a permission check (NFR-13)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). The owner may always see the file. Anyone
        else may see a profile photo or cover image whose owner is verified and not
        suspended, as with `GET /profiles/{userId}`; other kinds of file are not served
        here yet. A file that does not exist and one the caller may not see get the same
        404 `not_found`. The answer redirects to a presigned URL valid for 10 minutes and
        may be cached privately for 5 minutes, so a cached redirect never points to an
        expired URL.
      tags: [media]
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "302":
          description: The file is at the URL in `Location`.
          headers:
            Location:
              description: A presigned URL to the object, valid for 10 minutes.
              required: true
              schema:
                type: string
            Cache-Control:
              description: Always `private, max-age=300`.
              required: true
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: rs_access
      description: The access token set by `POST /auth/login`.

  parameters:
    FileID:
      name: fileId
      in: path
      required: true
      description: |
        The stored file's ID, a UUID. It is declared as a plain string so that the login
        check runs before it is read (FR-3.1); a value that is not a UUID names no file and
        gets 404 `not_found`.
      schema:
        type: string
    EducationID:
      name: educationId
      in: path
      required: true
      description: |
        The entry's ID, a UUID. It is declared as a plain string so that the login check
        runs before it is read (FR-3.1); a value that is not a UUID names no entry of the
        user and gets 404 `not_found`.
      schema:
        type: string
    ExperienceID:
      name: experienceId
      in: path
      required: true
      description: |
        The entry's ID, a UUID. It is declared as a plain string so that the login check
        runs before it is read (FR-3.1); a value that is not a UUID names no entry of the
        user and gets 404 `not_found`.
      schema:
        type: string
    LanguageID:
      name: languageId
      in: path
      required: true
      description: |
        The entry's ID, a UUID. It is declared as a plain string so that the login check
        runs before it is read (FR-3.1); a value that is not a UUID names no entry of the
        user and gets 404 `not_found`.
      schema:
        type: string
    PublicationID:
      name: publicationId
      in: path
      required: true
      description: |
        The publication's ID, a UUID. It is declared as a plain string so that the login
        check runs before it is read (FR-3.1); a value that is not a UUID names no
        publication of the user and gets 404 `not_found`.
      schema:
        type: string
    PublicationListPage:
      name: page
      in: query
      required: false
      description: The page to return, from 1. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PublicationListPageSize:
      name: pageSize
      in: query
      required: false
      description: |
        Publications per page, from 1. Defaults to 10. A larger value than 50 is reduced
        to 50, and the response says which size was used.
      schema:
        type: integer
        minimum: 1
        default: 10
    LinkID:
      name: linkId
      in: path
      required: true
      description: |
        The link's ID, a UUID. It is declared as a plain string so that the login check
        runs before it is read (FR-3.1); a value that is not a UUID names no link of the
        user and gets 404 `not_found`.
      schema:
        type: string
    TagID:
      name: tagId
      in: path
      required: true
      description: |
        The tag's ID, a UUID. It is declared as a plain string so that the login check runs
        before it is read (FR-3.1); a value that is not a UUID names no tag the user has and
        gets 404 `not_found`.
      schema:
        type: string
    TagQuery:
      name: q
      in: query
      required: false
      description: The text typed so far. Empty or missing gives an empty list.
      schema:
        type: string
    TagLimit:
      name: limit
      in: query
      required: false
      description: |
        Suggestions to return, from 1. Defaults to 10. A larger value than 20 is reduced to
        20.
      schema:
        type: integer
        minimum: 1
        default: 10
    RefreshCookie:
      name: rs_refresh
      in: cookie
      required: false
      description: The refresh token set by `POST /auth/login` or `POST /auth/refresh`.
      schema:
        type: string

  requestBodies:
    ImageUpload:
      required: true
      description: The image in the part named `file`. Its file name and content type are ignored.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary

  schemas:
    Error:
      type: object
      description: The shape of every error response (SRS 5.3).
      required: [code, message]
      properties:
        code:
          type: string
          description: Short machine-readable code, in snake_case.
          example: not_found
        message:
          type: string
          description: Readable explanation for the user.
          example: The requested resource does not exist.

    Health:
      type: object
      required: [status, database, redis, storage]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]
        redis:
          type: string
          enum: [ok]
        storage:
          type: string
          enum: [ok]

    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName:
          type: string
          description: Trimmed, 1 to 200 characters.
          maxLength: 200
          example: Ada Lovelace
        email:
          type: string
          maxLength: 254
          example: ada@example.org
        password:
          type: string
          description: 8 to 128 characters.
          minLength: 8
          maxLength: 128
          format: password

    RegisterResponse:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The address the verification link was sent to.

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token from the verification link.

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254

    PasswordResetConfirm:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: The token from the reset link.
        newPassword:
          type: string
          description: 8 to 128 characters, as at registration.
          minLength: 8
          maxLength: 128
          format: password

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          description: 8 to 128 characters, as at registration, and not the current password.
          minLength: 8
          maxLength: 128
          format: password

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password

    OwnsSharedProjectError:
      type: object
      description: The error shape with the projects that block an account deletion (FR-2.9).
      required: [code, message, projects]
      properties:
        code:
          type: string
          example: owns_shared_project
        message:
          type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRef"

    ProjectRef:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          example: ada@example.org
        password:
          type: string
          maxLength: 128
          format: password

    CurrentUser:
      type: object
      required: [id, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    Role:
      type: string
      description: |
        The platform role (SRS 2.2). Administrators are made only from the command line
        (`make admin`); no operation changes a role.
      enum: [researcher, admin]

    AdminUser:
      type: object
      description: One user account as an administrator sees it in the users list.
      required: [id, fullName, email, role, verified, suspended, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        verified:
          type: boolean
          description: The email address is verified (FR-1.4).
        suspended:
          type: boolean
          description: The account is suspended (FR-3.4).
        createdAt:
          type: string
          format: date-time

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        page:
          type: integer
        pageSize:
          type: integer
          description: The page size used, at most 50.
        total:
          type: integer
          description: The number of users on all pages.

    Profile:
      type: object
      description: |
        A researcher's profile (FR-4.1, FR-4.2, FR-4.4, FR-4.5, FR-4.6, FR-4.7, FR-5.5). The optional text fields are
        always present and null when not set. `connectionStatus` is a placeholder for now;
        later work fills it in.
      required:
        - userId
        - fullName
        - headline
        - bio
        - institution
        - department
        - jobTitle
        - country
        - city
        - interests
        - skills
        - education
        - experience
        - languages
        - publicationCount
        - connectionStatus
        - contact
        - photoUrl
        - coverUrl
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
          description: Empty only for an account that has no profile row yet.
        headline:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        jobTitle:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 code in capitals, such as DE.
          example: DE
        city:
          type: string
          nullable: true
          example: Cambridge
        interests:
          type: array
          description: The user's research interests (FR-4.2), sorted by name ignoring letter case.
          items:
            $ref: "#/components/schemas/Tag"
        skills:
          type: array
          description: The user's skills (FR-4.2), sorted by name ignoring letter case.
          items:
            $ref: "#/components/schemas/Tag"
        education:
          type: array
          description: |
            The user's education entries (FR-4.4): current entries (no `endYear`) first,
            then by `endYear`, latest first, then by `startYear`, latest first.
          items:
            $ref: "#/components/schemas/Education"
        experience:
          type: array
          description: |
            The user's work experience (FR-4.8): current roles first, then by `startDate`,
            latest first, then oldest entry first.
          items:
            $ref: "#/components/schemas/Experience"
        languages:
          type: array
          description: |
            The languages the user knows (FR-4.9): highest proficiency first
            (`native_or_bilingual` first), then oldest entry first.
          items:
            $ref: "#/components/schemas/Language"
        publicationCount:
          type: integer
          description: |
            How many publications the user has confirmed (FR-5.5). The list itself comes
            from `listPublications`.
        connectionStatus:
          $ref: "#/components/schemas/ConnectionStatus"
        contact:
          $ref: "#/components/schemas/PublicContact"
        photoUrl:
          type: string
          nullable: true
          description: The profile photo (FR-4.6) as `/api/v1/media/{fileId}`; null when not set.
          example: /api/v1/media/3f1c2b9e-8a41-4d7e-9c55-2f6a1b0e7d10
        coverUrl:
          type: string
          nullable: true
          description: The cover image (FR-4.6) as `/api/v1/media/{fileId}`; null when not set.

    ProfileImage:
      type: object
      description: A stored profile photo or cover image (FR-4.6).
      required: [url]
      properties:
        url:
          type: string
          description: Where the image is read, `/api/v1/media/{fileId}`.
          example: /api/v1/media/3f1c2b9e-8a41-4d7e-9c55-2f6a1b0e7d10

    Tag:
      type: object
      description: |
        A research interest or skill (FR-4.2). Tags are shared by all users; names that
        differ only in letter case are the same tag, and the name keeps the spelling it was
        first created with.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Machine Learning

    AddTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            Trimmed, and every run of spaces, tabs or line breaks becomes one space; then 1 to
            60 characters.
          maxLength: 60
          example: Machine Learning

    TagSuggestions:
      type: object
      description: Existing tags that match the typed text (FR-4.3), best match first.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    ConnectionStatus:
      type: string
      description: |
        The connection between the caller and the profile's owner (FR-4.5).
        Placeholder: always `none` until connections are added (FR-7); more values come then.
      enum: [none]

    ProfileUpdate:
      type: object
      description: |
        The profile fields a user edits (FR-4.1). Every value is trimmed first. Lengths
        count characters after trimming.
      required: [fullName]
      properties:
        fullName:
          type: string
          description: 1 to 200 characters, one line.
          maxLength: 200
          example: Ada Lovelace
        headline:
          type: string
          nullable: true
          description: At most 220 characters, one line.
          maxLength: 220
        bio:
          type: string
          nullable: true
          description: At most 2000 characters; line breaks are kept.
          maxLength: 2000
        institution:
          type: string
          nullable: true
          description: At most 200 characters, one line.
          maxLength: 200
        department:
          type: string
          nullable: true
          description: At most 200 characters, one line.
          maxLength: 200
        jobTitle:
          type: string
          nullable: true
          description: At most 200 characters, one line.
          maxLength: 200
        country:
          type: string
          nullable: true
          description: An ISO 3166-1 alpha-2 code; letter case is ignored ("de" is stored as "DE").
          example: DE
        city:
          type: string
          nullable: true
          description: At most 100 characters, one line.
          maxLength: 100
          example: Cambridge

    Visibility:
      type: string
      description: |
        Who may see a contact item (FR-4.7): only its owner, or every logged-in user.
        "Connections only" comes with connections (slice 13).
      enum: [only_me, logged_in]

    Birthday:
      type: object
      description: A birthday without a year. `day` is a real day of `month`; 29 February is allowed.
      required: [month, day]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31

    LinkKind:
      type: string
      description: What a profile link points to; the client shows a label and icon for it.
      enum: [website, google_scholar, researchgate, linkedin, github, other]

    ProfileLink:
      type: object
      description: A link on a profile (FR-4.7), visible to every logged-in user.
      required: [id, kind, url]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/LinkKind"
        url:
          type: string
          example: https://scholar.example.org/ada

    AddLinkRequest:
      type: object
      required: [kind, url]
      properties:
        kind:
          $ref: "#/components/schemas/LinkKind"
        url:
          type: string
          description: An https URL with a host, without whitespace, at most 300 characters after trimming.
          maxLength: 300

    Contact:
      type: object
      description: |
        The owner's contact info with who may see each item (FR-4.7). `email` is the
        account's address. `phone` and `birthday` are always present and null when not set.
      required: [email, emailVisibility, phone, phoneVisibility, birthday, birthdayVisibility, links]
      properties:
        email:
          type: string
          format: email
        emailVisibility:
          $ref: "#/components/schemas/Visibility"
        phone:
          type: string
          nullable: true
          description: E.164 format, such as +8801712345678.
          example: "+8801712345678"
        phoneVisibility:
          $ref: "#/components/schemas/Visibility"
        birthday:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Birthday"
        birthdayVisibility:
          $ref: "#/components/schemas/Visibility"
        links:
          type: array
          description: The user's links, oldest first.
          items:
            $ref: "#/components/schemas/ProfileLink"

    ContactUpdate:
      type: object
      description: |
        The contact fields a user edits (FR-4.7). A missing or null `phone` or `birthday`
        clears it.
      required: [emailVisibility, phoneVisibility, birthdayVisibility]
      properties:
        emailVisibility:
          $ref: "#/components/schemas/Visibility"
        phone:
          type: string
          nullable: true
          description: |
            E.164 format: `+`, then 2 to 15 digits, the first not 0. Spaces and hyphens are
            removed first, so "+880 1712-345678" is stored as "+8801712345678".
        phoneVisibility:
          $ref: "#/components/schemas/Visibility"
        birthday:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Birthday"
        birthdayVisibility:
          $ref: "#/components/schemas/Visibility"

    PublicContact:
      type: object
      description: |
        The contact info the viewer of a profile may see (FR-4.7). An item that is hidden
        from the viewer, or not set, is left out; it is never null. The owner sees every
        item that is set. Links are visible to every logged-in user.
      required: [links]
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        birthday:
          $ref: "#/components/schemas/Birthday"
        links:
          type: array
          items:
            $ref: "#/components/schemas/ProfileLink"

    Education:
      type: object
      description: One education entry (FR-4.4). The optional fields are always present and null when not set.
      required: [id, institution, degree, fieldOfStudy, startYear, endYear, grade, description]
      properties:
        id:
          type: string
          format: uuid
        institution:
          type: string
          example: University of Cambridge
        degree:
          type: string
          nullable: true
          example: PhD
        fieldOfStudy:
          type: string
          nullable: true
          example: Computer Science
        startYear:
          type: integer
          example: 2019
        endYear:
          type: integer
          nullable: true
          description: Null while the entry is current.
          example: 2023
        grade:
          type: string
          nullable: true
          example: CGPA 3.57 / 4.00
        description:
          type: string
          nullable: true

    EducationCreate:
      type: object
      description: |
        A new education entry (FR-4.4). Text is trimmed first and every text field except
        `description` must be one line; lengths count characters after trimming. Years run from 1950 to ten years
        after the current year, and `endYear` is not before `startYear`.
      required: [institution, startYear]
      properties:
        institution:
          type: string
          description: 1 to 200 characters.
          maxLength: 200
        degree:
          type: string
          nullable: true
          description: At most 100 characters; empty means not set.
          maxLength: 100
        fieldOfStudy:
          type: string
          nullable: true
          description: At most 100 characters; empty means not set.
          maxLength: 100
        startYear:
          type: integer
        endYear:
          type: integer
          nullable: true
          description: Missing or null while the entry is current.
        grade:
          type: string
          nullable: true
          description: At most 50 characters of free text, such as "First class"; empty means not set.
          maxLength: 50
        description:
          type: string
          nullable: true
          description: At most 2000 characters; line breaks are kept; empty means not set.
          maxLength: 2000

    EducationUpdate:
      type: object
      description: |
        The fields to change in an education entry (FR-4.4). A missing field keeps its
        value. `null` clears `degree`, `fieldOfStudy`, `endYear`, `grade` or
        `description`; `null` for `institution` or `startYear` is refused, because both
        are required. The rules of EducationCreate apply to the entry after the change.
      properties:
        institution:
          type: string
          nullable: true
          maxLength: 200
