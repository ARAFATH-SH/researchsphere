        - conversation.updated
        - unread.changed
        - typing
        - presence
        - notification.created
        - notifications.unread

    RealtimeEvent:
      type: object
      description: |
        One server-to-client WebSocket frame, as JSON text. `data` is `RealtimeMessageCreated`,
        `RealtimeMessageUpdated`, `RealtimeMessageDeleted`, `RealtimeConversationRead`, `RealtimeConversationUpdated`, `MessageUnreadCount`,
        `RealtimeTyping`, `PresenceStatus`, `Notification` or `UnreadNotificationCount`,
        by `type`.
      required: [type, data]
      properties:
        type:
          $ref: "#/components/schemas/RealtimeEventType"
        data:
          type: object

    RealtimeMessageCreated:
      type: object
      required: [message, conversationState]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        conversationState:
          $ref: "#/components/schemas/ConversationState"
        clientId:
          type: string
          format: uuid
          description: |
            The sender's `clientId`, only in the copy sent to the sender's own sockets, so the
