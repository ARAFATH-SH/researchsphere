              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: The saved contact info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: |
            A field is not valid. The code names the first invalid field, in this order:
            `invalid_phone`, `invalid_birthday`, `invalid_visibility`. A body that is not
            JSON gets `bad_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/links:
    post:
      operationId: addMyLink
      summary: Add a link to the logged-in user's profile (FR-4.7)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The URL is trimmed. A user has at most 5 links. Links
        are visible to every logged-in user.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLinkRequest"
      responses:
        "201":
          description: The stored link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLink"
        "400":
          description: |
            The kind is not one of the listed kinds (`invalid_link_kind`), the URL is not an
            https URL with a host, has whitespace or is longer than 300 characters
            (`invalid_link_url`), or the body is not JSON (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The user already has 5 links (`link_limit_reached`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/links/{linkId}:
    delete:
      operationId: removeMyLink
      summary: Remove one of the logged-in user's links (FR-4.7)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). A link that does not exist and one that belongs to
        someone else both get 404 `not_found`.
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/LinkID"
      responses:
        "204":
          description: The link is removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The user has no link with this ID (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/publications:
    get:
      operationId: listMyPublications
      summary: List the logged-in user's confirmed publications (FR-5.5)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Only publications the user has confirmed
        are listed, sorted by year, newest first (no year last), then by when the user
        added them, newest first.
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/PublicationListPage"
        - $ref: "#/components/parameters/PublicationListPageSize"
      responses:
        "200":
          description: One page of the caller's publications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationPage"
        "400":
          description: "`page` or `pageSize` is not a whole number of at least 1 (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: addMyPublication
      summary: Add a publication to the logged-in user's profile by hand (FR-5.1, FR-5.4)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Text is trimmed; an optional field that is missing, null
        or empty after trimming is stored as null. The DOI is stored in its bare,
        lower-case form: a leading `https://doi.org/`, `http://doi.org/`,
        `https://dx.doi.org/`, `http://dx.doi.org/` or `doi:` is removed. A publication
        with a given DOI is stored once (FR-5.4): when one with the same DOI already
        exists, the caller is linked to it, the other fields in the body are ignored, and
        the answer is the existing record with `linked` true. The caller's link is
        confirmed. A user has at most 300 publications.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationCreate"
      responses:
        "201":
          description: The stored publication, or the existing one the caller is now linked to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationAdded"
        "400":
          $ref: "#/components/responses/InvalidPublication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The user already has 300 publications (`publication_limit_reached`), or already
            has the publication with this DOI on their profile (`publication_already_added`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/publications/from-doi:
    post:
      operationId: addMyPublicationFromDOI
      summary: Add a publication to the logged-in user's profile from its DOI (FR-5.2, FR-5.4, FR-5.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The user has seen the preview from
        `lookupPublicationByDOI` and confirms it. When a publication with the DOI is
        already stored, the caller is linked to it with no outside call (FR-5.4, `linked`
        true). Otherwise the metadata comes from the cached lookup or is fetched again
        from OpenAlex, and the record is stored with source `doi`; it cannot be changed
        with `updateMyPublication`. The caller's link is confirmed. A user has at most 300
        publications. Fetching from OpenAlex counts toward the lookup limit.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationFromDOI"
      responses:
        "201":
          description: The stored publication, or the existing one the caller is now linked to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationAdded"
        "400":
          $ref: "#/components/responses/InvalidDOI"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DOINotFound"
        "409":
          description: |
            The user already has 300 publications (`publication_limit_reached`), or already
            has the publication with this DOI on their profile (`publication_already_added`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/LookupRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/MetadataUnavailable"

  /publications/lookup:
    get:
      operationId: lookupPublicationByDOI
      summary: Preview the metadata of a publication by its DOI (FR-5.2, FR-5.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The DOI is normalized as in `addMyPublication`. When a
        publication with the DOI is already stored, the stored record is returned with no
        outside call. Otherwise title, year, venue, abstract and link come from OpenAlex:
        text is trimmed, line breaks in the title and venue become spaces, a title over
        500, a venue over 300 or an abstract over 5000 characters is cut at a word
        boundary, a year outside 1900 to next year is left out, and a missing link becomes
        `https://doi.org/<doi>`. Successful lookups are cached for 24 hours. A user may
        make 30 lookups an hour that reach OpenAlex; cached and stored DOIs do not count.
      tags: [profile]
      parameters:
        - name: doi
          in: query
          required: false
          description: |
            A DOI such as `10.1145/3292500.3330701`, optionally as a `https://doi.org/` link
            or with a `doi:` prefix. It is declared optional so that the login check runs
            before it is read (FR-3.1); a missing or empty value gets 400 `invalid_doi`.
          schema:
            type: string
      responses:
        "200":
          description: The metadata to show for confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationPreview"
        "400":
          $ref: "#/components/responses/InvalidDOI"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DOINotFound"
        "429":
          $ref: "#/components/responses/LookupRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/MetadataUnavailable"

  /profiles/me/orcid:
    put:
      operationId: setMyOrcidId
      summary: Save or clear the ORCID iD on the logged-in user's profile (FR-5.3)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The iD is trimmed; one leading `https://orcid.org/` or
        `http://orcid.org/` is removed (ignoring case) and a final `x` is upper-cased. It
        must then be of the form `0000-0000-0000-000X` with a valid check digit (ISO 7064
        11,2). Null or an empty value clears it. Ownership of the iD is not proven yet
        (docs/decisions.md); an iD saved on another profile is refused.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrcidIdUpdate"
      responses:
        "200":
          description: The saved iD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidIdUpdate"
        "400":
          description: |
            The iD is not a valid ORCID iD (`invalid_orcid_id`). A body that is not JSON
            gets `bad_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another profile has this ORCID iD (`orcid_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/publications/orcid-works:
    get:
      operationId: listMyOrcidWorks
      summary: List the public works of the ORCID iD on the logged-in user's profile (FR-5.3, FR-5.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The works come from the ORCID public API, one item per
        work group, in ORCID's order; works without a title are left out. Text is
        normalized as in `lookupPublicationByDOI`, a DOI that is not valid is left out, and
        a missing link becomes `https://doi.org/<doi>` when there is a DOI. Each item says
        whether a publication with its DOI is already stored (FR-5.4). The list is cached
        for one hour per ORCID iD. A user may make 10 calls an hour that reach ORCID;
        cached lists do not count. The list is not paginated: the user picks from all of
        it.
      tags: [profile]
      responses:
        "200":
          description: The works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidWorkList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrcidNotFound"
        "409":
          $ref: "#/components/responses/OrcidNotSet"
        "429":
          $ref: "#/components/responses/OrcidRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/OrcidUnavailable"

  /profiles/me/publications/from-orcid:
    post:
      operationId: importMyOrcidWorks
      summary: Import the selected ORCID works into the logged-in user's profile (FR-5.3, FR-5.4, FR-5.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Every put-code must be in the current list of
        `listMyOrcidWorks` (from the cache, or fetched again). For each selected work, in
        the order given:

        - a DOI that is already stored links the caller to that record (FR-5.4, `linked`);
        - a new DOI is fetched from OpenAlex as in `addMyPublicationFromDOI` (source `doi`,
          with the abstract); when OpenAlex fails, does not know the DOI or the DOI
          lookup limit is used up, the record is made from the ORCID data (source `orcid`);
        - a work without a DOI is made from the ORCID data (source `orcid`);
        - a work the caller has already confirmed, or a second work with the same DOI, is
          `skipped`.

        The caller's links are confirmed. Imported records cannot be changed with
        `updateMyPublication`. A user has at most 300 publications: when the import would
        go over, nothing is saved. The import is saved all at once or not at all.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrcidImportRequest"
      responses:
        "200":
          description: What happened to each selected work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrcidImportResult"
        "400":
          description: |
            The list is empty, has more than 100 put-codes, repeats one, or has one that is
            not in the current ORCID list (`invalid_put_code`). A body that is not JSON
            gets `bad_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrcidNotFound"
        "409":
          description: |
            The profile has no ORCID iD (`orcid_not_set`), or the import would take the
            user over 300 publications (`publication_limit_reached`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/OrcidRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/OrcidUnavailable"

  /profiles/me/publications/{publicationId}:
    patch:
      operationId: updateMyPublication
      summary: Change some fields of one of the logged-in user's publications (FR-5.1)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). A field that is missing keeps its value; `null` clears
        `venue`, `abstract`, `url` or `doi`. The rules of PublicationCreate apply to the
        record after the change. Only a publication that was added by hand and that no
        other user is linked to can be changed. A publication the caller is not linked to
        gets 404 `not_found`, before the body is checked.
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/PublicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationUpdate"
      responses:
        "200":
          description: The publication after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "400":
          $ref: "#/components/responses/InvalidPublication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The user has no publication with this ID (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Another user is linked to the publication or it was not added by hand
            (`publication_shared_readonly`), or another publication already has the new DOI
            (`duplicate_doi`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeMyPublication
      summary: Remove a publication from the logged-in user's profile (FR-5.7)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Removes only the caller's link; the publication stays for
        every other linked user and is deleted when no user is linked to it any more. A
        publication the caller is not linked to gets 404 `not_found`.
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/PublicationID"
      responses:
        "204":
          description: The publication is removed from the caller's profile.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The user has no publication with this ID (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/{userId}/publications:
    get:
      operationId: listPublications
      summary: List any user's confirmed publications to a logged-in user (FR-5.5)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Only publications the user has confirmed
        are listed, in the order of `listMyPublications`. An unknown, suspended or
        unverified account gets the same 404 `not_found`, as for the profile, and so does a
        viewer whom this user has blocked (FR-16.9).
      tags: [profile]
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            The user's ID, a UUID. It is declared as a plain string so that the login check
            runs before it is read (FR-3.1); a value that is not a UUID names no user and
            gets 404 `not_found`.
          schema:
            type: string
        - $ref: "#/components/parameters/PublicationListPage"
        - $ref: "#/components/parameters/PublicationListPageSize"
      responses:
        "200":
          description: One page of the user's publications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationPage"
        "400":
          description: "`page` or `pageSize` is not a whole number of at least 1 (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/{userId}/connections:
    get:
      operationId: listProfileConnections
      summary: List any user's connections to a logged-in user (FR-7.4)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Lists the user's connections in the order
        of `listMyConnections`, leaving out suspended and unverified accounts and anyone who
        has blocked the viewer (FR-16.9). An unknown, suspended or unverified account gets the
        same 404 `not_found`, as for the profile, and so does a viewer whom this user has
        blocked.
      tags: [connections]
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            The user's ID, a UUID. It is declared as a plain string so that the login check
            runs before it is read (FR-3.1); a value that is not a UUID names no user and
            gets 404 `not_found`.
          schema:
            type: string
        - $ref: "#/components/parameters/ConnectionListPage"
      responses:
        "200":
          description: One page of the user's connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionPage"
        "400":
          $ref: "#/components/responses/InvalidConnectionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/photo:
    put:
      operationId: uploadMyPhoto
      summary: Upload or replace the logged-in user's profile photo (FR-4.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The file may be at most 5 MB. Its type is read from its
        first bytes, not its name or header: JPEG, PNG or WebP (not animated). Its width
        and height are read before it is decoded, and an image over 8000 pixels on a side
        is refused. The image is cropped to a centred square and stored as a 400x400 JPEG,
        so nothing else in the file (EXIF, GPS, other data) is kept. A previous photo is
        removed. A user may upload at most 5 images (photo and cover together) per hour;
        refused files do not count.
      tags: [media]
      requestBody:
        $ref: "#/components/requestBodies/ImageUpload"
      responses:
        "200":
          $ref: "#/components/responses/ProfileImageStored"
        "400":
          $ref: "#/components/responses/InvalidImage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NoProfile"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedImageType"
        "429":
          $ref: "#/components/responses/UploadRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeMyPhoto
      summary: Remove the logged-in user's profile photo (FR-4.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Succeeds also when no photo is set. Not rate limited.
      tags: [media]
      responses:
        "204":
          description: The profile has no photo.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/cover:
    put:
      operationId: uploadMyCover
      summary: Upload or replace the logged-in user's cover image (FR-4.6)
      description: |
        As `PUT /profiles/me/photo`, except that the file may be at most 8 MB and the
        image is cropped to a centred 4:1 rectangle and stored as a 1584x396 JPEG.
      tags: [media]
      requestBody:
        $ref: "#/components/requestBodies/ImageUpload"
      responses:
        "200":
          $ref: "#/components/responses/ProfileImageStored"
        "400":
          $ref: "#/components/responses/InvalidImage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NoProfile"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedImageType"
        "429":
          $ref: "#/components/responses/UploadRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeMyCover
      summary: Remove the logged-in user's cover image (FR-4.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Succeeds also when no cover is set. Not rate limited.
      tags: [media]
      responses:
        "204":
          description: The profile has no cover image.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /media/{fileId}:
    get:
      operationId: getMedia
      summary: Redirect to a stored file after a permission check (NFR-13)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). The owner may always see the file. Anyone
        else may see a profile photo or cover image whose owner is verified and not
        suspended, as with `GET /profiles/{userId}`; other kinds of file are not served
        here yet. A file that does not exist and one the caller may not see get the same
        404 `not_found`. The answer redirects to a presigned URL valid for 10 minutes and
        may be cached privately for 5 minutes, so a cached redirect never points to an
        expired URL.
      tags: [media]
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "302":
          description: The file is at the URL in `Location`.
          headers:
            Location:
              description: A presigned URL to the object, valid for 10 minutes.
              required: true
              schema:
                type: string
            Cache-Control:
              description: Always `private, max-age=300`.
              required: true
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /connections:
    get:
      operationId: listMyConnections
      summary: List the logged-in user's connections (FR-7.4)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). 20 per page, most recently connected
        first. Suspended and unverified accounts are left out, and so is their count in
        `total`.

        With `q`, only the connections whose full name, headline or institution match it
        (the group member picker, FR-16.6), by the rule of the researcher search (FR-6.2):
        a name containing `q` (exact, then starting with it, then containing it), and only
        when no connection's name contains it, a name similar to it (pg_trgm word similarity,
        for typos); then an institution, then a headline containing it. Within a rank the
        most similar, then the most recently connected come first; `total` counts the matches.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionListPage"
        - name: q
          in: query
          required: false
          description: |
            The text to look for, 2 to 100 characters after trimming; otherwise 400
            `bad_request` with `field: q`. Leave it out for every connection.
          schema:
            type: string
      responses:
        "200":
          description: One page of the caller's connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionPage"
        "400":
          description: |
            `page` is not a whole number of at least 1, or `q` does not have 2 to 100
            characters (`bad_request`, with `field`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /connections/{userId}:
    delete:
      operationId: removeConnection
      summary: Remove a connection (FR-7.5)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Either user may remove it. Afterwards either may send a
        new request.
      tags: [connections]
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            The other user's ID, a UUID. It is declared as a plain string so that the login
            check runs before it is read (FR-3.1); a value that is not a UUID gets 404
            `not_found`.
          schema:
            type: string
      responses:
        "204":
          description: The connection is removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The caller is not connected with this user (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /connections/requests:
    post:
      operationId: sendConnectionRequest
      summary: Send a connection request (FR-7.1, FR-7.2, FR-7.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Checks run in this order: a request to oneself
        (`cannot_connect_to_self`), the daily limit (`rate_limited`), the receiver (an
        unknown, suspended or unverified account gets 404 `not_found`, as for the
        profile), a block (FR-16.9: the same 404 for the blocked person, 409
        `you_blocked_this_user` for the blocker), then the existing requests and connections
        between the two, in either direction (409). A rejected request does not block a new
        one (FR-7.6).

        Each user may send 50 requests a day; only requests that were created count.
        Two users who send each other a request at the same moment get one request: the
        later one gets 409 `request_pending_from_them`.
      tags: [connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequestCreate"
      responses:
        "201":
          description: The request is sent; the item is as it appears in the sent list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionRequest"
        "400":
          description: |
            `userId` is the caller's own ID (`cannot_connect_to_self`), or the body is not
            valid (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            A request or connection already exists between the two (FR-7.2):
            `request_already_pending` (the caller's earlier request is still pending),
            `request_pending_from_them` (the other user has sent the caller a request that
            is still pending; `requestId` names it, so the caller can accept it instead),
            `already_connected`, or `you_blocked_this_user` (FR-16.9).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionConflict"
        "429":
          description: The user has sent 50 requests in the current day (`rate_limited`).
          headers:
            Retry-After:
              description: Seconds until the day ends and requests are accepted again.
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /connections/requests/received:
    get:
      operationId: listReceivedConnectionRequests
      summary: List the pending requests sent to the logged-in user (FR-7.4)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Only pending requests, 20 per page, newest
        first; each item names the sender. Requests from suspended and unverified accounts
        are left out.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionListPage"
      responses:
        "200":
          description: One page of received requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionRequestPage"
        "400":
          $ref: "#/components/responses/InvalidConnectionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /connections/requests/sent:
    get:
      operationId: listSentConnectionRequests
      summary: List the pending requests the logged-in user sent (FR-7.4)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Only pending requests, 20 per page, newest
        first; each item names the receiver. A rejected request simply leaves this list,
        as a cancelled one does (FR-7.6). Requests to suspended and unverified accounts are
        left out.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionListPage"
      responses:
        "200":
          description: One page of sent requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionRequestPage"
        "400":
          $ref: "#/components/responses/InvalidConnectionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /connections/requests/{requestId}:
    delete:
      operationId: cancelConnectionRequest
      summary: Cancel a pending request the logged-in user sent (FR-7.3)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Only the sender may cancel, and only while the request
        is pending; anything else gets 404 `not_found`, which does not reveal whether the
        request exists.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionRequestID"
      responses:
        "204":
          description: The request is cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /connections/requests/{requestId}/accept:
    post:
      operationId: acceptConnectionRequest
      summary: Accept a pending request sent to the logged-in user (FR-7.3)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Only the receiver may accept, and only while the request
        is pending and the sender is a verified account that is not suspended; anything
        else gets 404 `not_found`, which does not reveal whether the request exists.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionRequestID"
      responses:
        "200":
          description: The two users are connected; the item names the sender.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /connections/requests/{requestId}/reject:
    post:
      operationId: rejectConnectionRequest
      summary: Reject a pending request sent to the logged-in user (FR-7.3, FR-7.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Only the receiver may reject, and only while the request
        is pending and the sender is a verified account that is not suspended; anything
        else gets 404 `not_found`. The sender is not told: the request leaves their sent
        list and they may send a new one (FR-7.6).
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionRequestID"
      responses:
        "204":
          description: The request is rejected.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /blocks:
    get:
      operationId: listBlockedPeople
      summary: List the people the logged-in user has blocked (FR-16.9)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). 20 per page, most recently blocked first.
        Suspended and unverified accounts are left out, as in every other list.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/PageFromOne"
      responses:
        "200":
          description: One page of blocked people.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedPersonPage"
        "400":
          description: "`page` is not a whole number of at least 1 (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: blockUser
      summary: Block a user (FR-16.9)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Blocking someone already blocked succeeds and changes
        nothing. In one transaction it removes the connection and the pending connection
        requests between the two, in both directions, deletes the notifications between them
        and declines a pending message request between them. Each of the two may block the
        other.
      tags: [connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockRequest"
      responses:
        "204":
          description: The user is blocked.
        "400":
          description: |
            `userId` is the caller's own ID (`cannot_block_self`), or the body is not valid
            (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /blocks/{userId}:
    delete:
      operationId: unblockUser
      summary: Unblock a user (FR-16.9)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Unblocking someone who is not blocked, or an unknown ID,
        succeeds and changes nothing. No removed connection, request or notification comes
        back.
      tags: [connections]
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            The blocked user's ID, a UUID. It is declared as a plain string so that the login
            check runs before it is read (FR-3.1).
          schema:
            type: string
      responses:
        "204":
          description: The user is not blocked by the caller.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications:
    get:
      operationId: listNotifications
      summary: List the logged-in user's notifications, newest first (FR-9.5)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Only the caller's own notifications, newest
        first (then by ID), paged by cursor: pass the previous page's `nextCursor` to get
        the next one. Notifications whose actor is suspended or not verified are left out;
        those of a deleted account are gone. Each item links to the page it is about.
      tags: [notifications]
      parameters:
        - name: cursor
          in: query
          required: false
          description: |
            `nextCursor` from the previous page; leave it out for the first page. A value
            the server did not issue gets 400 `bad_request`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: |
            Items to return, from 1. Defaults to 20. A larger value than 50 is reduced to
            50; a value below 1 gets 400 `bad_request`.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          description: "`cursor` or `limit` is not valid (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: Count the logged-in user's unread notifications (FR-9.4)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Counts the unread items the list would
        show, so the badge matches it. The web client asks every 60 seconds; this
        operation has no rate limit of its own.
      tags: [notifications]
      responses:
        "200":
          description: The number of unread notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotificationCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one of the logged-in user's notifications as read (FR-9.6)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Marking a notification that is already read
        succeeds and keeps its first read time. Another user's notification, one the list
        leaves out, or an unknown ID gets 404 `not_found`.
      tags: [notifications]
      parameters:
        - name: notificationId
          in: path
          required: true
          description: |
            The notification's ID, a UUID. It is declared as a plain string so that the
            login check runs before it is read (FR-3.1); a value that is not a UUID names no
            notification and gets 404 `not_found`.
          schema:
            type: string
      responses:
        "204":
          description: The notification is read.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all of the logged-in user's notifications as read (FR-9.6)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Marks every unread notification the list
        would show and says how many there were.
      tags: [notifications]
      responses:
        "200":
          description: How many notifications were marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsMarked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /messages/direct:
    post:
      operationId: sendDirectMessage
      summary: Send a message to a user, finding or creating the direct conversation (FR-16.1, FR-16.2, FR-16.10)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Two users have exactly one direct conversation. When none
        exists it is created: `active` when the two are connected (FR-16.1), otherwise a
        `request` that the receiver must accept (FR-16.2).

        Checks run in this order: oneself (`cannot_message_self`), the body (`invalid_body`),
        `clientId` (a value already used by the sender returns the original message with
        200, whatever the conversation's state is now, and uses no quota), the message
        limits (`rate_limited`), the receiver (404 `not_found` for unknown, suspended or
        not verified), a block (FR-16.9), the request limits (`rate_limited`, only when this
        message would create a request), then the conversation's state (`request_pending`,
        `conversation_closed`). A pending request refuses both members until the receiver
        accepts it; if they have connected meanwhile it becomes `active` and the message
        is sent. A `declined` conversation stays closed, also after the two connect.

        A block refuses both users. The blocker gets 409 `you_blocked_this_user`. The blocked
        person gets 403 `cannot_message` when the two have a conversation, and otherwise the
        same 404 `not_found` as for an unknown user. A caller who has blocked the other and
        is also blocked by them gets the blocker's answer.
      tags: [messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendDirectMessageRequest"
      responses:
        "200":
          description: This `clientId` was already used; the original message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentMessage"
        "201":
          description: The message is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentMessage"
        "400":
          $ref: "#/components/responses/InvalidMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MessageForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MessageRefused"
        "429":
          $ref: "#/components/responses/MessageRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /messages/unread-count:
    get:
      operationId: getMessageUnreadCount
      summary: Count unread messages and pending message requests (FR-16.3)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). `total` counts messages from others after
        the caller's read marker in active conversations. `requests` counts the requests
        the `requests` box shows. Messages create no notification; this is their badge.
      tags: [messaging]
      responses:
        "200":
          description: The two counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageUnreadCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /messages/search:
    get:
      operationId: searchMessages
      summary: Search the text of the caller's own conversations (FR-16.8, NFR-13)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Only what the caller could read in the
        thread is searched, by the same rule (NFR-13): conversations they are a member of
        now, in any state (a request only by its two members, and declined or blocked
        conversations stay searchable), and in a group only messages from the moment they
        joined. Deleted messages, the earlier text of edited messages and system messages
        are never searched.

        The text of a message and the names of its attachments are searched. Text in
        Bangla, English or both is split into words without any language's stemming. A
        word match (every word of `q` appears as a word, ignoring letter case) ranks above
        a similar match (trigram word similarity of at least 0.55, which finds partial
        words and most one-letter typos); within each, newer messages come first. Each
        message appears once: when both its text and an attachment name match, the better
        match decides, and the text wins a tie.

        Each user may search 30 times a minute (429 `rate_limited`).
      tags: [messaging]
      parameters:
        - name: q
          in: query
          required: false
          description: |
            The search text, 2 to 100 characters after trimming, else 400 `bad_request` with
            `field` `q`. It is required: it is declared optional only so that the session is
            checked first (the generated code checks a required parameter before the session,
            as for `searchPeople`).
          schema:
            type: string
          example: গবেষণা
        - name: conversationId
          in: query
          required: false
          description: |
            Search only this conversation. One the caller is not a member of gets 404
            `not_found`, the same answer as for one that does not exist.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Only messages sent by this user.
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          required: false
          description: Only messages sent at or after this moment (RFC 3339, inclusive).
          schema:
            type: string
            format: date-time
        - name: before
          in: query
          required: false
          description: Only messages sent before this moment (RFC 3339, exclusive).
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          description: "`nextCursor` from the previous page. A value the server did not issue gets 400 `bad_request`."
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: |
            Items to return, from 1. Defaults to 20. A larger value than 50 is reduced to
            50; a value below 1 gets 400 `bad_request`.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of matching messages, best match first, then newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSearchPage"
        "400":
          description: |
            `q`, `conversationId`, `from`, `after`, `before`, `cursor` or `limit` is not
            valid (`bad_request`, with `field` naming the parameter).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/MessageSearchRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations:
    get:
      operationId: listConversations
      summary: List the logged-in user's conversations, newest activity first (FR-16.1 to FR-16.3)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). `inbox` holds active conversations and the
        requests the caller sent; `requests` holds requests sent to the caller, leaving out
        those whose sender is now suspended or not verified, since they cannot be answered.
        A declined conversation is in neither box. A conversation whose other member is
        suspended or not verified stays in the inbox, read-only: `otherMember.available` is
        false. Ordered by last activity, then by ID, paged by cursor.
      tags: [messaging]
      parameters:
        - name: box
          in: query
          required: false
          description: Which box to list; `inbox` when left out. Any other value gets 400 `bad_request`.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: |
            `nextCursor` from the previous page; leave it out for the first page. A value
            the server did not issue gets 400 `bad_request`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: |
            Items to return, from 1. Defaults to 20. A larger value than 50 is reduced to
            50; a value below 1 gets 400 `bad_request`.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "400":
          description: "`box`, `cursor` or `limit` is not valid (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations/groups:
    post:
      operationId: createGroup
      summary: Create a group conversation (FR-16.6, FR-16.10)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The caller becomes the owner. Checks run in this order: the
        name (`invalid_group_name`: 1 to 100 characters after trimming, one line), `memberIds`
        (`bad_request` with `field`: 1 to 49 other users, not the caller; repeats count once),
        `clientId` (a value the caller already used returns that group with 200 while the
        caller is still in it, 404 `not_found` otherwise), the caller's standing
        (`account_suspended`), the limits (`rate_limited`: 10 groups a day, and 100 added
        members a day counted over creating and adding), then the members: each must be a
        connection of the caller, verified, not suspended, with no block either way. Otherwise
        400 `ineligible_members` lists them in `userIds`, without saying why for any of them.
        A messaging restriction does not stop this (FR-15.6). The thread starts with a
        `group_created` system message, and each member gets a `group_added` notification.
      tags: [messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "200":
          description: This `clientId` was already used; the group it created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "201":
          description: The group, with its members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/GroupInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/GroupRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: Get one of the logged-in user's conversations (FR-16.1, FR-16.6, NFR-13)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Anyone who is not a member gets 404
        `not_found`, the same answer as for an unknown ID (NFR-13). This holds for
        administrators too: they read a conversation only through a report on it
        (`getMessageReport`). A former member of a group gets 404 as well. For a group,
        `group.members` lists the current members.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: renameGroup
      summary: Rename a group (FR-16.6)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Only the owner. Checks run in this order: the name
        (`invalid_group_name`), membership (404 `not_found` for a non-member and for a direct
        conversation, NFR-13), the owner (403 `not_group_owner`), the caller's standing
        (`account_suspended`). The same name after trimming answers 200 and changes nothing;
        otherwise a `group_renamed` system message is written.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameGroupRequest"
      responses:
        "200":
          description: The group, with its members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/GroupInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/GroupForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations/{conversationId}/members:
    post:
      operationId: addGroupMembers
      summary: Add members to a group (FR-16.6, FR-16.10)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Only the owner. Checks run in this order: `userIds`
        (`bad_request` with `field`: 1 to 49 users, not the caller), membership (404
        `not_found`), the owner (403 `not_group_owner`), the caller's standing, the limit of
        100 added members a day (`rate_limited`), then each new member under the rules of
        `createGroup` (400 `ineligible_members` with `userIds`), and the size: at most 50
        members in all (409 `group_full`). People already in the group are left as they are;
        when all of them are, nothing changes. A new member sees only messages from the
        `member_added` system message on, and gets a `group_added` notification.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGroupMembersRequest"
      responses:
        "200":
          description: The group, with its members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/GroupInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/GroupForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`group_full`: the group would have more than 50 members. Nothing changes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/GroupRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations/{conversationId}/members/{userId}:
    delete:
      operationId: removeGroupMember
      summary: Remove a member from a group (FR-16.6, NFR-13)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Only the owner. Checks run in this order: membership of the
        caller (404 `not_found`), the owner (403 `not_group_owner`), the owner removing
        themselves (400 `cannot_remove_self`: use `leaveGroup`), the caller's standing, then
        the user (404 `not_found` when not a member). The removed member loses all access at
        once: the group answers them 404 and leaves their list. A `member_removed` system
        message is written.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: userId
          in: path
          required: true
          description: |
            The member's ID, a UUID. It is declared as a plain string so that the login check
            runs before it is read (FR-3.1); a value that is not a UUID names no member and
            gets 404 `not_found`.
          schema:
            type: string
      responses:
        "204":
          description: The member is removed.
        "400":
          description: "`cannot_remove_self`: the owner leaves with `leaveGroup` instead."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/GroupForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations/{conversationId}/leave:
    post:
      operationId: leaveGroup
      summary: Leave a group (FR-16.6, NFR-13)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Any member may, also while suspended or restricted. A
        non-member and a direct conversation get 404 `not_found`. The caller loses all access
        at once. A `member_left` system message is written. When the owner leaves, the member
        who joined earliest becomes owner and an `owner_changed` system message follows; when
        the last member leaves, the group is closed.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204":
          description: The caller has left.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      summary: List a conversation's messages, newest first (FR-16.1, FR-16.3, NFR-13)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Anyone who is not a member gets 404
        `not_found` (NFR-13). `otherLastReadMessageId` is the other member's read marker,
        so the client can show "Seen" under the caller's latest message at or before it. In a
        group it is null and `readers` gives every other current member's marker, for "Seen by
        N"; a member sees only the messages created from the moment they joined (FR-16.6).
        System messages (`kind: system`) are part of the thread.

        Paging (items are always newest first): no cursor gives the newest messages;
        `before` the ones older than a message; `after` the ones newer than a message;
        `around` a page centred on one message, so a search result can be shown in its
        place: the message itself, up to (limit - 1) / 2 (rounded down) older ones and the
        rest newer, a short side's room going to the other. `nextBefore` and `nextAfter` are
        set when there is more in that direction. At most one of `before`, `after` and
        `around` is allowed (400 `bad_request` with `field`). An `around` message the caller
        cannot see (another conversation, sent before they joined, or none) gets 404
        `not_found`, as the thread hides it. `people` names every sender and every user a
        system message names on the page, former members included (FR-16.6).
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: before
          in: query
          required: false
          description: |
            `nextBefore` from the previous page; leave it out for the newest messages. A
            value that is not a UUID gets 400 `bad_request`.
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: |
            `nextAfter` from the previous page, for newer messages. A value that is not a
            UUID gets 400 `bad_request`.
          schema:
            type: string
        - name: around
          in: query
          required: false
          description: |
            A message ID: the page is centred on it. A value that is not a UUID gets 400
            `bad_request`; a message the caller cannot see gets 404.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: |
            Items to return, from 1. Defaults to 30. A larger value than 100 is reduced to
            100; a value below 1 gets 400 `bad_request`.
          schema:
            type: integer
            minimum: 1
            default: 30
      responses:
        "200":
          description: One page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          description: "`before`, `after`, `around` or `limit` is not valid, or more than one cursor is given (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: sendMessage
      summary: Send a message in a conversation (FR-16.1, FR-16.2, FR-16.10, NFR-13)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Checks run in this order: the body (`invalid_body`),
        membership (404 `not_found`, NFR-13), `clientId` (a value already used by the sender
        returns the original message with 200), the message limits (`rate_limited`), the
        other member (404 `not_found` when suspended or not verified), a block (FR-16.9: 403
        `cannot_message` for the blocked person, 409 `you_blocked_this_user` for the blocker),
        then the conversation's state (`request_pending`, `conversation_closed`), as for
        `POST /messages/direct`. In a group there is no other member and no request: after the
        limits, a former member gets 404 `not_found`, and a block between two members stops
        nobody (FR-16.6).

        `attachmentIds` (FR-16.7) sends up to 5 files from `uploadAttachment`, in that order;
        `body` may then be left out. Each must have been uploaded by the caller to this
        conversation, not be sent yet, not have expired and not have failed or been blocked by
        its scan, else 400 `invalid_attachment` (`field: attachmentIds`) and nothing is sent. A
        file still being scanned may be sent; the others see it once it is clean.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: This `clientId` was already used; the original message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentMessage"
        "201":
          description: The message is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentMessage"
        "400":
          $ref: "#/components/responses/InvalidMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MessageForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MessageRefused"
        "429":
          $ref: "#/components/responses/MessageRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations/{conversationId}/attachments:
    post:
      operationId: uploadAttachment
      summary: Upload a file to send with a message later (FR-16.7, NFR-13)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Only a member who can send in the conversation now may upload,
        with the checks of `sendMessage` in the same order and codes, except that the message
        limits do not apply: membership (404 `not_found`), standing (`account_suspended`,
        `messaging_restricted`), the other member (404), a block (`cannot_message`,
        `you_blocked_this_user`) and the state (`request_pending`, `conversation_closed`).

        The file may be at most 25 MB. Its type is read from its content, never from its name
        or the part's header: PDF, PNG, JPEG, WebP (not animated), DOCX, XLSX or PPTX. An Office
        file must be an Office Open XML package whose main part is a document, workbook or
        presentation; macro-enabled files (docm, xlsm, pptm), templates, slide shows and the
        legacy formats (doc, xls, ppt) are refused with `unsupported_type`. An image is decoded
        and encoded again at its own size, so EXIF, GPS and any other data in the file are
        dropped: a JPEG stays a JPEG, a PNG a PNG, and a WebP becomes a PNG when it has
        transparency and a JPEG otherwise. Documents are stored as uploaded.

        The name the client gave the file is kept for display only, cleaned up: no folders,
        control characters or quotes, at most 200 characters, and ending with the extension of
        the type that was found. The file is scanned for malware after the upload; nobody,
        the uploader included, can download it before the scan says `clean`.

        The answer's `id` goes into `attachmentIds` of `sendMessage` in this conversation. An
        attachment that is not sent by `expiresAt` (24 hours) is deleted. A user may upload at
        most 20 files per hour and 200 MB per day; refused files do not count.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        $ref: "#/components/requestBodies/AttachmentUpload"
      responses:
        "201":
          description: The file is stored and waits for its scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUpload"
        "400":
          $ref: "#/components/responses/InvalidImage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MessageForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MessageRefused"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedAttachmentType"
        "429":
          $ref: "#/components/responses/AttachmentRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /attachments/{attachmentId}:
    get:
      operationId: getAttachment
      summary: Download an attachment after a permission check (FR-16.7, NFR-13)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Only a current member who can see the message
        may download: in a group, a member sees only the messages from the moment they joined.
        The uploader may also download an attachment not sent yet. An attachment of a deleted
        message, one the caller may not see and an unknown ID all get the same 404 `not_found`.

        Then the scan decides: `scan_pending` (409) while it runs, `scan_failed` (409) when the
        scanner could not read the file, `file_removed` (410) when malware was found and the
        file was deleted. A clean file redirects to a presigned URL valid for 5 minutes, whose
        answer carries `Content-Disposition: attachment` with the file's name and the stored
        content type, so a browser saves the file and never shows it inline.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "302":
          $ref: "#/components/responses/AttachmentRedirect"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AttachmentNotReady"
        "410":
          $ref: "#/components/responses/AttachmentRemoved"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations/{conversationId}/messages/{messageId}:
    patch:
      operationId: editMessage
      summary: Edit one's own message (FR-16.5, FR-16.10, NFR-13)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Only the sender may edit, within `MESSAGE_EDIT_WINDOW`
        (15 minutes by default) of sending, and only while they could send in the
        conversation. Checks run in this order: the body (`invalid_body`), the message (404
        `not_found` unless it is the caller's, in this conversation and not deleted: anyone
        else learns nothing, NFR-13), the window (409 `edit_window_closed`), an unchanged body
        (200 with the message as it is: nothing changes, no quota is used and no event goes
        out), then the checks of `POST /conversations/{conversationId}/messages`: the caller's
        standing, the message limits (an edit counts as a message), the other member, a block
        and the conversation's state. In a group the checks are those of sending in a group.
        A system message cannot be edited (404). The earlier text is kept for moderation and
        shown only through `GET /admin/message-reports/{reportId}`.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMessageRequest"
      responses:
        "200":
          description: The message, with the new text and `editedAt`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MessageForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MessageEditRefused"
        "429":
          $ref: "#/components/responses/MessageRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteMessage
      summary: Delete one's own message (FR-16.5, NFR-13)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Only the sender may delete, at any time, also in a closed
        conversation or after a block. The message stays in its place with `deleted: true`
        and a null `body`. Deleting it again changes nothing. Anyone else, and an unknown
        message, gets 404 `not_found` (NFR-13). The text is kept for moderation and shown only
        through `GET /admin/message-reports/{reportId}`.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: The message is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      summary: Move the logged-in user's read marker forward (FR-16.3, NFR-13)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The marker only moves forward: a message at or before it
        succeeds and changes nothing. A message that is not in this conversation, or a
        caller who is not a member, gets 404 `not_found`.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkConversationReadRequest"
      responses:
        "204":
          description: The marker is at or after the message.
        "400":
          description: The request body is not valid (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations/{conversationId}/accept:
    post:
      operationId: acceptMessageRequest
      summary: Accept a message request (FR-16.2)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Only the receiver of a pending request may; the
        conversation becomes `active`. The sender, a non-member, a conversation that is not
        a pending request, or a sender who is now suspended or not verified all get the
        same 404 `not_found`.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The conversation, now active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations/{conversationId}/decline:
    post:
      operationId: declineMessageRequest
      summary: Decline a message request (FR-16.2)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Under the same conditions as accepting, the conversation
        becomes `declined`: it leaves both boxes and nobody can send in it again, also if
        the two connect later (409 `conversation_closed`).
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The conversation, now declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /conversations/{conversationId}/reports:
    post:
      operationId: reportConversation
      summary: Report a conversation or one of its messages (FR-16.9, NFR-13)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Anyone who is not a member gets 404 `not_found` (NFR-13).
        Checks run in this order: membership, `reason`, `details` and `messageId`
        (`bad_request`, with `field`), the message (404 `not_found` when it is not in this
        conversation, from before the caller joined it, or a system message, 400
        `cannot_report_own_message` when the caller sent it), then the limit of 10 reports per
        user per day (`rate_limited`); only stored reports count. An administrator can read
        this conversation's messages up to the moment of the report. In a group, a report of a
        message names its sender, and a report of the whole group names nobody
        (`reportedUserId` null).

        Reporting does not block the other user: `blockedByMe` says whether the caller has
        blocked them, so the client can offer to block `reportedUserId` next.
      tags: [messaging]
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportConversationRequest"
      responses:
        "201":
          description: The report is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationReportReceipt"
        "400":
          description: |
            A field is not valid (`bad_request`, with `field`), or the message is the caller's
            own (`cannot_report_own_message`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: The user has made 10 reports in the current day (`rate_limited`).
          headers:
            Retry-After:
              description: Seconds until reports are accepted again.
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects:
    post:
      operationId: createProject
      summary: Create a research project, owned by the caller (FR-10.1)
      description: |
        Needs the access cookie and the platform action "Create a project" (SRS 2.3). The
        caller becomes the project's owner, its first member, in the same transaction. The
        new project is `open`. Text fields are trimmed. `title` must then be 3 to 150
        characters, `description` 1 to 5,000 and `abstract` at most 3,000 (empty means
        none). Each name in `requiredSkills` is normalized like a profile skill (FR-4.2:
        whitespace collapsed, 1 to 60 characters); names that differ only in letter case
        are one skill, keeping the spelling first created, and at most 20 remain. A field
        that breaks a rule gets 400 `bad_request` with `field`. Each user may create 10
        projects a day; only created projects count.
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: The project, as its owner sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/InvalidProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: The user has created 10 projects in the current day (`rate_limited`).
          headers:
            Retry-After:
              description: Seconds until creating is accepted again.
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}:
    get:
      operationId: getProject
      summary: Read a project's page (FR-10, SRS 2.3)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). A member sees the project whatever its status.
        Anyone else sees it only when it is `open` or `closed`, its owner's account is not
        suspended, and the owner has not blocked the caller (FR-16.9); otherwise the answer
        is 404 `not_found`, the same as for a project that does not exist. `abstract` is
        shown to members only.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateProject
      summary: Change a project's details or status (FR-10.2)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3); a project the caller cannot see gets 404
        `not_found`. Then each field named needs its project action: `title`,
        `description`, `requiredSkills`, `status` and `mainFilePath` the row "Edit project
        details and status" (owner), `abstract` the row "Compile, use the assistant, edit the abstract"
        (editor, owner); otherwise 403 `forbidden` and nothing changes. A missing field keeps
        its value; `null` clears `abstract` and is refused for the others. `requiredSkills`
        replaces the whole list. The rules of `createProject` apply; `status` is `open`,
        `closed` or `archived`, and the owner may move between any of them. `mainFilePath`
        (FR-13.1) must name an existing text file ending in `.tex` (409 `main_file_invalid`);
        `null` is refused.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: The project after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/InvalidProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`main_file_invalid`: `mainFilePath` is not an existing `.tex` text file."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteProject
      summary: Delete a project and everything in it, after confirming (FR-10.6)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3); a project the caller cannot see gets 404
        `not_found`. Then the project action "Transfer ownership, delete the project"
        (owner only), else 403 `forbidden`. `confirm` must equal the project's title, letter
        case included, after trimming both; else 400 `confirmation_mismatch` with
        `field: confirm` and nothing is deleted. Deleting removes the project with its
        members, skills, join requests, files, compile jobs, embedding and reports, in one
        transaction. A post that linked to it stays, without the link.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: confirm
          in: query
          required: false
          description: |
            The project's title, typed by the owner to confirm. It is declared optional only
            so that a missing value gets 400 `confirmation_mismatch` instead of the generic
            `bad_request`.
          schema:
            type: string
      responses:
        "204":
          description: The project is deleted.
        "400":
          description: "`confirm` is missing or is not the project's title (`confirmation_mismatch`, with `field`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/reports:
    post:
      operationId: reportProject
      summary: Report a project to the administrators (FR-15.11)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Checks run in this order: the project must be one the
        caller can see (else 404 `not_found`), the caller's account must not be suspended
        (403 `account_suspended`), `reason` and `details` (`bad_request`, with `field`), the
        caller must not be the owner (400 `cannot_report_own_project`), and the caller may
        have one open report per project (409 `already_reported`).
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportProjectRequest"
      responses:
        "201":
          description: The report is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectReportReceipt"
        "400":
          description: |
            A field is not valid (`bad_request`, with `field`), or the caller owns the project
            (`cannot_report_own_project`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The caller already has an open report of this project (`already_reported`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/projects:
    get:
      operationId: listMyProjects
      summary: The caller's own projects with the caller's role in each (FR-10, FR-11.6)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Every project the caller is a member of, any
        status, most recently changed first.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/PageFromOne"
        - name: pageSize
          in: query
          required: false
          description: Projects per page, from 1; a larger value than 50 is reduced to 50. Defaults to 20. Below 1 gets 400 `bad_request`.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "400":
          description: "`page` or `pageSize` is not valid (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/join-requests:
    post:
      operationId: createJoinRequest
      summary: Ask to join an open project, with a short message (FR-11.1)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3), then the project action "Request to join" (non-members).
        Checks run in this order: the project must be one the caller can see and there must
        be no block either way between the caller and the owner (else 404 `not_found`); the
        caller's account must not be suspended (403 `account_suspended`); `message` (trimmed;
        at most 500 characters, empty means none; else 400 `bad_request` with `field`); the
        caller must not be a member (409 `already_member`); the project must be `open` (409
        `project_not_open`); the caller may have one pending request per project (409
        `request_pending`) and none while invited (409 `invitation_pending`: accept the
        invitation instead). Each user may send 20 join requests a day; only sent requests
        count. The owner is notified (`project_join_request`).
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequestCreate"
      responses:
        "201":
          description: The request, pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyJoinRequest"
        "400":
          $ref: "#/components/responses/MembershipInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "429":
          $ref: "#/components/responses/MembershipRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listProjectJoinRequests
      summary: The project's join requests, pending first (FR-11.2)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3); a project the caller cannot see gets 404 `not_found`.
        Then the project action "Invite, decide join requests, change roles, remove members"
        (owner only), else 403 `forbidden`. Pending requests come first, oldest first; then
        decided ones, most recently decided first. A request whose sender is now unverified or
        suspended is left out.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PageFromOne"
        - $ref: "#/components/parameters/MembershipPageSize"
      responses:
        "200":
          description: One page of requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectJoinRequestPage"
        "400":
          $ref: "#/components/responses/MembershipInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/join-requests/{requestId}:
    delete:
      operationId: cancelJoinRequest
      summary: Cancel the caller's own pending join request (FR-11.1)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Only the sender may cancel, also while suspended, and only
        while the request is pending; anything else gets 404 `not_found`. The request is
        deleted, and so is the owner's notification of it.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/JoinRequestId"
      responses:
        "204":
          description: The request is cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/join-requests/{requestId}/accept:
    post:
      operationId: acceptJoinRequest
      summary: Accept a join request as editor or viewer (FR-11.2)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Checks run in this order: `role` is `editor` or `viewer`
        (400 `bad_request`, `field: role`); the project must be one the caller can see (404
        `not_found`); the project action "Invite, decide join requests, change roles, remove
        members" (owner only, 403 `forbidden`); the caller's account is not suspended (403
        `account_suspended`); the request must exist in this project and its sender must be
        verified, not suspended and not blocked either way with the caller (404 `not_found`);
        it must still be pending (409 `request_not_pending`, also for a second accept). The
        project's status does not matter: a request sent while it was open can be accepted
        after it closed. The sender becomes a member in the same transaction and is notified
        (`project_join_request_accepted`); the owner's notification of the request is removed.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/JoinRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleBody"
      responses:
        "200":
          description: The new member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/MembershipInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/join-requests/{requestId}/reject:
    post:
      operationId: rejectJoinRequest
      summary: Reject a join request (FR-11.2)
      description: |
        As `acceptJoinRequest`, without a body, and a request from a sender who is now
        unverified, suspended or blocked can be rejected too. The sender is notified
        (`project_join_request_rejected`, FR-9.2) and may ask again.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/JoinRequestId"
      responses:
        "204":
          description: The request is rejected.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/invitations:
    post:
      operationId: createInvitation
      summary: Invite a user to the project as editor or viewer (FR-11.3)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Checks run in this order: the body (`userId`, `role`
        `editor` or `viewer`; 400 `bad_request` with `field`); the project must be one the
        caller can see (404 `not_found`); the project action "Invite, decide join requests,
        change roles, remove members" (owner only, 403 `forbidden`); the caller's account is
        not suspended (403 `account_suspended`); the project must be `open` (409
        `project_not_open`); the user must exist, be verified, not suspended and not blocked
        either way with the caller (404 `user_not_found`, which does not say which); the user
        must not be a member (409 `already_member`), nor invited already (409
        `already_invited`), nor have a pending request (409 `request_pending`: accept the
        request instead). Each owner may send 20 invitations a day; only sent invitations
        count. The user is notified (`project_invitation`).
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: The invitation, pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitation"
        "400":
          $ref: "#/components/responses/MembershipInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "429":
          $ref: "#/components/responses/MembershipRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listProjectInvitations
      summary: The project's invitations, pending first (FR-11.3)
      description: |
        As `listProjectJoinRequests` (owner only), for invitations. An invitation to a user who
        is now unverified or suspended is left out.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PageFromOne"
        - $ref: "#/components/parameters/MembershipPageSize"
      responses:
        "200":
          description: One page of invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitationPage"
        "400":
          $ref: "#/components/responses/MembershipInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/invitations/{invitationId}:
    delete:
      operationId: cancelInvitation
      summary: Cancel a pending invitation (FR-11.3)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The project must be one the caller can see (404
        `not_found`); owner only (403 `forbidden`); the caller's account is not suspended (403
        `account_suspended`); the invitation must exist in this project (404 `not_found`) and
        be pending (409 `invitation_not_pending`). The invitation is deleted, and so is the
        user's notification of it.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "204":
          description: The invitation is cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/invitations/{invitationId}/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation and join the project (FR-11.3)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Checks run in this order: the invitation must exist in this
        project and be addressed to the caller (404 `not_found`); it must be pending (409
        `invitation_not_pending`, also for a second accept); the caller's account is not
        suspended (403 `account_suspended`); the owner must be verified, not suspended and not
        blocked either way with the caller (404 `not_found`). The project's status does not
        matter. The caller joins with the invitation's role in the same transaction; the owner
        is notified (`project_invitation_accepted`) and the caller's notification of the
        invitation is removed.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: The caller as a member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/invitations/{invitationId}/reject:
    post:
      operationId: rejectInvitation
      summary: Reject an invitation (FR-11.3)
      description: |
        As `acceptInvitation`, but allowed while suspended and whoever the owner is now. The
        owner is notified (`project_invitation_rejected`, FR-9.2).
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "204":
          description: The invitation is rejected.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      summary: The project's members with their roles (SRS 2.3, FR-11)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3); a project the caller cannot see gets 404 `not_found`
        (the row "View the project page (title, description, skills, members)"). The owner
        comes first, then the others in the order they joined.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PageFromOne"
        - $ref: "#/components/parameters/MembershipPageSize"
      responses:
        "200":
          description: One page of members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberPage"
        "400":
          $ref: "#/components/responses/MembershipInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/members/{userId}:
    patch:
      operationId: updateProjectMember
      summary: Change a member's role (FR-11.4)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Checks run in this order: `role` is `editor` or `viewer`
        (400 `bad_request`, `field: role`); the project must be one the caller can see (404
        `not_found`); owner only (403 `forbidden`); the caller's account is not suspended (403
        `account_suspended`); the user must be a member (404 `not_found`) other than the owner
        (409 `use_transfer`: ownership moves only by `transferProject`). The member's own
        role again changes nothing and notifies nobody; otherwise the member is notified
        (`project_member_role_changed`).
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MemberUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleBody"
      responses:
        "200":
          description: The member after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/MembershipInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeProjectMember
      summary: Remove a member from the project (FR-11.4)
      description: |
        As `updateProjectMember`, without a body; the owner cannot be removed, themselves
        included (409 `cannot_remove_owner`). The member is notified
        (`project_member_removed`).
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MemberUserId"
      responses:
        "204":
          description: The member is removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/leave:
    post:
      operationId: leaveProject
      summary: Leave a project the caller is a member of, not as its owner (FR-11.5)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Allowed while suspended. A caller who is not a member gets
        404 `not_found`; the owner gets 409 `owner_must_transfer` (transfer ownership first,
        or delete the project). Nobody is notified.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: The caller is no longer a member.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/transfer:
    post:
      operationId: transferProject
      summary: Make another member the owner; the caller becomes an editor (FR-10.5)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Checks run in this order: `userId` (400 `bad_request`); the
        project must be one the caller can see (404 `not_found`); the project action
        "Transfer ownership, delete the project" (owner only, 403 `forbidden`); the caller's
        account is not suspended (403 `account_suspended`); the user must be a member (409
        `not_a_member`) other than the caller (409 `already_owner`), verified and not
        suspended (409 `member_unavailable`). In one transaction the caller becomes an
        `editor` and the user the `owner`. The new owner is notified
        (`project_ownership_transferred`).
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnershipTransfer"
      responses:
        "200":
          description: The project as the caller, now an editor, sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/MembershipInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MembershipConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/files:
    get:
      operationId: listProjectFiles
      summary: The project's whole file tree (FR-12.1)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3), then the project action "Open the workspace, read
        files, view the PDF": any member. Anyone else, an administrator included, and a
        project that does not exist get 404 `not_found`; a member who was removed gets it on
        the next request.

        **Not paginated**, an exception to the list rule of SRS 5.3 (docs/decisions.md,
        2026-11-17): a project holds at most 200 entries, folders included, and the editor
        needs the whole tree at once. Entries are sorted by path, ignoring letter case.
      tags: [project-files]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Every file and folder of the project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileTree"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createProjectFile
      summary: Create a text file or a folder (FR-12.1)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Checks run in this order: the body (400 `bad_request` with
        `field`, `invalid_path` for a path that breaks the path rules, see `ProjectFilePath`);
        the caller is a member (404 `not_found`) with the project action "Edit files, upload
        figures": editor or owner (403 `forbidden`); the caller's account is not suspended
        (403 `account_suspended`); `content` is at most 1 MiB of UTF-8 (413
        `file_too_large`); the path is free, ignoring letter case (409 `path_taken`); no
        folder on the way is a file (409 `parent_not_folder`); the project stays at 200
        entries or fewer (409 `file_limit_reached`).

        Missing folders on the way are created, and count toward the 200. A text file may
        not end in `.png`, `.jpg`, `.jpeg` or `.pdf` (`invalid_path`): those are figures,
        uploaded with `uploadProjectFigure`. A folder takes no `content`. A request body over
        3 MiB gets 413 `request_too_large`.
      tags: [project-files]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFileCreate"
      responses:
        "201":
          description: The new file or folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFile"
        "400":
          $ref: "#/components/responses/InvalidProjectFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ProjectFileConflict"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/files/{fileId}:
    get:
      operationId: getProjectFile
      summary: Read one file (FR-12.1)
      description: |
        As `listProjectFiles` for who may read. A file that does not exist in this project
        gets 404 `not_found`. A text file comes with its `content`. A figure comes with a
        `download` URL valid for 5 minutes whose answer carries `Content-Disposition:
        attachment` with the file's name and the stored content type (NFR-13), but only once
        its malware scan says clean: 409 `scan_pending` while it runs, 409 `scan_failed` when
        the scanner could not read it, 410 `file_removed` when malware was found. A folder
        comes with neither.
      tags: [project-files]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectFileId"
      responses:
        "200":
          description: The file, with its text or a download URL.
          headers:
            Cache-Control:
              description: Always `no-store`; the text changes and the URL expires.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AttachmentNotReady"
        "410":
          $ref: "#/components/responses/AttachmentRemoved"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: moveProjectFile
      summary: Rename or move a file or folder (FR-12.1)
      description: |
        Checks as `createProjectFile`, on the new `path`. A folder moves with everything in it,
        in one transaction. Moving a folder into itself or below itself gets 400
        `invalid_move`; a figure keeps its extension's type (`invalid_path` when the new path
        does not end in an extension of the same kind: `.png`, `.jpg` or `.jpeg` for an image
        of that type, `.pdf` for a PDF). The same path again changes nothing; a path that
        differs only in letter case renames. When the project's main file
        (`mainFilePath`) moves, the project follows it. Missing folders on the way are created.
        The file's `version` does not change.
      tags: [project-files]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectFileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFileMove"
      responses:
        "200":
          description: The file or folder at its new path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFile"
        "400":
          $ref: "#/components/responses/InvalidProjectFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ProjectFileConflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteProjectFile
      summary: Delete a file, or a folder with everything in it (FR-12.1)
      description: |
        Membership, role and standing as `createProjectFile`. A folder is deleted with
        everything in it, in one transaction; the client asks the user to confirm first.
        Figures' objects are deleted from storage after the commit; one that fails is logged
        and retried by the storage cleanup. Deleting the main file is allowed; the project
        then has no main file until one is created at `mainFilePath`.
      tags: [project-files]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectFileId"
      responses:
        "204":
          description: The file or folder is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/files/{fileId}/content:
    put:
      operationId: saveProjectFileContent
      summary: Save a text file's content, if nobody changed it since (FR-12.6)
      description: |
        The save the editor sends automatically (FR-12.6), with the `version` of the text it
        started from. Checks run in this order: the body (400 `bad_request` with `field`:
        `content` with control characters other than tab, line feed and carriage return, or
        `version` below 1); the save limit (429 `rate_limited`); membership, role and
        standing as `createProjectFile`; the file is a text file (409 `not_a_text_file`);
        `content` is at most 1 MiB of UTF-8 (413 `file_too_large`). A request body over 3 MiB
        gets 413 `request_too_large`.

        When `version` is the file's version, the content is stored and the version goes up
        by one. Otherwise nothing is stored and the answer is 409 `version_conflict` with the
        file's `current` version and text, so that two tabs never overwrite each other
        silently. The same content again still counts as a save. Each user may save 120
        times a minute (429 `rate_limited`).

        While the file is open on the sync server (slice 22, docs/sync.md), REST saves are
        refused with 409 `live_session_open`: the web client edits it there and uses this
        operation only when the sync server cannot be reached. A save also clears the file's
        real-time state, so the sync server builds it again from this text with a new epoch.
      tags: [project-files]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectFileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFileSave"
      responses:
        "200":
          description: The file after the save, with its new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFile"
        "400":
          $ref: "#/components/responses/InvalidProjectFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `version_conflict`: the file changed since `version`; `current` holds what it is
            now. `not_a_text_file`: the file is a folder or a figure (no `current`).
            `live_session_open`: the file is open on the sync server (real-time editing,
            docs/sync.md), whose saves would overwrite this one; edit it there (no `current`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileVersionConflict"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "429":
          $ref: "#/components/responses/ProjectFileRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            `live_check_unavailable`: the server cannot tell whether the file is open for
            real-time editing (Redis does not answer), so it stores nothing. Try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{projectId}/files/{fileId}/collab-ticket:
    post:
      operationId: createCollabTicket
      summary: Get a one-time ticket to open a text file on the sync server (FR-12.7)
      description: |
        Needs the access cookie and the platform action "View profiles, search, ..." (SRS
        2.3), then the project action "Open the workspace, read files, view the PDF": members
        only, so a non-member, an administrator included, gets 404 `not_found` as for every
        file operation. A suspended account gets 403 `account_suspended`. Only text files sync
        (409 `not_a_text_file`).

        The answer's `ticket` opens one WebSocket to the sync server for this file, once,
        within 30 seconds (docs/sync.md); it carries no rights of its own: the sync server
        redeems it with the API and reads the role then. `role` is the caller's role now:
        a viewer's connection is read-only (FR-12.7). `epoch` names the file's Yjs history
        (null when the sync server has not built one since the last REST save); a client
        merges offline edits only into the same epoch (FR-12.9). Each user may ask for 60
        tickets a minute (429 `rate_limited`).
      tags: [project-files]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectFileId"
      responses:
        "200":
          description: A ticket for the sync server.
          headers:
            Cache-Control:
              description: Always `no-store`; a ticket works once.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollabTicket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`not_a_text_file`: the file is a folder or a figure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/ProjectFileRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/files/uploads:
    post:
      operationId: startFigureUpload
      summary: Start a figure upload straight to storage, PNG, JPG or PDF (FR-12.2)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The first of two steps (docs/decisions.md, 2026-11-18): the
        figure itself never passes through the API. The answer is a presigned POST: the
        browser sends `fields`, then the file as the last part named `file`, to `url` before
        `expiresAt` (15 minutes). Storage accepts exactly `size` bytes and nothing else, under
        a key of its own. Then the browser calls `completeFigureUpload`.

        Checks, in this order: the body (400 `bad_request`, `field: size` for a size under 1);
        the path (400 `invalid_path`, also when it does not end in `.png`, `.jpg`, `.jpeg` or
        `.pdf`); membership (404 `not_found`), the project action "Edit files, upload figures"
        (403 `forbidden`) and standing (403 `account_suspended`); the upload limit (429
        `rate_limited`: 30 figures per user per hour, counted when confirmed); the size (413
        `file_too_large`, over `figureMaxBytes` of the tree's `storage`, 50 MB by default);
        the project's storage (413 `storage_limit_reached`, with `usedBytes` and `limitBytes`,
        when the project's figures, the uploads it has in progress and this one would pass
        `limitBytes`, 500 MB by default); and, early, the path itself (409 `path_taken`,
        `parent_not_folder`, `file_limit_reached`), all checked again on completion.
      tags: [project-files]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FigureUploadStart"
      responses:
        "201":
          description: Send the file to storage with this presigned POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FigureUploadTicket"
        "400":
          $ref: "#/components/responses/InvalidProjectFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ProjectFileConflict"
        "413":
          $ref: "#/components/responses/FigureTooLarge"
        "429":
          $ref: "#/components/responses/ProjectFileRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/files/uploads/{uploadId}/complete:
    post:
      operationId: completeFigureUpload
      summary: Record a figure the browser sent to storage (FR-12.2)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The second step: the API reads the object the browser sent
        and records the figure. Only the user who started the upload may complete it, within
        1 hour of the start; anyone else, an unknown, expired or already completed upload,
        and a non-member get 404 `not_found`. 409 `upload_incomplete`: storage has no file
        for this upload yet.

        The type is **read from the content only**: PNG, JPEG or PDF (415
        `unsupported_type`; WebP is refused, pdfLaTeX cannot use it), and the path's
        extension must name it (400 `type_mismatch`). An image whose structure cannot be read
        gets 400 `invalid_image`. **An image is not encoded again**: its metadata is removed
        losslessly (JPEG: EXIF and XMP, IPTC, comments and other application segments,
        keeping JFIF, the ICC colour profile and Adobe's colour marker; PNG: `eXIf`, text and
        time chunks and any unknown ancillary chunk), so its pixels are exactly as uploaded;
        anything after the image's end is dropped too. A PDF is stored as uploaded. Then,
        under the project's lock, the role and standing again, the size and the project's
        storage (413 as `startFigureUpload`) and the path (409 `path_taken`,
        `parent_not_folder`, `file_limit_reached`). The file is scanned for malware after,
        as message attachments are (FR-16.7); nobody can download it before the scan says
        clean.
      tags: [project-files]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: uploadId
          in: path
          required: true
          description: |
            The upload's `id` from `startFigureUpload`, a UUID declared as a plain string like
            `fileId`; a value that is not a UUID gets 404 `not_found`.
          schema:
            type: string
      responses:
        "201":
          description: The figure is stored and waits for its scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFile"
        "400":
          $ref: "#/components/responses/InvalidProjectFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ProjectFileConflict"
        "413":
          $ref: "#/components/responses/FigureTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedFigureType"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/join-requests:
    get:
      operationId: listMyJoinRequests
      summary: The caller's own join requests, with their status (FR-11.1)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3). Every request the caller sent and did not cancel,
        newest first.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/PageFromOne"
        - $ref: "#/components/parameters/MembershipPageSize"
      responses:
        "200":
          description: One page of requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyJoinRequestPage"
        "400":
          $ref: "#/components/responses/MembershipInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/invitations:
    get:
      operationId: listMyInvitations
      summary: The caller's pending invitations (FR-11.3)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3). Pending invitations to the caller, newest first. One
        whose project's owner is now unverified or suspended, or blocked either way with the
        caller, is left out until that changes.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/PageFromOne"
        - $ref: "#/components/parameters/MembershipPageSize"
      responses:
        "200":
          description: One page of invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyInvitationPage"
        "400":
          $ref: "#/components/responses/MembershipInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /search/projects:
    get:
      operationId: searchProjects
      summary: Search open projects by title, required skill or description (FR-10.3)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Only `open` projects are found, never one
        whose owner's account is suspended or not verified, and never one whose owner has
        blocked the searcher (FR-16.9).

        A project matches when its title, one of its required skill names or its
        description contains `q`, ignoring letter case. Results are ranked by their best
        match: a title equal to `q`, then a title that starts with `q`, then one that
        contains it, then a required skill, then the description; within a rank, newest
        first. When no visible open project's title contains `q`, titles with a word similar
        to `q` (trigram word similarity, as in researcher search, so a small spelling
        mistake still matches) take the place of the title matches; then `fuzzy` is true
        and `correctedQuery` is the most similar title. Each user may search 60 times a
        minute, in either mode.

        **Modes (AI-5.1 for projects).** `mode=keyword` is the search above, unchanged, and
        the answer's `mode` is `keyword`. `mode=auto` (the default) also searches by meaning:
        the text is embedded by the AI service and compared with every visible open project's
        embedding. A strong title match comes first, in keyword order: a title equal to `q`,
        or a title that starts with `q` when `q` is at least 3 characters, both ignoring
        letter case and accents. The other results are the 50 best keyword results (the order
        above) and the 50 projects closest in meaning, with the same visibility rules, merged
        by reciprocal rank fusion (k = 60), and the answer's `mode` is `hybrid`. Ranking
        never uses member counts or any other popularity signal (AI-2.4). A result found only
        by meaning has `matchedOn: meaning`. In hybrid mode `total` is the size of the merged
        list, cut at 100, so there are at most 5 pages and a later page is empty; `fuzzy` and
        `correctedQuery` come from the keyword side.

        When the AI service does not answer within a short time (1.5 s by default) or answers
        with an error, the keyword search runs instead and `mode` is `keyword_fallback`
        (AI-5.4), so the client can say so.
      tags: [search]
      parameters:
        - name: q
          in: query
          required: false
          description: |
            The search text after trimming: 2 to 300 characters in `auto` mode (AI-5.1), 2 to
            100 in `keyword` mode. It is required: it is declared optional only so that a
            missing `q` gets 400 `invalid_query`, like a too short one, instead of the generic
            `bad_request`.
          schema:
            type: string
          example: graph neural
        - name: mode
          in: query
          required: false
          description: |
            `auto` searches by keyword and by meaning (AI-5); `keyword` only by keyword and
            never calls the AI service. Any other value gets 400 `bad_request`.
          schema:
            type: string
            enum: [auto, keyword]
            default: auto
        - name: page
          in: query
          required: false
          description: The page to return, 1 to 50, 20 results each (FR-10.3). Defaults to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 1
      responses:
        "200":
          description: One page of results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSearchPage"
        "400":
          description: |
            `q` is missing or, after trimming, not 2 to 300 characters in `auto` mode or 2 to
            100 in `keyword` mode (`invalid_query`), or `mode` or `page` is not valid
            (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/SearchRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /search/people:
    get:
      operationId: searchPeople
      summary: Search researchers by name, institution, research interest, headline or meaning (FR-6.1 to FR-6.3, AI-5.1, AI-5.2, AI-5.4)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Only verified accounts that are not
        suspended are found, as with `GET /profiles/{userId}`, and never anyone who has
        blocked the searcher (FR-16.9), in the results, the totals or the facets. Only public
        profile fields
        are searched: full name, institution, research interest names and headline; never
        email, phone, birthday, links or bio.

        A profile matches when its full name, institution, one of its research interests
        or its headline contains `q`, ignoring letter case. Results are ranked by their
        best match: a full name equal to `q`, then a full name that starts with `q`, then
        one that contains it, then institution, then research interest, then headline;
        within a rank by name similarity to `q`, then by name. When no visible profile's
        name contains `q`, names with a word similar to `q` (trigram word similarity, so
        a small spelling mistake in any one word of the name matches, FR-6.2) take the
        place of the name matches; then `fuzzy` is true and `correctedQuery` is the full
        name of the most similar one.

        `institution` and `interest` narrow the results (FR-6.3). Each facet is counted
        with every filter except its own group, so selecting one option keeps the others
        listed. Each user may search 60 times a minute, in either mode.

        **Modes.** `mode=keyword` is the search above, unchanged, and the answer's `mode` is
        `keyword`. `mode=auto` (the default) also searches by meaning (AI-5.1, AI-5.2): the
        text is embedded by the AI service and compared with every visible profile's
        embedding. The 50 best keyword results (the order above) and the 50 profiles closest
        in meaning, both with the same visibility rules and filters, are merged by reciprocal
        rank fusion (k = 60), and the answer's `mode` is `hybrid`. Ranking never uses
        citation, publication or connection counts (AI-2.4). A strong name match always
        comes first, in keyword order: a full name equal to `q`, or a full name that starts
        with `q` when `q` is at least 3 characters, both ignoring letter case and accents
        ("jose" finds "José"; Bangla text is compared as written). A result found only by
        meaning has `matchedOn: meaning`. In hybrid mode `total` is the size of the merged
        list, cut at 100, so there are at most 5 pages and a later page is empty; facets are counted over the merged list, each without its own filter as
        above; `fuzzy` and `correctedQuery` come from the keyword side.

        When the AI service does not answer within a short time (1.5 s by default) or answers
        with an error, the keyword search runs instead and `mode` is `keyword_fallback`
        (AI-5.4), so the client can say so.
      tags: [search]
      parameters:
        - name: q
          in: query
          required: false
          description: |
            The search text after trimming: 2 to 300 characters in `auto` mode (AI-5.1), 2 to
            100 in `keyword` mode. It is required: it is declared optional only so that a
            missing `q` gets 400 `invalid_query`, like a too short one, instead of the generic
            `bad_request`.
          schema:
            type: string
          example: Rahman
        - name: mode
          in: query
          required: false
          description: |
            `auto` searches by keyword and by meaning (AI-5); `keyword` only by keyword, as
            before AI-5, and never calls the AI service. Any other value gets 400 `bad_request`.
          schema:
            type: string
            enum: [auto, keyword]
            default: auto
        - name: institution
          in: query
          required: false
          description: |
            Keep only results whose institution equals this, ignoring letter case and
            spaces around it. Empty means no filter; more than 200 characters gets 400
            `bad_request`.
          schema:
            type: string
        - name: interest
          in: query
          required: false
          style: form
          explode: true
          description: |
            Keep only results that have every named research interest, ignoring letter
            case. Repeat the parameter for several (at most 10); each name is normalized
            like a tag (FR-4.2) and must then be 1 to 60 characters, else 400 `bad_request`.
          schema:
            type: array
            items:
              type: string
        - name: page
          in: query
          required: false
          description: The page to return, 1 to 50, 20 results each (FR-6.1). Defaults to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 1
      responses:
        "200":
          description: One page of results with the facets of the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeopleSearchPage"
        "400":
          description: |
            `q` is missing or, after trimming, not 2 to 300 characters in `auto` mode or 2 to
            100 in `keyword` mode (`invalid_query`), or `mode`, `institution`, `interest` or
            `page` is not valid (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/SearchRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /recommendations/people:
    get:
      operationId: recommendPeople
      summary: Researchers whose profiles are most similar to the caller's (AI-2.1, AI-2.2, AI-2.4, AI-4)
      description: |
        Needs the access cookie, a verified email and the platform action "View profiles,
        search, feed, events and recommendations" (SRS 2.3).

        `state` says what the caller sees, checked in this order:
        `needs_profile` when the caller's profile has no research interests, no skills and no
        bio (AI-4.2): `missing` names them and `items` is empty, so the client asks for them
        in place of an empty list. `processing` when the profile has text but its embedding
        is not made yet (it is made in the background within a minute, AI-1.4): `items` is
        empty. Otherwise `ready`. A user with one interest or skill and no publications gets
        recommendations (AI-4.1).

        Ranking uses only the cosine similarity between the caller's profile embedding and
        each other user's, never citation, publication or connection counts or any other
        popularity signal (AI-2.4). Left out: the caller, users connected to the caller, users
        with a pending request either way, users blocked by or blocking the caller (FR-16.9),
        unverified and suspended users, and users without an embedding (AI-2.1).

        The list is kept for up to 10 minutes; it is made again at once when the caller's
        embedding changes or when a connection, request or block between the caller and
        anyone changes. A user who becomes suspended, blocked or connected meanwhile is
        dropped from a kept list, which may then have fewer than `limit` items.
      tags: [recommendations]
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Items to return, from 1. Defaults to 10. A larger value than 10 is reduced to
            10; a value below 1 gets 400 `bad_request`.
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: The caller's recommendations, or why there are none yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeopleRecommendations"
        "400":
          description: "`limit` is below 1 (`bad_request`, `field: limit`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /recommendations/projects:
    get:
      operationId: recommendProjects
      summary: Open projects whose embeddings are most similar to the caller's profile (AI-3.1, AI-2.4, AI-4)
      description: |
        Needs the access cookie, a verified email and the platform action "View profiles,
        search, feed, events and recommendations" (SRS 2.3).

        `state` is checked as for `recommendPeople`: `needs_profile` when the caller's
        profile has no research interests, no skills and no bio (AI-4.2), `processing` when
        its embedding is not made yet, otherwise `ready`.

        Ranking uses only the cosine similarity between the caller's profile embedding and
        each project's embedding, never member counts or any other popularity signal
        (AI-2.4). Only `open` projects are listed. Left out: projects the caller is a member
        of, projects the caller has a pending request to join, projects whose owner is
        suspended or not verified, projects whose owner the caller has blocked or is blocked
        by (FR-16.9), and projects without an embedding of the caller's model.

        The list is kept for up to 10 minutes; it is made again at once when the caller's
        embedding changes, when any project's embedding or status changes or a project is
        deleted, when the caller's memberships change, and when a block between the caller
        and anyone changes. A project that stops being eligible meanwhile is dropped from a
        kept list, which may then have fewer than `limit` items.
      tags: [recommendations]
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Items to return, from 1. Defaults to 10. A larger value than 10 is reduced to
            10; a value below 1 gets 400 `bad_request`.
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        "200":
          description: The caller's project recommendations, or why there are none yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRecommendations"
        "400":
          description: "`limit` is below 1 (`bad_request`, `field: limit`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/recommended-researchers:
    get:
      operationId: recommendProjectResearchers
      summary: Researchers whose profiles are most similar to a project, for its owner (AI-2.3, AI-2.4)
      description: |
        Needs the access cookie, a verified email and the platform action "View profiles,
        search, feed, events and recommendations" (SRS 2.3). A project the caller cannot see
        gets 404 `not_found`, as `getProject`. Then the project action "Invite, decide join
        requests, change roles, remove members" (owner only), since the list is for finding
        people to invite; anyone else gets 403 `forbidden`. Any project status is allowed.

        `state` is `processing` while the project has no embedding (it is made in the
        background within a minute, AI-1.4), otherwise `ready`; `missing` is always empty.

        Ranking uses only the cosine similarity between the project's embedding and each
        profile embedding, never citation, publication or connection counts (AI-2.4). Left
        out: the project's current members, unverified and suspended users, users the owner
        has blocked or is blocked by (FR-16.9), and users without an embedding of the
        project's model. `shared` is up to 3 of the project's required skills the researcher
        has (the same name, ignoring letter case), in the project's order.

        The list is kept for up to 10 minutes; it is made again at once when the project's
        embedding or members change, and when a block between the owner and anyone changes.
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The project's recommended researchers, or why there are none yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeopleRecommendations"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /ws:
    get:
      operationId: openWebSocket
      summary: Open the real-time connection (FR-16.1, FR-16.3, FR-16.4, FR-9.4)
      description: |
        Upgrades to WebSocket. OpenAPI cannot describe what follows the upgrade, so
        `docs/realtime.md` is the full contract: the events and their payloads, close codes,
        limits and what a client must do after a reconnect. The payloads are the `Realtime*`
        schemas below.

        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3). The `Origin` header must be the origin of the web
        client (`APP_BASE_URL`); a request without one is refused. When the upgrade answers
        101 the user's event channel is already live, so a client that refetches after it
        misses nothing. The socket only pushes events and carries typing: sending messages,
        read markers, accept, decline, block and report stay REST.
      tags: [realtime]
      responses:
        "101":
          description: The connection is now a WebSocket.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            `forbidden`: the user's role does not permit the action (FR-3.2).
            `origin_not_allowed`: the `Origin` header is missing or is not the web client's.
            `account_suspended`: the caller's account was suspended after this session began,
            with `reason` and `until`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "426":
          description: The request is not a WebSocket upgrade (`upgrade_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Real-time delivery is down (`realtime_unavailable`). REST keeps working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /presence:
    get:
      operationId: getPresence
      summary: Read who is online (FR-16.4)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3). A person's status is shown only to someone who shares
        an active conversation with them, with no block either way. Everyone else reads
        `online: false`, the same answer as for someone who is offline, so the reply says
        nothing about who may be seen. Every ID asked for is answered, once.
      tags: [realtime]
      parameters:
        - name: userIds
          in: query
          required: false
          description: |
            Comma-separated user IDs, 1 to 50. It is required: it is declared as an optional
            string only so that the login check runs before it is read (FR-3.1). A missing,
            empty or longer list, or a value that is not a UUID, gets 400 `bad_request` with
            `field`.
          schema:
            type: string
      responses:
        "200":
          description: The status of each ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceList"
        "400":
          description: "`userIds` is not valid (`bad_request`, with `field`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # Compile (FR-13; slice 23, docs/compile.md). The API never runs LaTeX: it queues a job,
  # and the compile worker (compile/) claims it on the internal listener and runs it in a
  # sandbox container (NFR-4).
  /projects/{projectId}/compiles:
    post:
      operationId: startCompile
      summary: Compile the project's main file (FR-13.1, FR-13.4)
      description: |
        Needs the access cookie and the platform action "View profiles, search, ..." (SRS
        2.3), then the project action "Compile, use the assistant, edit the abstract" (editor,
        owner): a non-member, an administrator included, gets 404 `not_found`, a viewer 403
        `forbidden`, a suspended account 403 `account_suspended`.

        Queues one compile of the project's main file (`mainFilePath` of the file tree, by
        default `main.tex`) with pdfLaTeX and BibTeX, and answers at once with the job
        (`queued`); `compile.updated` events report its progress to every member
        (docs/realtime.md). A project runs one compile at a time (FR-13.4): while one is
        queued or running the answer is 409 `compile_running` with its `compileId`.
        409 `main_file_missing`: no text file is at the main file's path. Each user may start
        10 compiles a minute (429 `rate_limited`). 503 `compile_unavailable`: no compile
        worker has asked for work in the last 30 seconds; 503 `compile_busy`: too many
        compiles are waiting. Neither queues anything.
      tags: [compile]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "202":
          description: The compile is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `compile_running`: a compile of this project is queued or running; `compileId`
            names it. `main_file_missing`: there is no text file at the main file's path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompileConflict"
        "429":
          $ref: "#/components/responses/CompileRateLimited"
        "503":
          description: "`compile_unavailable` or `compile_busy`: nothing was queued; try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/compiles/latest:
    get:
      operationId: getLatestCompile
      summary: The project's most recent compile, with its errors (FR-13.2)
      description: |
        Needs the project action "Open the workspace, read files, view the PDF" (every
        member); others get 404 `not_found`. 404 `no_compile` when the project was never
        compiled. A client reads it when the workspace opens and after a real-time reconnect.
      tags: [compile]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The newest compile, in any status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/compiles/{compileId}:
    get:
      operationId: getCompile
      summary: One compile, with its errors (FR-13.2)
      description: |
        Members only, as `getLatestCompile`. The project keeps its 10 newest compiles; an
        older one, or one of another project, gets 404 `not_found`.
      tags: [compile]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CompileId"
      responses:
        "200":
          description: The compile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/compiles/{compileId}/log:
    get:
      operationId: getCompileLog
      summary: The compile log (FR-13.2)
      description: |
        Members only, as `getLatestCompile`. The log is kept for the project's newest
        finished compile only (SRS 7, Retention): for any other compile, or one still running,
        404 `no_log`. At most 2 MiB; a longer log keeps its beginning and ends with a line
        saying it was cut.
      tags: [compile]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CompileId"
      responses:
        "200":
          description: The pdfLaTeX log, as UTF-8 text.
          headers:
            Cache-Control:
              description: Always `no-store`.
              required: true
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/pdf:
    get:
      operationId: downloadProjectPdf
      summary: The project's latest PDF (FR-13.6)
      description: |
        Members only, as `getLatestCompile`. The PDF of the newest compile that succeeded
        (SRS 7, Retention); 404 `no_pdf` when there is none. The API streams it from storage
        itself, never by a storage URL, so that the answer carries these headers: a PDF can
        hold JavaScript, which `Content-Security-Policy: sandbox` and `nosniff` keep from
        running in the app's origin when a browser shows it (docs/decisions.md):
        `Content-Type: application/pdf`, `Content-Disposition` `inline` (for the viewer) or
        `attachment` (to save; the default) with the project's title as the file name,
        `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox; default-src
        'none'; ...`, `Cache-Control: private, no-store` and `X-Compile-Id`, the compile it
        came from.
      tags: [compile]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: disposition
          in: query
          required: false
          description: "`attachment` (default) to save the file, `inline` to show it."
          schema:
            type: string
            enum: [inline, attachment]
      responses:
        "200":
          description: The PDF.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
            X-Content-Type-Options:
              required: true
              schema:
                type: string
            Content-Security-Policy:
              required: true
              schema:
                type: string
            X-Compile-Id:
              required: true
              schema:
                type: string
                format: uuid
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: "`bad_request` (`field: disposition`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/archive:
    get:
      operationId: downloadProjectArchive
      summary: Download the project's files as a ZIP archive (FR-13.7)
      description: |
        Members only ("Open the workspace, read files, view the PDF"); others get 404
        `not_found`. Streams a ZIP of every folder, text file (the stored text: live edits
        reach it within 5 seconds, NFR-10.1) and figure whose malware scan found it clean;
        a figure still pending, failed or infected is left out. Text is compressed, figures
        are stored as they are. 413 `archive_too_large` when the files would pass
        `ARCHIVE_MAX_BYTES` (default 768 MiB). Each user may download 10 archives an hour
        (429 `rate_limited`). The file name is the project's title.
      tags: [project-files]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The ZIP archive.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: "`archive_too_large`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/ProjectFileRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # Internal operations for the sync server (slice 22, docs/sync.md). The API serves them
  # only on its internal listener (INTERNAL_API_ADDR), never on the public port, and only with
  # the sync service's bearer token. Browsers never call them.
  /internal/sync/tickets/redeem:
    post:
      operationId: redeemSyncTicket
      summary: Redeem a collaboration ticket (internal, sync server only)
      description: |
        Spends the ticket whatever the answer: it works once. 404 `not_found` for an unknown,
        expired or spent ticket and for one issued for another file. The role is read now,
        not when the ticket was issued; a user who is no longer a member, is suspended or
        whose file is gone gets 404 too.
      tags: [internal]
      security:
        - syncToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncTicketRedeem"
      responses:
        "200":
          description: Who the ticket was for, and their role now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSession"
        "400":
          $ref: "#/components/responses/BadSyncRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/sync/access:
    post:
      operationId: checkSyncAccess
      summary: Read the current role of users on files (internal, sync server only)
      description: |
        One answer per check, in order. `none` when the user is not a member of the file's
        project, is suspended or unverified, or the file is gone or not a text file. The sync
        server asks for every open connection every 60 s and after each event (docs/sync.md).
      tags: [internal]
      security:
        - syncToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncAccessRequest"
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAccessResult"
        "400":
          $ref: "#/components/responses/BadSyncRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/sync/files/{fileId}:
    get:
      operationId: loadSyncFile
      summary: Read a text file's text and Yjs state (internal, sync server only)
      description: |
        The sync server marks the file live in Redis before it calls this, and this read
        waits for a REST save in progress, so no REST save can land after it unseen.
        404 `not_found` for a file that does not exist or is not a text file.
      tags: [internal]
      security:
        - syncToken: []
      parameters:
        - $ref: "#/components/parameters/ProjectFileId"
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/sync/files/{fileId}/state:
    put:
      operationId: storeSyncFile
      summary: Store a text file's Yjs state and text (internal, sync server only)
      description: |
        One UPDATE writes `ydocState`, `ydocEpoch`, `content`, `version + 1`, `updatedBy`
        and the time (NFR-10.1), only when the file is still at `baseVersion`; otherwise
        nothing is stored and the answer is 409 `version_conflict`. 413 `file_too_large`:
        the text is over 1 MiB of UTF-8 or the state over 8 MiB. `updatedBy` is the last
        member who edited; an account deleted since leaves it empty.
      tags: [internal]
      security:
        - syncToken: []
      parameters:
        - $ref: "#/components/parameters/ProjectFileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncFileStore"
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncFileStored"
        "400":
          $ref: "#/components/responses/BadSyncRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`version_conflict`: the file changed since `baseVersion`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  # Internal operations for the compile worker (slice 23, docs/compile.md). Served only on the
  # internal listener, only with the compile service's bearer token (`compileToken`), which
  # is a different secret from the sync server's.
  /internal/compile/claim:
    post:
      operationId: claimCompileJob
      summary: Take the oldest queued compile (internal, compile worker only)
      description: |
        Waits up to 10 seconds for a queued compile, then answers 204. A claimed job is
        `running` and leased to the worker for 120 seconds: a job not finished by then fails
        as `worker_lost`. Every call also tells the API that a worker is alive
        (`startCompile` answers `compile_unavailable` when none asked for 30 seconds).
      tags: [internal]
      security:
        - compileToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileClaim"
      responses:
        "200":
          description: The job to run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompileJob"
        "204":
          description: No compile is waiting.
        "400":
          $ref: "#/components/responses/BadSyncRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/compile/jobs/{compileId}/source:
    get:
      operationId: getCompileSource
      summary: The files to compile, as a tar archive (internal, compile worker only)
      description: |
        First asks the sync server to store the project's open documents (docs/sync.md,
        flush) and waits up to 5 seconds, so live edits are compiled. Then answers a POSIX tar
        of the project's folders, text files and clean figures at their project paths; a
        figure that is pending, failed or infected is left out and listed in the job's
        `skipped`. 404 `not_found` unless the job is running and leased. 409
        `input_too_large`: the files pass the input limit, and the job has already failed.
      tags: [internal]
      security:
        - compileToken: []
      parameters:
        - $ref: "#/components/parameters/CompileId"
      responses:
        "200":
          description: The files.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`input_too_large`: the job failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/compile/jobs/{compileId}/pdf:
    put:
      operationId: storeCompilePdf
      summary: Store the PDF a compile made (internal, compile worker only)
      description: |
        The body is the PDF, at most `COMPILE_MAX_PDF_BYTES` (100 MiB, else 413
        `file_too_large`), starting with `%PDF-` (else 400 `bad_request`). Call it before
        `finishCompileJob`. 404 `not_found` unless the job is running and leased.
      tags: [internal]
      security:
        - compileToken: []
      parameters:
        - $ref: "#/components/parameters/CompileId"
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Stored.
        "400":
          $ref: "#/components/responses/BadSyncRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/compile/jobs/{compileId}/finish:
    post:
      operationId: finishCompileJob
      summary: Report how a compile ended (internal, compile worker only)
      description: |
        The API parses the errors from the logs (FR-13.2), decides the status (a compile
        succeeds when it stored a PDF; `docs/compile.md`), keeps the log and the PDF as SRS 7
        says, and tells the members. A second report of a finished job changes nothing (204).
        404 `not_found` for an unknown job or one that ended as `worker_lost`.
      tags: [internal]
      security:
        - compileToken: []
      parameters:
        - $ref: "#/components/parameters/CompileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileResult"
      responses:
        "204":
          description: Recorded.
        "400":
          $ref: "#/components/responses/BadSyncRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /venues:
    get:
      operationId: listVenues
      summary: List venues by nearest submission deadline, with filters and facet counts (FR-14.1 to FR-14.3)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3). Removed venues never appear.

        **Rolling journals** (`rolling: true`, no submission deadline) are a separate list:
        `rolling=true` returns only them, by name then ID, and the default (`rolling=false`)
        returns only venues with a deadline, in the order below. `includePast`, `deadlineFrom`
        and `deadlineTo` do not apply to rolling journals and get 400 `bad_request` with
        `rolling=true`. The facets count within the list asked for.

        **Order:** venues whose submission deadline has not passed come first, nearest
        deadline first. A deadline has passed when its instant is at or before now. Past
        venues are left out unless `includePast=true`; they then follow the upcoming ones,
        most recently closed first. Ties go by name, then ID.

        **Filters** combine with AND. `type` and `field` may repeat, and a venue matches when
        it has any of the given values. `deadlineFrom` and `deadlineTo` are calendar dates,
        both inclusive, read in the time zone `tz` (an IANA name, `Asia/Dhaka` when left out):
        `deadlineFrom` starts at that day's local midnight and `deadlineTo` ends at the next
        day's local midnight. A deadline range does not show past venues unless
        `includePast=true`. `q` (2 to 100 characters after trimming) matches a name or short
        name that contains it, ignoring letter case, or is similar to it (pg_trgm word
        similarity of at least 0.4, so one typo in one word still matches).

        **Facets** count the venues each type or field value would give, with every other
        filter applied: the type counts ignore `type`, and the field counts ignore `field`.
        Every type and every field is listed, with 0 when none match. A venue with two fields
        counts once under each.

        A value that breaks a rule gets 400 `bad_request` with `field`.
      tags: [venues]
      parameters:
        - $ref: "#/components/parameters/PageFromOne"
        - $ref: "#/components/parameters/MembershipPageSize"
        - name: includePast
          in: query
          required: false
          description: Show venues whose submission deadline has passed, after the upcoming ones.
          schema:
            type: boolean
            default: false
        - name: rolling
          in: query
          required: false
          description: List only rolling journals (no deadline), by name. Not with `includePast` or a deadline range.
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          required: false
          description: "`conference`, `journal`, `workshop` or `special_issue`; may repeat."
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: field
          in: query
          required: false
          description: A research field key from `GET /venues/fields`; may repeat (at most 21).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: deadlineFrom
          in: query
          required: false
          description: The first day of the deadline range, `YYYY-MM-DD`, in `tz`.
          schema:
            type: string
        - name: deadlineTo
          in: query
          required: false
          description: The last day of the deadline range, `YYYY-MM-DD`, in `tz`. Not before `deadlineFrom`.
          schema:
            type: string
        - name: tz
          in: query
          required: false
          description: The IANA time zone the deadline range is read in. `Asia/Dhaka` when left out.
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Part of a name or short name, 2 to 100 characters after trimming.
          schema:
            type: string
      responses:
        "200":
          description: One page of venues and the facet counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePage"
        "400":
          $ref: "#/components/responses/InvalidVenue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /venues/fields:
    get:
      operationId: listResearchFields
      summary: The fixed list of research fields a venue may have (FR-14.3)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations". In the order to show them; `other` comes last.
      tags: [venues]
      responses:
        "200":
          description: Every research field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchFieldList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /venues/{venueId}:
    get:
      operationId: getVenue
      summary: Read one venue with its full scope text (FR-14.4)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations". A removed venue gets 404 `not_found`, the same as one that does
        not exist. A venue whose deadline has passed is still shown. `scope` is the text the
        administrator entered; a client shows it as text (NFR-8.2) and never as HTML.
      tags: [venues]
      parameters:
        - $ref: "#/components/parameters/VenueId"
      responses:
        "200":
          description: The venue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: rs_access
      description: The access token set by `POST /auth/login`.
    syncToken:
      type: http
      scheme: bearer
      description: |
        `SYNC_SERVICE_TOKEN`, shared by the API and the sync server only. Accepted on the
        API's internal listener; the public port answers 404 for `/internal/` paths.

    compileToken:
      type: http
      scheme: bearer
      description: |
        `COMPILE_SERVICE_TOKEN`, shared by the API and the compile worker only, and different
        from `SYNC_SERVICE_TOKEN`. Accepted on the API's internal listener only.
  parameters:
    PageFromOne:
      name: page
      in: query
      required: false
      description: The page to return, from 1. Defaults to 1. A value below 1 gets 400 `bad_request`.
      schema:
        type: integer
        minimum: 1
        default: 1
    VenueId:
      name: venueId
      in: path
      required: true
      description: |
        The venue's ID, a UUID. It is declared as a plain string so that the login and role
        checks run before it is read (FR-3.1); a value that is not a UUID gets 404 `not_found`.
      schema:
        type: string
    ModeratedUserId:
      name: userId
      in: path
      required: true
      description: |
        The user's ID, a UUID. It is declared as a plain string so that the login and role
        checks run before it is read (FR-3.1); a value that is not a UUID gets 404 `not_found`.
      schema:
        type: string
    WarningId:
      name: warningId
      in: path
      required: true
      description: |
        The warning's ID, a UUID. It is declared as a plain string so that the login and role
        checks run before it is read (FR-3.1); a value that is not a UUID gets 404 `not_found`.
      schema:
        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      description: |
        The project's ID, a UUID. It is declared as a plain string so that the login and role
        checks run before it is read (FR-3.1); a value that is not a UUID gets 404 `not_found`.
      schema:
        type: string
    ProjectFileId:
      name: fileId
      in: path
      required: true
      description: |
        The file's or folder's ID, a UUID, declared as a plain string like `projectId`; a
        value that is not a UUID gets 404 `not_found`.
      schema:
        type: string
    CompileId:
      name: compileId
      in: path
      required: true
      description: The compile's ID, a UUID, declared as a plain string like `projectId`.
      schema:
        type: string
    MembershipPageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page, from 1; a larger value than 50 is reduced to 50. Defaults to 20. Below 1 gets 400 `bad_request`.
      schema:
        type: integer
        minimum: 1
        default: 20
    JoinRequestId:
      name: requestId
      in: path
      required: true
      description: |
        The join request's ID, a UUID. It is declared as a plain string so that the login and
        role checks run before it is read (FR-3.1); a value that is not a UUID gets 404
        `not_found`.
      schema:
        type: string
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: |
        The invitation's ID, a UUID. It is declared as a plain string so that the login and
        role checks run before it is read (FR-3.1); a value that is not a UUID gets 404
        `not_found`.
      schema:
        type: string
    MemberUserId:
      name: userId
      in: path
      required: true
      description: |
        The member's user ID, a UUID. It is declared as a plain string so that the login and
        role checks run before it is read (FR-3.1); a value that is not a UUID gets 404
        `not_found`.
      schema:
        type: string
    ReportId:
      name: reportId
      in: path
      required: true
      description: |
        The report's ID, a UUID. It is declared as a plain string so that the login and role
        checks run before it is read (FR-3.1); a value that is not a UUID gets 404 `not_found`.
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      description: |
        The message's ID, a UUID. It is declared as a plain string so that the login check
        runs before it is read (FR-3.1); a value that is not a UUID names no message and gets
        404 `not_found`.
      schema:
        type: string
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: |
        The conversation's ID, a UUID. It is declared as a plain string so that the login
        check runs before it is read (FR-3.1); a value that is not a UUID names no
        conversation and gets 404 `not_found`.
      schema:
        type: string
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: |
        The attachment's ID, a UUID. It is declared as a plain string so that the login check
        runs before it is read (FR-3.1); a value that is not a UUID names no attachment and
        gets 404 `not_found`.
      schema:
        type: string
    ConnectionListPage:
      name: page
      in: query
      required: false
      description: The page to return, from 1, 20 items each. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    ConnectionRequestID:
      name: requestId
      in: path
      required: true
      description: |
        The request's ID, a UUID. It is declared as a plain string so that the login check
        runs before it is read (FR-3.1); a value that is not a UUID names no request and
        gets 404 `not_found`.
      schema:
        type: string
    FileID:
      name: fileId
      in: path
      required: true
      description: |
        The stored file's ID, a UUID. It is declared as a plain string so that the login
        check runs before it is read (FR-3.1); a value that is not a UUID names no file and
        gets 404 `not_found`.
      schema:
        type: string
    EducationID:
      name: educationId
      in: path
      required: true
      description: |
        The entry's ID, a UUID. It is declared as a plain string so that the login check
        runs before it is read (FR-3.1); a value that is not a UUID names no entry of the
        user and gets 404 `not_found`.
      schema:
        type: string
    ExperienceID:
      name: experienceId
      in: path
      required: true
      description: |
        The entry's ID, a UUID. It is declared as a plain string so that the login check
        runs before it is read (FR-3.1); a value that is not a UUID names no entry of the
        user and gets 404 `not_found`.
      schema:
        type: string
    LanguageID:
      name: languageId
      in: path
      required: true
      description: |
        The entry's ID, a UUID. It is declared as a plain string so that the login check
        runs before it is read (FR-3.1); a value that is not a UUID names no entry of the
        user and gets 404 `not_found`.
      schema:
        type: string
    PublicationID:
      name: publicationId
      in: path
      required: true
      description: |
        The publication's ID, a UUID. It is declared as a plain string so that the login
        check runs before it is read (FR-3.1); a value that is not a UUID names no
        publication of the user and gets 404 `not_found`.
      schema:
        type: string
    PublicationListPage:
      name: page
      in: query
      required: false
      description: The page to return, from 1. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PublicationListPageSize:
      name: pageSize
      in: query
      required: false
      description: |
        Publications per page, from 1. Defaults to 10. A larger value than 50 is reduced
        to 50, and the response says which size was used.
      schema:
        type: integer
        minimum: 1
        default: 10
    LinkID:
      name: linkId
      in: path
      required: true
      description: |
        The link's ID, a UUID. It is declared as a plain string so that the login check
        runs before it is read (FR-3.1); a value that is not a UUID names no link of the
        user and gets 404 `not_found`.
      schema:
        type: string
    TagID:
      name: tagId
      in: path
      required: true
      description: |
        The tag's ID, a UUID. It is declared as a plain string so that the login check runs
        before it is read (FR-3.1); a value that is not a UUID names no tag the user has and
        gets 404 `not_found`.
      schema:
        type: string
    TagQuery:
      name: q
      in: query
      required: false
      description: The text typed so far. Empty or missing gives an empty list.
      schema:
        type: string
    TagLimit:
      name: limit
      in: query
      required: false
      description: |
        Suggestions to return, from 1. Defaults to 10. A larger value than 20 is reduced to
        20.
      schema:
        type: integer
        minimum: 1
        default: 10
    RefreshCookie:
      name: rs_refresh
      in: cookie
      required: false
      description: The refresh token set by `POST /auth/login` or `POST /auth/refresh`.
      schema:
        type: string

  requestBodies:
    AttachmentUpload:
      required: true
      description: |
        The file in the part named `file`. Its content type is ignored; its file name is kept
        for display only, cleaned up.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
    VenueImportUpload:
      required: true
      description: The CSV or JSON file in the part named `file`, at most 1 MiB (docs/venues-import.md).
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
    ImageUpload:
      required: true
      description: The image in the part named `file`. Its file name and content type are ignored.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary

  schemas:
    VenueType:
      type: string
      enum: [conference, journal, workshop, special_issue]
    VenueAttendance:
      type: string
      description: How a conference or workshop takes place. A journal or special issue has none.
      enum: [in_person, online, hybrid]
    ResearchField:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          example: bangla_nlp
        label:
          type: string
          example: Natural language processing
    ResearchFieldList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResearchField"
    VenueTime:
      type: object
      description: |
        A deadline or date of a venue. `at` is the instant (UTC). `local` is the wall time in
        the venue's `timeZone`, as the call for papers states it.
      required: [at, local]
      properties:
        at:
          type: string
          format: date-time
        local:
          type: string
          description: "`YYYY-MM-DDTHH:MM:SS` in the venue's time zone."
          example: "2027-03-01T23:59:59"
    VenueSummary:
      type: object
      description: A venue as the list shows it (FR-14.1).
      required: [id, name, shortName, type, fields, attendance, city, country, startsOn, endsOn,
                 timeZone, submissionDeadline, abstractDeadline, notificationAt, officialUrl, linkKind,
                 rolling, past]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type: string
          nullable: true
          description: The acronym, such as `ICML`.
        type:
          $ref: "#/components/schemas/VenueType"
        fields:
          type: array
          description: 1 to 5 fields, in the order of the fixed list.
          items:
            $ref: "#/components/schemas/ResearchField"
        attendance:
          allOf:
            - $ref: "#/components/schemas/VenueAttendance"
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 code, such as `BD`.
        startsOn:
          type: string
          format: date
          nullable: true
        endsOn:
          type: string
          format: date
          nullable: true
        timeZone:
          type: string
          nullable: true
          description: |
            The zone the deadlines are stated in: `AoE` (anywhere on Earth, UTC-12 all year), `UTC`
            or an IANA name such as `Asia/Dhaka`. Null for a rolling journal.
        submissionDeadline:
          allOf:
            - $ref: "#/components/schemas/VenueTime"
          nullable: true
          description: Null only for a rolling journal.
        abstractDeadline:
          allOf:
            - $ref: "#/components/schemas/VenueTime"
          nullable: true
        notificationAt:
          allOf:
            - $ref: "#/components/schemas/VenueTime"
          nullable: true
        officialUrl:
          type: string
          description: Always `https://`.
        linkKind:
          type: string
          enum: [official, issn_portal]
          description: |
            `official`: the venue's own site. `issn_portal`: the automatic import found no working
            https homepage for this journal and links its ISSN portal record instead, until an
            administrator sets the link.
        rolling:
          type: boolean
          description: A journal that takes submissions at any time; it has no deadline or time zone.
        past:
          type: boolean
          description: The submission deadline has passed. Always false for a rolling journal.
    Venue:
      description: A venue with its full scope text (FR-14.4).
      allOf:
        - $ref: "#/components/schemas/VenueSummary"
        - type: object
          required: [scope, source, locked, createdAt, updatedAt]
          properties:
            scope:
              type: string
              description: Plain text or a small Markdown subset. Show it as text, never as HTML (NFR-8.2).
            source:
              type: string
              description: |
                `manual`: added by an administrator. `import`: from an import file. `ccfddl`,
                `hci_deadlines`, `openalex`: from the automatic import (docs/venues-sync.md).
              enum: [manual, import, ccfddl, hci_deadlines, openalex]
            locked:
              type: boolean
              description: |
                An administrator edited this venue after the automatic import made it, so the
                import no longer changes it. Always false for other venues.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    VenuePage:
      type: object
      required: [items, page, pageSize, total, facets]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VenueSummary"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: Venues that match on all pages.
        facets:
          $ref: "#/components/schemas/VenueFacets"
    VenueFacets:
      type: object
      required: [types, fields]
      properties:
        types:
          type: array
          description: Every type, in the order of `VenueType`.
          items:
            $ref: "#/components/schemas/VenueTypeCount"
        fields:
          type: array
          description: Every research field, in the order of the fixed list.
          items:
            $ref: "#/components/schemas/VenueFieldCount"
    VenueTypeCount:
      type: object
      required: [type, count]
      properties:
        type:
          $ref: "#/components/schemas/VenueType"
        count:
          type: integer
    VenueFieldCount:
      type: object
      required: [key, label, count]
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
    VenueInput:
      type: object
      description: |
        A venue as an administrator enters it (FR-15.1). Text is trimmed first.
        `name`: 1 to 300 characters on one line. `shortName`: at most 40 characters on one line.
        `fields`: 1 to 5 keys from `GET /venues/fields`, without repeats.
        A conference or workshop needs `attendance`; a journal or special issue has none and no
        `startsOn` or `endsOn`. `city` (at most 100 characters) and `country` (ISO 3166-1
        alpha-2) are needed when attendance is `in_person` or `hybrid` and refused when it is
        `online`. `endsOn` is not before `startsOn`.
        `rolling: true` makes a journal that takes submissions at any time: it has no
        `timeZone` and no deadlines (`not_allowed`), and only a journal can be rolling.
        Otherwise `timeZone` and `submissionDeadline` are required.
        `timeZone` is `AoE` (UTC-12, no daylight saving), `UTC` or an IANA name. The deadlines are
        local times in that zone, `YYYY-MM-DD`, `YYYY-MM-DDTHH:MM` or `YYYY-MM-DDTHH:MM:SS`; a date
        alone means 23:59:59 that day. `abstractDeadline` is not after `submissionDeadline`, and
        `notificationAt` is not before it.
        `officialUrl`: an `https://` link with a host and no user name, at most 2,048 characters.
        `scope`: 1 to 10,000 characters; line breaks and tabs are the only control characters
        allowed.
      required: [name, type, fields, officialUrl, scope]
      properties:
        name:
          type: string
        shortName:
          type: string
          nullable: true
        type:
          type: string
          description: A `VenueType` value.
        rolling:
          type: boolean
          default: false
        fields:
          type: array
          items:
            type: string
        attendance:
          type: string
          nullable: true
          description: A `VenueAttendance` value.
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        startsOn:
          type: string
          nullable: true
          description: "`YYYY-MM-DD`."
        endsOn:
          type: string
          nullable: true
          description: "`YYYY-MM-DD`."
        timeZone:
          type: string
          nullable: true
          example: AoE
        submissionDeadline:
          type: string
          nullable: true
          example: "2027-03-01T23:59"
        abstractDeadline:
          type: string
          nullable: true
        notificationAt:
          type: string
          nullable: true
        officialUrl:
          type: string
          example: https://example.org/cfp
        scope:
          type: string
    VenuePatch:
      type: object
      description: The fields of `VenueInput` to change. See `updateVenue`.
      properties:
        rolling:
          type: boolean
          nullable: true
          description: "`null` means false."
          x-go-type: nullable.Nullable[bool]
          x-go-type-skip-optional-pointer: true
