# ResearchSphere API contract (SRS 5.3). Change this file before a handler,
# then run `make generate` to regenerate backend/internal/api/api.gen.go.
openapi: 3.0.3
info:
  title: ResearchSphere API
  version: 0.1.0
  description: |
    JSON API between the web client and the API server. Every error response uses the
    Error schema. Lists are paginated and the server caps the page size at 50. A JSON
    request body with a field its schema does not define is refused with 400
    bad_request, and the message names the field.
servers:
  - url: /api/v1

# Every operation needs a session unless it declares `security: []` (FR-3.1).
security:
  - cookieAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the database, Redis and object storage respond
      description: Public, needs no session. Returns no user data.
      tags: [health]
      # Public for deployment and uptime checks, though not in FR-3.1's list (docs/decisions.md).
      security: []
      responses:
        "200":
          description: The database, Redis and object storage all respond.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database, Redis, object storage or several of them do not respond.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/register:
    post:
      operationId: registerUser
      summary: Register a new account and send a verification link (FR-1.1 to FR-1.3)
      description: |
        Public. Creates the user, the profile and a verification token in one transaction,
        then emails the link. The account exists even when the email cannot be sent; the
        user can ask for a new link (FR-1.5).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account was created and a verification link was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: |
            The input is not valid. `code` is one of `bad_request`, `invalid_full_name`,
            `invalid_email`, `password_too_short` or `password_too_long`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The email address is already registered (`email_taken`), ignoring letter case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address with the token from the link (FR-1.3)
      description: Public. A token works once and expires 24 hours after it was sent.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: The email address is verified.
        "400":
          description: |
            The token cannot be used. `code` is `token_invalid` (unknown), `token_used`
            or `token_expired`, or `bad_request` for a malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Send a new verification link (FR-1.5)
      description: |
        Public. The response is the same whether or not the address is registered or
        already verified. A new link makes the older unused links stop working.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "202":
          description: If the address belongs to an unverified account, a new link was sent.
        "400":
          description: The address is not well formed (`invalid_email`), or the body is malformed (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Send a password reset link (FR-2.3, FR-2.4)
      description: |
        Public. The response is the same whether or not the address is registered or
        verified. When it belongs to an account, a link is emailed to
        `/reset-password#token=...`; it works once and expires after 1 hour. A new link
        makes the account's older unused reset links stop working. A suspended account
        gets no email, and the response is the same (FR-3.4).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: If the address belongs to an account, a reset link was sent.
        "400":
          description: The address is not well formed (`invalid_email`), or the body is malformed (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with the token from a reset link (FR-2.3, FR-2.5)
      description: |
        Public. Sets the new password, marks the token used and the email address
        verified, and ends every session of the account, in one transaction. It also
        clears the account's failed logins (FR-2.7). Access tokens already issued stay
        valid until they expire (at most 15 minutes). A suspended account is refused and
        nothing changes (FR-3.4).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "204":
          description: The password is changed and every session of the account has ended.
        "400":
          description: |
            The reset was refused. `code` is `token_invalid` (unknown or not a reset token),
            `token_used`, `token_expired`, `password_too_short`, `password_too_long`, or
            `bad_request` for a malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The token is valid but the account is suspended (`account_suspended`, FR-3.4).
            The token is not used up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      operationId: loginUser
      summary: Log in with email address and password (FR-2.1, FR-1.4, FR-3.4)
      description: |
        Public. On success the response sets two httpOnly, SameSite=Lax cookies (Secure
        when the site runs on HTTPS): `rs_access`, a signed access token valid for 15
        minutes (path `/`), and `rs_refresh`, a refresh token valid for 30 days (path
        `/api/v1/auth`). Each login starts a new session, which lasts 30 days; refresh it
        with `POST /auth/refresh` and end it with `POST /auth/logout`. A wrong password and
        an unknown email address get the same answer.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in. The cookies are set and the body is the user.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, in two headers."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: The body is malformed (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            The email address or the password is wrong (`invalid_credentials`). The answer
            does not say which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The password is right but the account is suspended (`account_suspended`,
            FR-3.4, with `reason` and, when it is temporary, `until`) or its email address is
            not verified yet (`email_not_verified`, FR-1.4). Suspension is checked first. A
            wrong password always gets 401, so this answer never reveals a suspension to
            someone guessing. A suspension whose `until` has passed no longer counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            The account is locked after 5 failed logins within 15 minutes (`account_locked`,
            FR-2.7). Every login for it is refused for 15 minutes from the 5th failure, even
            with the right password. Failures for an unknown email address count and lock
            the same way, so the answer does not reveal whether an account exists.
          headers:
            Retry-After:
              description: Seconds until the lock ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Issue new tokens for the session in the refresh cookie (FR-2.1, FR-2.2)
      description: |
        Public: the access token may already have expired. Reads the `rs_refresh` cookie,
        replaces the session's refresh token with a new one and issues a new access token.
        The old refresh token stops working. The session keeps the expiry it got at login.
        Sending a refresh token that was already replaced ends the session, since the token
        may have been stolen. A browser must not send two refreshes at the same time.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Refreshed. `rs_access` and `rs_refresh` are set again.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, in two headers."
              schema:
                type: string
        "401":
          description: |
            The cookie is missing, or its session is unknown, expired, ended or was reused,
            or the account is suspended (`session_invalid`). A suspended account's session
            is ended (FR-3.4). The answer does not say which, and clears both cookies.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, cleared, in two headers."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      operationId: logoutUser
      summary: End the session on this device (FR-2.2)
      description: |
        Public. Ends the session in the `rs_refresh` cookie, so its refresh token no longer
        works, and clears both cookies. Other devices stay logged in. Answers 204 even when
        there is no cookie or no such session.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Logged out. Both cookies are cleared.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, cleared, in two headers."
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/password:
    post:
      operationId: changePassword
      summary: Change the password after entering the current one (FR-2.6, FR-2.5)
      description: |
        Needs the access cookie. Checks the current password, stores the new one and ends
        every other session of the account, in one transaction. The session in the
        `rs_refresh` cookie stays logged in; when the cookie is missing or names no live
        session of this user, every session ends. Access tokens already issued on other
        devices stay valid until they expire (at most 15 minutes).

        A wrong current password counts as a failed login (FR-2.7): the 5th failure within
        15 minutes locks the account, and while it is locked this operation is refused
        before the password is checked. A successful change clears the failed logins.
        A wrong current password is a 400, not a 401, so the client does not take it for
        an expired session.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password is changed and every other session of the account has ended.
        "400":
          description: |
            The change was refused. `code` is `wrong_current_password`,
            `password_too_short` or `password_too_long` (the new password),
            `same_password` (the new password equals the current one), or `bad_request`
            for a malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: |
            The account is locked after 5 failed logins within 15 minutes (`account_locked`,
            FR-2.7), as for `POST /auth/login`.
          headers:
            Retry-After:
              description: Seconds until the lock ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the logged-in user
      description: |
        Needs the access cookie. `messagingRestrictedUntil` lets the client show a restriction
        (FR-15.6) before a send is refused.
      tags: [auth]
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /account/delete:
    post:
      operationId: deleteAccount
      summary: Delete the logged-in user's account after entering the password (FR-2.8, FR-2.9)
      description: |
        Needs the access cookie. Refused while the user owns a project that has other
        members (FR-2.9). Otherwise, in one transaction, deletes the projects where the
        user is the only member, the user's publication links and every publication left
        with no author, and the user; the database removes the profile, posts, comments,
        likes, connections, sessions, tokens and embeddings with it (FR-2.8). Then clears
        the failed logins of the account's email address and both session cookies.
        Access tokens already issued on other devices are refused with 401 from then on,
        because their user no longer exists.

        A wrong password counts as a failed login (FR-2.7): the 5th failure within 15
        minutes locks the account, and while it is locked this operation is refused before
        the password is checked. A wrong password is a 400, not a 401, so the client does
        not take it for an expired session.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: The account is deleted.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, cleared, in two headers."
              schema:
                type: string
        "400":
          description: |
            The deletion was refused. `code` is `wrong_password`, or `bad_request` for a
            malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            The user owns projects that have other members (`owns_shared_project`, FR-2.9).
            `projects` lists them; each must be transferred or deleted first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnsSharedProjectError"
        "429":
          description: |
            The account is locked after 5 failed logins within 15 minutes (`account_locked`,
            FR-2.7), as for `POST /auth/login`.
          headers:
            Retry-After:
              description: Seconds until the lock ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users:
    get:
      operationId: listUsers
      summary: List every user account for an administrator (FR-15.3, FR-3.2)
      description: |
        Needs the access cookie and the platform action "Suspend a user account" (SRS 2.3),
        so only an administrator may call it; listing users is what an administrator needs
        before suspending one. A researcher gets 403 with the one refusal body and no user
        data (FR-3.3). Users are sorted newest first.
      tags: [admin]
      parameters:
        - name: page
          in: query
          required: false
          description: The page to return, from 1. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: |
            Users per page, from 1. Defaults to 20. A larger value than 50 is reduced to 50,
            and the response says which size was used.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          description: "`page` or `pageSize` is not a whole number of at least 1 (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/message-reports:
    get:
      operationId: listMessageReports
      summary: List reports of conversations for an administrator (FR-16.9, NFR-14)
      description: |
        Needs the access cookie and the platform action "Review reported conversations"
        (SRS 2.3). 20 per page, newest first. A report's `details` are the reporter's own
        words; the list holds no messages, so reading it writes no audit row.
      tags: [admin]
      parameters:
        - name: status
          in: query
          required: false
          description: "`open` or `resolved`; `open` when left out. Any other value gets 400 `bad_request`."
          schema:
            type: string
        - $ref: "#/components/parameters/PageFromOne"
      responses:
        "200":
          description: One page of reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReportPage"
        "400":
          description: "`status` or `page` is not valid (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/message-reports/{reportId}:
    get:
      operationId: getMessageReport
      summary: Read a report and its conversation up to the report (FR-16.9, NFR-14)
      description: |
        Needs the access cookie and the platform action "Review reported conversations"
        (SRS 2.3). This is the only way an administrator can read a conversation, and only a
        reported one (NFR-14): messages sent after the report are never returned. 100
        messages per page, newest first; `before` loads earlier ones. Every request writes
        one audit row (administrator, report, time) in the same transaction as the read.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - name: before
          in: query
          required: false
          description: |
            `nextBefore` from the previous page; leave it out for the most recent messages. A
            value that is not a UUID gets 400 `bad_request`.
          schema:
            type: string
      responses:
        "200":
          description: The report and one page of its conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReportDetail"
        "400":
          description: "`before` is not valid (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/message-reports/{reportId}/resolve:
    post:
      operationId: resolveMessageReport
      summary: Close a report with an outcome (FR-16.9)
      description: |
        Needs the access cookie and the platform action "Review reported conversations"
        (SRS 2.3). A report is resolved once; it stays readable afterwards. Resolving changes
        nothing else. A moderation action given this report's ID resolves it as `action_taken`
        itself, so an action is the way to close a report with a consequence.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveMessageReportRequest"
      responses:
        "200":
          description: The report, now resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReport"
        "400":
          description: "`outcome` or `note` is not valid (`bad_request`, with `field`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The report is already resolved (`report_already_resolved`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{userId}/warnings:
    post:
      operationId: warnUser
      summary: Warn a user (FR-15.5)
      description: |
        Needs the access cookie and the platform action "Warn or restrict a user" (SRS 2.3).
        In one transaction: stores the warning, an in-app notification (`account_warning`),
        the audit row and, with `reportId`, resolves that report as `action_taken`. The user
        then gets an email with the reason, never the internal note. A mail failure is logged
        and does not undo the action.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ModeratedUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarnUserRequest"
      responses:
        "201":
          description: The warning is stored; the body is its audit row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationAction"
        "400":
          $ref: "#/components/responses/ModerationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ModerationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ModerationConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{userId}/restrictions:
    post:
      operationId: restrictUser
      summary: Stop a user sending messages for a number of days (FR-15.6)
      description: |
        Needs the access cookie and the platform action "Warn or restrict a user" (SRS 2.3).
        Until it ends, sending messages and message requests gets 403 `messaging_restricted`
        with the end time; everything else works. It ends by itself at that time. A user has
        at most one active restriction of a kind (409 `already_restricted`): to change one,
        lift it first. Otherwise as for a warning, without a notification.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ModeratedUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestrictUserRequest"
      responses:
        "201":
          description: The restriction is active; the body is its audit row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationAction"
        "400":
          $ref: "#/components/responses/ModerationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ModerationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ModerationConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/restrictions/{restrictionId}/lift:
    post:
      operationId: liftRestriction
      summary: End a restriction early (FR-15.6)
      description: |
        Needs the access cookie and the platform action "Warn or restrict a user" (SRS 2.3).
        Audited and emailed like any action. It resolves no report. A restriction that has
        ended or been lifted gets 409 `restriction_not_active`.
      tags: [admin]
      parameters:
        - name: restrictionId
          in: path
          required: true
          description: |
            The restriction's ID, a UUID. It is declared as a plain string so that the login and
            role checks run before it is read (FR-3.1); a value that is not a UUID gets 404
            `not_found`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseActionRequest"
      responses:
        "204":
          description: The restriction is lifted.
        "400":
          $ref: "#/components/responses/ModerationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ModerationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ModerationConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{userId}/suspension:
    post:
      operationId: suspendUser
      summary: Suspend an account, for a time or for good (FR-3.4, FR-15.3, FR-15.7)
      description: |
        Needs the access cookie and the platform action "Suspend a user account" (SRS 2.3).
        In one transaction: suspends the account, revokes all its sessions, resolves the
        report if one is given and writes the audit row. An access token already issued works
        until it expires, except on the write paths that check the actor (decisions.md). A
        suspension with `until` ends by itself at that time, checked at login and refresh. An
        account already suspended gets 409 `already_suspended`: to change it, restore first.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ModeratedUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendUserRequest"
      responses:
        "200":
          description: The account is suspended; the body is the audit row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationAction"
        "400":
          $ref: "#/components/responses/ModerationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ModerationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ModerationConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{userId}/restore:
    post:
      operationId: restoreUser
      summary: Restore a suspended account (FR-15.3)
      description: |
        Needs the access cookie and the platform action "Suspend a user account" (SRS 2.3).
        Audited and emailed like any action. It resolves no report. An account that is not
        suspended, also one whose suspension has ended by time, gets 409 `not_suspended`.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ModeratedUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseActionRequest"
      responses:
        "200":
          description: The account is restored; the body is the audit row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationAction"
        "400":
          $ref: "#/components/responses/ModerationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ModerationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ModerationConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{userId}/moderation:
    get:
      operationId: getUserModeration
      summary: A user's moderation history, newest first (FR-15.9)
      description: |
        Needs the access cookie and the platform action "Warn or restrict a user" (SRS 2.3).
        Holds warnings, restrictions, suspensions, what reversed them and the linked reports,
        with internal notes, and `user`, the account the page is about, which is also how an
        administrator reads the name of a suspended user. 20 per page. Reading it about another
        administrator is allowed: only acting on one is refused.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ModeratedUserId"
        - $ref: "#/components/parameters/PageFromOne"
      responses:
        "200":
          description: One page of the history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationHistory"
        "400":
          description: "`page` is below 1 or not a whole number (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/warnings/pending:
    get:
      operationId: listPendingWarnings
      summary: The caller's warnings not yet acknowledged, newest first (FR-15.5)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3). At most 50, enough for the banner. A warning shows
        its reason and time, never the internal note or the administrator.
      tags: [moderation]
      responses:
        "200":
          description: The pending warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWarningList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/warnings/{warningId}:
    get:
      operationId: getMyWarning
      summary: One of the caller's warnings, acknowledged or not (FR-15.5)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3). Another user's warning gets the same 404 as an
        unknown ID. The `account_warning` notification links to the page that reads this.
      tags: [moderation]
      parameters:
        - $ref: "#/components/parameters/WarningId"
      responses:
        "200":
          description: The warning.
          content:
            application/json:
