    VenueRemoval:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Why the venue is removed, 10 to 1,000 characters after trimming. Kept in the audit trail.
    VenueImportResult:
      type: object
      required: [dryRun, created, updated, unchanged, rejected, rows]
      properties:
        dryRun:
          type: boolean
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        rejected:
          type: integer
        rows:
          type: array
          description: One entry per row of the file, in its order.
          items:
            $ref: "#/components/schemas/VenueImportRow"
    VenueImportRow:
      type: object
      required: [row, outcome, sourceKey, reasons]
      properties:
        row:
          type: integer
          description: The row's number, from 1, not counting a CSV header.
        outcome:
          type: string
          enum: [created, updated, unchanged, rejected]
        venueId:
          type: string
          format: uuid
          nullable: true
          description: The venue created or matched. Absent on a dry run's `created` and on `rejected`.
        sourceKey:
          type: string
          description: The row's key, given or derived; empty when it could not be derived.
        reasons:
          type: array
          description: Why the row was rejected; empty otherwise.
          items:
            $ref: "#/components/schemas/VenueImportReason"
    VenueImportReason:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: The column or key at fault, or `row`.
        code:
          type: string
          description: |
            `required`, `too_long`, `invalid`, `not_https`, `unknown_field`, `duplicate_field`,
            `too_many_fields`, `not_allowed`, `invalid_time_zone`, `invalid_date`,
            `ends_before_starts`, `after_deadline`, `before_deadline`, `duplicate_in_file` or
            `venue_removed`. The automatic import (`VenueSyncReject`) adds `deadline_tbd`,
            `unknown_country` and `unreadable`.
    VenueSyncSourceName:
      type: string
      enum: [ccfddl, hci_deadlines, openalex]
    VenueSyncRequest:
      type: object
      properties:
        sources:
          type: array
          description: The sources to run; every source when absent or empty.
          items:
            type: string
    VenueSyncStarted:
      type: object
      required: [dryRun, runs]
      properties:
        dryRun:
          type: boolean
        runs:
          type: array
          items:
            $ref: "#/components/schemas/VenueSyncStartedRun"
    VenueSyncStartedRun:
      type: object
      required: [id, source]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/VenueSyncSourceName"
    VenueSyncStatus:
      type: object
      required: [daily, sources]
      properties:
        daily:
          type: boolean
          description: Whether the daily schedule is on (`VENUE_SYNC_DAILY`).
        sources:
          type: array
          items:
            $ref: "#/components/schemas/VenueSyncSource"
    VenueSyncSource:
      type: object
      required: [source, label, licence, url, commit, lastRun, lastDryRun, nextRunAt]
      properties:
        source:
          $ref: "#/components/schemas/VenueSyncSourceName"
        label:
          type: string
          example: ccf-deadlines (conferences)
        licence:
          type: string
          example: MIT
        url:
          type: string
          description: Where it is read from, such as the repository and its branch.
        commit:
          type: string
          nullable: true
          description: The commit of the repository the last real run read; null for OpenAlex or before the first run.
        lastRun:
          allOf:
            - $ref: "#/components/schemas/VenueSyncRun"
          nullable: true
        lastDryRun:
          allOf:
            - $ref: "#/components/schemas/VenueSyncRun"
          nullable: true
        nextRunAt:
          type: string
          format: date-time
          nullable: true
          description: When the next scheduled run is due at the earliest; null while the schedule is off.
    VenueSyncRun:
      type: object
      required: [id, dryRun, trigger, status, startedAt, finishedAt, commit, created, updated, unchanged,
                 skipped, rejected, errors, rejects]
      properties:
        id:
          type: string
          format: uuid
        dryRun:
          type: boolean
        trigger:
          type: string
          enum: [schedule, on_demand, command]
        status:
          type: string
          enum: [running, succeeded, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        commit:
          type: string
          nullable: true
          description: The repository commit this run read.
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        skipped:
          type: integer
          description: Entries left alone because their venue is locked or removed, or another source has the same conference edition.
        rejected:
          type: integer
        errors:
          type: array
          description: What went wrong reading the source, such as a file that is not valid YAML; never secrets.
          items:
            type: string
        rejects:
          type: array
          description: The rejected entries with every reason, at most 200.
          items:
            $ref: "#/components/schemas/VenueSyncReject"
    VenueSyncReject:
      type: object
      required: [sourceKey, name, reasons]
      properties:
        sourceKey:
          type: string
        name:
          type: string
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/VenueImportReason"
    Error:
      type: object
      description: The shape of every error response (SRS 5.3).
      required: [code, message]
      properties:
        code:
          type: string
          description: Short machine-readable code, in snake_case.
          example: not_found
        message:
          type: string
          description: Readable explanation for the user.
          example: The requested resource does not exist.
        field:
          type: string
          description: |
            On `bad_request`, the body field or parameter that broke the contract, when
            one did. A nested field is a dotted path and a list item has its index, such as
            `items[2].name`. The submitted value is never repeated.
          example: clientId
        reason:
          type: string
          description: |
            On `account_suspended`, the reason the administrator gave the user. Absent for an
            account suspended before reasons were recorded.
        until:
          type: string
          format: date-time
          description: |
            On `account_suspended`, when a temporary suspension ends; absent when it is
            permanent. On `messaging_restricted`, when the restriction ends.
        userIds:
          type: array
          description: |
            On `ineligible_members`, the users who cannot be added to the group. It never says
            why for any of them (FR-16.6).
          items:
            type: string
            format: uuid

    Health:
      type: object
      required: [status, database, redis, storage, ai]
      properties:
        status:
          type: string
          description: ok when everything responds; degraded when only the AI service does not.
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok]
        redis:
          type: string
          enum: [ok]
        storage:
          type: string
          enum: [ok]
        ai:
          type: string
          description: Whether the AI service answers GET /ready (its model is loaded).
          enum: [ok, unavailable]

    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName:
          type: string
          description: Trimmed, 1 to 200 characters.
          maxLength: 200
          example: Ada Lovelace
        email:
          type: string
          maxLength: 254
          example: ada@example.org
        password:
          type: string
          description: 8 to 128 characters.
          minLength: 8
          maxLength: 128
          format: password

    RegisterResponse:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The address the verification link was sent to.

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token from the verification link.

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254

    PasswordResetConfirm:
