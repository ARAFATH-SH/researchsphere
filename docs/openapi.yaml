  /profiles/me/experience/{experienceId}:
    patch:
      operationId: updateMyExperience
      summary: Change some fields of one of the logged-in user's experience entries (FR-4.8)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). A field that is missing keeps its value; `null` clears
        `location`, `locationType`, `endDate` or `description`. The rules of
