# ResearchSphere API contract (SRS 5.3). Change this file before a handler,
# then run `make generate` to regenerate backend/internal/api/api.gen.go.
openapi: 3.0.3
info:
  title: ResearchSphere API
  version: 0.1.0
  description: |
    JSON API between the web client and the API server. Every error response uses the
    Error schema. Lists are paginated and the server caps the page size at 50. A JSON
    request body with a field its schema does not define is refused with 400
    bad_request, and the message names the field.

    Email trust (FR-17.3): a session whose email address is not verified may use only
    its own account (`getCurrentUser`, `changePassword`, `deleteAccount`), read and
    edit its own profile (the `/profiles/me` operations, photo and cover included, but
    not the DOI and ORCID lookups), the tag suggestions, its own notifications and its
    own warnings. Every other operation that needs a session answers 403
    `{"code":"email_not_verified","message":"Verify your email address to do this."}`
    before any other permission check. Login refuses unverified accounts today (FR-1.4),
    so no such session exists yet; the rule is checked in one place on the server.
servers:
  - url: /api/v1

# Every operation needs a session unless it declares `security: []` (FR-3.1).
security:
  - cookieAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the database, Redis, object storage and the AI service respond
      description: |
        Public, needs no session. Returns no user data. The AI service (embeddings, AI-1) is
        optional (NFR-10.2): when only it does not answer, the response is still 200, with
        `status: degraded` and `ai: unavailable`, because every other feature keeps working.
      tags: [health]
      # Public for deployment and uptime checks, though not in FR-3.1's list (docs/decisions.md).
      security: []
      responses:
        "200":
          description: The database, Redis and object storage all respond; `ai` says whether the AI service does too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database, Redis, object storage or several of them do not respond. The message names only those; the AI service never makes this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/register:
    post:
      operationId: registerUser
      summary: Register a new account and send a verification link (FR-1.1 to FR-1.3)
      description: |
        Public. Creates the user, the profile and a verification token in one transaction,
        then emails the link. The account exists even when the email cannot be sent; the
        user can ask for a new link (FR-1.5).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account was created and a verification link was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: |
            The input is not valid. `code` is one of `bad_request`, `invalid_full_name`,
            `invalid_email`, `password_too_short` or `password_too_long`, or
            `email_domain_not_allowed` (`field: email`, FR-17.2): the domain is a known
            disposable one, or it cannot receive email (no MX and no A or AAAA record, or a
            null MX). The message is the same for both: "Use a permanent email address you
            can receive mail at."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The email address is already registered (`email_taken`), ignoring letter case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address with the token from the link (FR-1.3)
      description: Public. A token works once and expires 24 hours after it was sent.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: The email address is verified.
        "400":
          description: |
            The token cannot be used. `code` is `token_invalid` (unknown), `token_used`
            or `token_expired`, or `bad_request` for a malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Send a new verification link (FR-1.5)
      description: |
        Public. The response is the same whether or not the address is registered or
        already verified. A new link makes the older unused links stop working.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "202":
          description: If the address belongs to an unverified account, a new link was sent.
        "400":
          description: The address is not well formed (`invalid_email`), or the body is malformed (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Send a password reset link (FR-2.3, FR-2.4)
      description: |
        Public. The response is the same whether or not the address is registered or
        verified. When it belongs to an account, a link is emailed to
        `/reset-password#token=...`; it works once and expires after 1 hour. A new link
        makes the account's older unused reset links stop working. A suspended account
        gets no email, and the response is the same (FR-3.4).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: If the address belongs to an account, a reset link was sent.
        "400":
          description: The address is not well formed (`invalid_email`), or the body is malformed (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with the token from a reset link (FR-2.3, FR-2.5)
      description: |
        Public. Sets the new password, marks the token used and the email address
        verified, and ends every session of the account, in one transaction. It also
        clears the account's failed logins (FR-2.7). Access tokens already issued stay
        valid until they expire (at most 15 minutes). A suspended account is refused and
        nothing changes (FR-3.4).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "204":
          description: The password is changed and every session of the account has ended.
        "400":
          description: |
            The reset was refused. `code` is `token_invalid` (unknown or not a reset token),
            `token_used`, `token_expired`, `password_too_short`, `password_too_long`, or
            `bad_request` for a malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The token is valid but the account is suspended (`account_suspended`, FR-3.4).
            The token is not used up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      operationId: loginUser
      summary: Log in with email address and password (FR-2.1, FR-1.4, FR-3.4)
      description: |
        Public. On success the response sets two httpOnly, SameSite=Lax cookies (Secure
        when the site runs on HTTPS): `rs_access`, a signed access token valid for 15
        minutes (path `/`), and `rs_refresh`, a refresh token valid for 30 days (path
        `/api/v1/auth`). Each login starts a new session, which lasts 30 days; refresh it
        with `POST /auth/refresh` and end it with `POST /auth/logout`. A wrong password and
        an unknown email address get the same answer.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in. The cookies are set and the body is the user.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, in two headers."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: The body is malformed (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            The email address or the password is wrong (`invalid_credentials`). The answer
            does not say which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The password is right but the account is suspended (`account_suspended`,
            FR-3.4, with `reason` and, when it is temporary, `until`) or its email address is
            not verified yet (`email_not_verified`, FR-1.4). Suspension is checked first. A
            wrong password always gets 401, so this answer never reveals a suspension to
            someone guessing. A suspension whose `until` has passed no longer counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            The account is locked after 5 failed logins within 15 minutes (`account_locked`,
            FR-2.7). Every login for it is refused for 15 minutes from the 5th failure, even
            with the right password. Failures for an unknown email address count and lock
            the same way, so the answer does not reveal whether an account exists.
          headers:
            Retry-After:
              description: Seconds until the lock ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Issue new tokens for the session in the refresh cookie (FR-2.1, FR-2.2)
      description: |
        Public: the access token may already have expired. Reads the `rs_refresh` cookie,
        replaces the session's refresh token with a new one and issues a new access token.
        The old refresh token stops working. The session keeps the expiry it got at login.
        Sending a refresh token that was already replaced ends the session, since the token
        may have been stolen. A browser must not send two refreshes at the same time.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Refreshed. `rs_access` and `rs_refresh` are set again.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, in two headers."
              schema:
                type: string
        "401":
          description: |
            The cookie is missing, or its session is unknown, expired, ended or was reused,
            or the account is suspended (`session_invalid`). A suspended account's session
            is ended (FR-3.4). The answer does not say which, and clears both cookies.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, cleared, in two headers."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      operationId: logoutUser
      summary: End the session on this device (FR-2.2)
      description: |
        Public. Ends the session in the `rs_refresh` cookie, so its refresh token no longer
        works, and clears both cookies. Other devices stay logged in. Answers 204 even when
        there is no cookie or no such session.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Logged out. Both cookies are cleared.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, cleared, in two headers."
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/password:
    post:
      operationId: changePassword
      summary: Change the password after entering the current one (FR-2.6, FR-2.5)
      description: |
        Needs the access cookie. Checks the current password, stores the new one and ends
        every other session of the account, in one transaction. The session in the
        `rs_refresh` cookie stays logged in; when the cookie is missing or names no live
        session of this user, every session ends. Access tokens already issued on other
        devices stay valid until they expire (at most 15 minutes).

        A wrong current password counts as a failed login (FR-2.7): the 5th failure within
        15 minutes locks the account, and while it is locked this operation is refused
        before the password is checked. A successful change clears the failed logins.
        A wrong current password is a 400, not a 401, so the client does not take it for
        an expired session.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password is changed and every other session of the account has ended.
        "400":
          description: |
            The change was refused. `code` is `wrong_current_password`,
            `password_too_short` or `password_too_long` (the new password),
            `same_password` (the new password equals the current one), or `bad_request`
            for a malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: |
            The account is locked after 5 failed logins within 15 minutes (`account_locked`,
            FR-2.7), as for `POST /auth/login`.
          headers:
            Retry-After:
              description: Seconds until the lock ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the logged-in user
      description: |
        Needs the access cookie. `messagingRestrictedUntil` lets the client show a restriction
        (FR-15.6) before a send is refused.
      tags: [auth]
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /account/delete:
    post:
      operationId: deleteAccount
      summary: Delete the logged-in user's account after entering the password (FR-2.8, FR-2.9)
      description: |
        Needs the access cookie. Refused while the user owns a project that has other
        members (FR-2.9). Otherwise, in one transaction, deletes the projects where the
        user is the only member, the user's publication links and every publication left
        with no author, and the user; the database removes the profile, posts, comments,
        likes, connections, sessions, tokens and embeddings with it (FR-2.8). Then clears
        the failed logins of the account's email address and both session cookies.
        Access tokens already issued on other devices are refused with 401 from then on,
        because their user no longer exists.

        A wrong password counts as a failed login (FR-2.7): the 5th failure within 15
        minutes locks the account, and while it is locked this operation is refused before
        the password is checked. A wrong password is a 400, not a 401, so the client does
        not take it for an expired session.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: The account is deleted.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, cleared, in two headers."
              schema:
                type: string
        "400":
          description: |
            The deletion was refused. `code` is `wrong_password`, or `bad_request` for a
            malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            The user owns projects that have other members (`owns_shared_project`, FR-2.9).
            `projects` lists them; each must be transferred or deleted first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnsSharedProjectError"
        "429":
          description: |
            The account is locked after 5 failed logins within 15 minutes (`account_locked`,
            FR-2.7), as for `POST /auth/login`.
          headers:
            Retry-After:
              description: Seconds until the lock ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users:
    get:
      operationId: listUsers
      summary: List every user account for an administrator (FR-15.3, FR-3.2)
      description: |
        Needs the access cookie and the platform action "Suspend a user account" (SRS 2.3),
        so only an administrator may call it; listing users is what an administrator needs
        before suspending one. A researcher gets 403 with the one refusal body and no user
        data (FR-3.3). Users are sorted newest first.
      tags: [admin]
      parameters:
        - name: page
          in: query
          required: false
          description: The page to return, from 1. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: |
            Users per page, from 1. Defaults to 20. A larger value than 50 is reduced to 50,
            and the response says which size was used.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          description: "`page` or `pageSize` is not a whole number of at least 1 (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/ai/embeddings:
    get:
      operationId: getEmbeddingStats
      summary: The state of the AI embeddings, for the admin page's "AI matching model" card (AI-1.6)
      description: |
        Needs the access cookie and the platform action "Manage the AI matching model", which
        only an administrator has; a researcher gets 403 with the one refusal body. `model` is
        the model the AI service has loaded, as `name@revision`, or null when the service does
        not answer within 2 seconds. For each owner type: the stored embeddings, how many of
        them the current model made, the jobs waiting in the queue and the jobs that failed 5
        times. Nothing here names a user.
      tags: [admin]
      responses:
        "200":
          description: The current model and the counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/ai/embeddings/rebuild:
    post:
      operationId: rebuildEmbeddings
      summary: Queue every embedding to be made again (AI-1.6)
      description: |
        Needs the access cookie and the platform action "Manage the AI matching model".
        Queues every eligible owner (a verified, not suspended user's profile, every
        project and every venue not removed) at low priority, forced, so each embedding
        is made again even when its text and model have not changed; changes users make go
        first. The work happens in the background; the answer comes at once. Asking again
        leaves one job per owner. Each call is recorded with the administrator and the count.
      tags: [admin]
      responses:
        "202":
          description: The owners are queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingRebuild"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/message-reports:
    get:
      operationId: listMessageReports
      summary: List reports of conversations for an administrator (FR-16.9, NFR-13)
      description: |
        Needs the access cookie and the platform action "Review reported conversations"
        (SRS 2.3). 20 per page, newest first. A report's `details` are the reporter's own
        words; the list holds no messages, so reading it writes no audit row.
      tags: [admin]
      parameters:
        - name: status
          in: query
          required: false
          description: "`open` or `resolved`; `open` when left out. Any other value gets 400 `bad_request`."
          schema:
            type: string
        - $ref: "#/components/parameters/PageFromOne"
      responses:
        "200":
          description: One page of reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReportPage"
        "400":
          description: "`status` or `page` is not valid (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/message-reports/{reportId}:
    get:
      operationId: getMessageReport
      summary: Read a report and its conversation up to the report (FR-16.9, NFR-13)
      description: |
        Needs the access cookie and the platform action "Review reported conversations"
        (SRS 2.3). This is the only way an administrator can read a conversation, and only a
        reported one (NFR-13): messages sent after the report are never returned. 100
        messages per page, newest first; `before` loads earlier ones. Every request writes
        one audit row (administrator, report, time) in the same transaction as the read.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - name: before
          in: query
          required: false
          description: |
            `nextBefore` from the previous page; leave it out for the most recent messages. A
            value that is not a UUID gets 400 `bad_request`.
          schema:
            type: string
      responses:
        "200":
          description: The report and one page of its conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReportDetail"
        "400":
          description: "`before` is not valid (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/message-reports/{reportId}/attachments/{attachmentId}:
    get:
      operationId: getReportedAttachment
      summary: Download an attachment of a reported conversation (FR-16.7, FR-16.9, NFR-13)
      description: |
        Needs the access cookie and the platform action "Review reported conversations"
        (SRS 2.3). Only an attachment of a message of the reported conversation sent at or
        before the report's moment, as `getMessageReport` lists it, also when the message was
        deleted later. Every download writes one audit row (administrator, report, file, time)
        in the same transaction as the permission check. The scan answers and the redirect are
        those of `getAttachment`.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "302":
          $ref: "#/components/responses/AttachmentRedirect"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AttachmentNotReady"
        "410":
          $ref: "#/components/responses/AttachmentRemoved"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/message-reports/{reportId}/resolve:
    post:
      operationId: resolveMessageReport
      summary: Close a report with an outcome (FR-16.9)
      description: |
        Needs the access cookie and the platform action "Review reported conversations"
        (SRS 2.3). A report is resolved once; it stays readable afterwards. Resolving changes
        nothing else. A moderation action given this report's ID resolves it as `action_taken`
        itself, so an action is the way to close a report with a consequence.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveMessageReportRequest"
      responses:
        "200":
          description: The report, now resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReport"
        "400":
          description: "`outcome` or `note` is not valid (`bad_request`, with `field`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The report is already resolved (`report_already_resolved`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/project-reports:
    get:
      operationId: listProjectReports
      summary: List reports of projects for an administrator (FR-15.11)
      description: |
        Needs the access cookie and the platform action "Review reported projects" (SRS 2.3).
        20 per page, newest first. A report's `details` are the reporter's own words. A
        report is deleted with its project.
      tags: [admin]
      parameters:
        - name: status
          in: query
          required: false
          description: "`open` or `resolved`; `open` when left out. Any other value gets 400 `bad_request`."
          schema:
            type: string
        - $ref: "#/components/parameters/PageFromOne"
      responses:
        "200":
          description: One page of reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectReportPage"
        "400":
          description: "`status` or `page` is not valid (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/project-reports/{reportId}:
    get:
      operationId: getProjectReport
      summary: Read a report and the reported project as it is now (FR-15.11)
      description: |
        Needs the access cookie and the platform action "Review reported projects" (SRS 2.3).
        The project is shown whatever its status, archived included, with its abstract. This
        gives the administrator no right inside the project (SRS 2.3): no workspace, no
        editing, no deletion.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: The report and the project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectReportDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/project-reports/{reportId}/resolve:
    post:
      operationId: resolveProjectReport
      summary: Close a project report with an outcome (FR-15.11)
      description: |
        Needs the access cookie and the platform action "Review reported projects" (SRS 2.3).
        A report is resolved once; it stays readable afterwards. Resolving changes nothing
        else: the project is never deleted or changed by an administrator. `action_taken`
        records that the administrator acted on the owner through a moderation action
        (warning, restriction or suspension).
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveProjectReportRequest"
      responses:
        "200":
          description: The report, now resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectReport"
        "400":
          description: "`outcome` or `note` is not valid (`bad_request`, with `field`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The report is already resolved (`report_already_resolved`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/venues:
    post:
      operationId: createVenue
      summary: Add a venue (FR-15.1)
      description: |
        Needs the access cookie and the platform action "Add, edit and remove venues", which
        only an administrator has (SRS 2.3). The rules are in `VenueInput`. The first field
        that breaks one gets 400 `bad_request` with `field`. The venue and its audit row
        (`create`) are written in one transaction. The new venue is queued for its embedding
        (AI-1.3).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueInput"
      responses:
        "201":
          description: The new venue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          $ref: "#/components/responses/InvalidVenue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/venues/{venueId}:
    patch:
      operationId: updateVenue
      summary: Change a venue (FR-15.1)
      description: |
        Needs the platform action "Add, edit and remove venues". A missing field keeps its
        value. `null` clears an optional field (`shortName`, `attendance`, `city`, `country`,
        `startsOn`, `endsOn`, `abstractDeadline`, `notificationAt`); `null` for any other field
        is refused. The venue as changed must follow every rule of `VenueInput`. Changing
        `timeZone` alone keeps the local times of the deadlines and reads them in the new zone.
        A change writes an `update` audit row that names the changed fields, never their
        values; a request that changes nothing writes none. A change of name, short name, scope
        or fields queues the venue's embedding again. A removed venue gets 404 `not_found`.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/VenueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenuePatch"
      responses:
        "200":
          description: The venue as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          $ref: "#/components/responses/InvalidVenue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/venues/{venueId}/remove:
    post:
      operationId: removeVenue
      summary: Remove a venue, with a recorded reason (FR-15.1)
      description: |
        Needs the platform action "Add, edit and remove venues". The venue is kept for the
        audit trail but no user sees it again: lists leave it out and its page answers 404.
        Its embedding is deleted at once, so venue recommendations never return it. `reason`
        is 10 to 1,000 characters after trimming (`bad_request`, `field: reason`). The removal
        and its `remove` audit row, with the reason, are one transaction. A venue already
        removed gets 404 `not_found`. There is no restore.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/VenueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueRemoval"
      responses:
        "204":
          description: The venue is removed.
        "400":
          $ref: "#/components/responses/InvalidVenue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/venues/import:
    post:
      operationId: importVenues
      summary: Add and update venues from a CSV or JSON file (FR-14.5, interim; docs/venues-import.md)
      description: |
        Needs the platform action "Add, edit and remove venues". The file is in the part named
        `file`, at most 1 MiB and 1,000 rows. A name ending in `.csv` is read as CSV, `.json` as
        JSON. With any other name, a file whose first non-blank character is `[` is read as
        JSON and anything else as CSV. The columns and keys are those of `VenueInput` plus
        `sourceKey` (docs/venues-import.md). A CSV `fields` cell holds keys separated by `;`.

        **Each row** is checked with the rules of `VenueInput`, and every problem is reported,
        not only the first. Its key is `sourceKey`, or, when that is empty, `auto:` + the folded
        name + `:` + the year of `startsOn` (of the deadline when there is no `startsOn`). A key
        that no imported venue has is `created`. A live imported venue with that key is
        `updated` when any value differs and `unchanged` otherwise. A venue an administrator
        added by hand is never matched. A rejected row is skipped, with its reasons:
        `duplicate_in_file` when an earlier row has the same key, and `venue_removed` when the
        venue with that key was removed (it is not brought back).

        **`dryRun=true`** reports the same outcomes and changes nothing. Otherwise every
        accepted row is written in one transaction, each with an `import_create` or
        `import_update` audit row sharing one import ID.

        A file that cannot be read as a whole (not CSV or JSON, an unknown column or key, no
        rows) gets 400 `invalid_import_file`. More than 1,000 rows gets 400 `too_many_rows`, and
        over 1 MiB gets 413 `file_too_large`.
      tags: [admin]
      parameters:
        - name: dryRun
          in: query
          required: false
          description: Report what would happen and change nothing.
          schema:
            type: boolean
            default: false
      requestBody:
        $ref: "#/components/requestBodies/VenueImportUpload"
      responses:
        "200":
          description: What happened to each row, or would happen on a dry run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueImportResult"
        "400":
          description: "`invalid_import_file`, `too_many_rows`, or `bad_request` when there is no part named `file`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/venues/sync:
    get:
      operationId: getVenueSyncStatus
      summary: The state of the automatic venue import, per source (FR-14.5; docs/venues-sync.md)
      description: |
        Needs the platform action "Add, edit and remove venues". One entry per source, in the
        order `ccfddl`, `hci_deadlines`, `openalex`: its licence and where it is read from,
        the commit last read (repositories only), the latest real run and the latest dry run
        with their counts, errors and rejected entries, and when the next scheduled run is due
        (null while the daily schedule is off, `VENUE_SYNC_DAILY`).
      tags: [admin]
      responses:
        "200":
          description: Every source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueSyncStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: startVenueSync
      summary: Run the automatic venue import now, or a dry run of it (FR-14.5; docs/venues-sync.md)
      description: |
        Needs the platform action "Add, edit and remove venues". Starts one run per source
        named in `sources` (every source when the body or the list is absent) in the
        background and answers at once with the runs' IDs; `GET /admin/venues/sync` shows
        their progress and results. A run reads its source politely (conditional requests,
        timeouts, backoff, a User-Agent with the operator's contact address), maps each entry
        to a venue with the rules of `VenueInput` and upserts it by source and key. A venue
        added by hand, by a file import, removed, or edited by an administrator after import
        (`locked`) is never changed. Every change has an `import_create` or `import_update` audit
        row with the actor `import` and the run's ID.

        **`dryRun=true`** reads the sources and reports the same outcomes, but writes no venue
        and stores nothing it read; only its run record is kept.

        Refused for every source when any is refused: 409 `venue_sync_running` while a run of a
        named source is in progress; 429 `venue_sync_too_soon` for a real run less than
        `VENUE_SYNC_MIN_INTERVAL` (default 1 hour) after the last real run of that source;
        503 `venue_sync_unconfigured` when `VENUE_SYNC_CONTACT_EMAIL` is not set. An unknown
        source gets 400 `bad_request` with `field: sources`.
      tags: [admin]
      parameters:
        - name: dryRun
          in: query
          required: false
          description: Report what would happen and change nothing.
          schema:
            type: boolean
            default: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueSyncRequest"
      responses:
        "202":
          description: The runs started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueSyncStarted"
        "400":
          $ref: "#/components/responses/InvalidVenue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`venue_sync_running`: a run of a named source is in progress."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`venue_sync_too_soon`: a real run of a named source started less than `VENUE_SYNC_MIN_INTERVAL` ago."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "`venue_sync_unconfigured`: no contact address is set for the sources (`VENUE_SYNC_CONTACT_EMAIL`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/{userId}/warnings:
    post:
      operationId: warnUser
      summary: Warn a user (FR-15.5)
      description: |
        Needs the access cookie and the platform action "Warn or restrict a user" (SRS 2.3).
        In one transaction: stores the warning, an in-app notification (`account_warning`),
        the audit row and, with `reportId`, resolves that report as `action_taken`. The user
        then gets an email with the reason, never the internal note. A mail failure is logged
        and does not undo the action.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ModeratedUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarnUserRequest"
      responses:
        "201":
          description: The warning is stored; the body is its audit row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationAction"
        "400":
          $ref: "#/components/responses/ModerationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ModerationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ModerationConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{userId}/restrictions:
    post:
      operationId: restrictUser
      summary: Stop a user sending messages for a number of days (FR-15.6)
      description: |
        Needs the access cookie and the platform action "Warn or restrict a user" (SRS 2.3).
        Until it ends, sending messages and message requests gets 403 `messaging_restricted`
        with the end time; everything else works. It ends by itself at that time. A user has
        at most one active restriction of a kind (409 `already_restricted`): to change one,
        lift it first. Otherwise as for a warning, without a notification.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ModeratedUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestrictUserRequest"
      responses:
        "201":
          description: The restriction is active; the body is its audit row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationAction"
        "400":
          $ref: "#/components/responses/ModerationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ModerationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ModerationConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/restrictions/{restrictionId}/lift:
    post:
      operationId: liftRestriction
      summary: End a restriction early (FR-15.6)
      description: |
        Needs the access cookie and the platform action "Warn or restrict a user" (SRS 2.3).
        Audited and emailed like any action. It resolves no report. A restriction that has
        ended or been lifted gets 409 `restriction_not_active`.
      tags: [admin]
      parameters:
        - name: restrictionId
          in: path
          required: true
          description: |
            The restriction's ID, a UUID. It is declared as a plain string so that the login and
            role checks run before it is read (FR-3.1); a value that is not a UUID gets 404
            `not_found`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseActionRequest"
      responses:
        "204":
          description: The restriction is lifted.
        "400":
          $ref: "#/components/responses/ModerationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ModerationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ModerationConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{userId}/suspension:
    post:
      operationId: suspendUser
      summary: Suspend an account, for a time or for good (FR-3.4, FR-15.3, FR-15.7)
      description: |
        Needs the access cookie and the platform action "Suspend a user account" (SRS 2.3).
        In one transaction: suspends the account, revokes all its sessions, resolves the
        report if one is given and writes the audit row. An access token already issued works
        until it expires, except on the write paths that check the actor (decisions.md). A
        suspension with `until` ends by itself at that time, checked at login and refresh. An
        account already suspended gets 409 `already_suspended`: to change it, restore first.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ModeratedUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendUserRequest"
      responses:
        "200":
          description: The account is suspended; the body is the audit row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationAction"
        "400":
          $ref: "#/components/responses/ModerationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ModerationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ModerationConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{userId}/restore:
    post:
      operationId: restoreUser
      summary: Restore a suspended account (FR-15.3)
      description: |
        Needs the access cookie and the platform action "Suspend a user account" (SRS 2.3).
        Audited and emailed like any action. It resolves no report. An account that is not
        suspended, also one whose suspension has ended by time, gets 409 `not_suspended`.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ModeratedUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseActionRequest"
      responses:
        "200":
          description: The account is restored; the body is the audit row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationAction"
        "400":
          $ref: "#/components/responses/ModerationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ModerationForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ModerationConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{userId}/moderation:
    get:
      operationId: getUserModeration
      summary: A user's moderation history, newest first (FR-15.9)
      description: |
        Needs the access cookie and the platform action "Warn or restrict a user" (SRS 2.3).
        Holds warnings, restrictions, suspensions, what reversed them and the linked reports,
        with internal notes, and `user`, the account the page is about, which is also how an
        administrator reads the name of a suspended user. 20 per page. Reading it about another
        administrator is allowed: only acting on one is refused.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ModeratedUserId"
        - $ref: "#/components/parameters/PageFromOne"
      responses:
        "200":
          description: One page of the history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationHistory"
        "400":
          description: "`page` is below 1 or not a whole number (`bad_request`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/warnings/pending:
    get:
      operationId: listPendingWarnings
      summary: The caller's warnings not yet acknowledged, newest first (FR-15.5)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3). At most 50, enough for the banner. A warning shows
        its reason and time, never the internal note or the administrator.
      tags: [moderation]
      responses:
        "200":
          description: The pending warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWarningList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/warnings/{warningId}:
    get:
      operationId: getMyWarning
      summary: One of the caller's warnings, acknowledged or not (FR-15.5)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3). Another user's warning gets the same 404 as an
        unknown ID. The `account_warning` notification links to the page that reads this.
      tags: [moderation]
      parameters:
        - $ref: "#/components/parameters/WarningId"
      responses:
        "200":
          description: The warning.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWarning"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/warnings/{warningId}/acknowledge:
    post:
      operationId: acknowledgeWarning
      summary: Acknowledge one of the caller's warnings (FR-15.5)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3): a user must be able to clear the banner, so this
        stays open during a restriction. Acknowledging twice succeeds and keeps the first
        time. Another user's warning gets the same 404 as an unknown ID.
      tags: [moderation]
      parameters:
        - $ref: "#/components/parameters/WarningId"
      responses:
        "204":
          description: The warning is acknowledged.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/settings:
    get:
      operationId: getMySettings
      summary: Return the caller's account settings (FR-16.11)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3). A user who never changed a setting gets the defaults.
      tags: [messaging]
      responses:
        "200":
          description: The caller's settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateMySettings
      summary: Change some of the caller's account settings (FR-16.11)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed, events
        and recommendations" (SRS 2.3), so a restricted user can still stop emails. Changes
        only the fields in the body; a body that names no setting gets `bad_request`.
      tags: [messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdate"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          description: The body names no setting, or a value has the wrong type (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /unsubscribe:
    post:
      operationId: unsubscribeDigest
      summary: Turn off the unread message digest with the token from its email (FR-16.11)
      description: |
        Public: no session needed. The token comes from the digest's unsubscribe link and
        its `List-Unsubscribe` header; mail clients POST here with the body
        `List-Unsubscribe=One-Click` (RFC 8058), which is ignored. The token never
        expires and only ever turns the digest off; turning it on again needs Settings.
        Turning it off twice succeeds, and a valid token of an account that no longer
        exists changes nothing and also gets 204.
      tags: [messaging]
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        "204":
          description: The digest is off.
        "400":
          description: The token is missing, malformed or not signed by this server (`invalid_token`, with `field` `token`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me:
    get:
      operationId: getMyProfile
      summary: Return the logged-in user's profile (FR-4.1)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). An account without a profile row gets an
        empty profile (every field null, `fullName` empty) instead of 404.
      tags: [profile]
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateMyProfile
      summary: Create or replace the logged-in user's profile fields (FR-4.1)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). Replaces every field in the body: an optional field that
        is missing, null, or empty after trimming is stored as null. Each value is trimmed;
        `country` is then upper-cased. Interests, skills, education, experience, languages
        and publications are not changed here.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The saved profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: |
            A field is not valid. The code names the first invalid field, in this order:
            `invalid_full_name`, `invalid_headline`, `invalid_bio`, `invalid_institution`,
            `invalid_department`, `invalid_job_title`, `invalid_country`, `invalid_city`. A
            body that is not JSON gets `bad_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/{userId}:
    get:
      operationId: getProfile
      summary: Return any user's profile to a logged-in user (FR-4.5)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). An unknown, suspended or unverified account
        gets the same 404 `not_found`, so the answer does not reveal which it is. So does a
        viewer whom this user has blocked (FR-16.9); the blocker can still open the blocked
        person's profile, with `blockedByMe` true.
      tags: [profile]
      parameters:
        - name: userId
          in: path
          required: true
          description: |
            The user's ID, a UUID. It is declared as a plain string so that the login check
            runs before it is read (FR-3.1); a value that is not a UUID names no user and
            gets 404 `not_found`.
          schema:
            type: string
      responses:
        "200":
          description: The user's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/interests:
    post:
      operationId: addMyInterest
      summary: Add a research interest to the logged-in user's profile (FR-4.2)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). The name is normalized (see AddTagRequest) and matched
        ignoring letter case: an existing tag is reused with its first spelling, otherwise
        a new tag is created. A user has at most 20 interests.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTagRequest"
      responses:
        "201":
          description: The tag is now on the user's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "200":
          description: The user already had the tag; nothing changed. The body is the same as for 201.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: |
            The name is empty or longer than 60 characters after normalizing
            (`invalid_tag_name`), or the body is not JSON (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The user already has 20 interests (`tag_limit_reached`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

