          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /tags/skills:
    get:
      operationId: suggestSkillTags
      summary: Suggest existing skill tags while the user types (FR-4.3)
      description: |
        Needs the access cookie and the platform action "View profiles, search, feed,
        events and recommendations" (SRS 2.3). Matching ignores letter case. Names that
        start with `q` come first, then names that contain it elsewhere; within each group
        tags used by more users come first, then by name. `q` is normalized like a tag name;
        an empty `q` gives an empty list.
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/TagQuery"
        - $ref: "#/components/parameters/TagLimit"
      responses:
        "200":
          description: Matching tags, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSuggestions"
        "400":
          description: "`limit` is not a whole number of at least 1 (`bad_request`)."
