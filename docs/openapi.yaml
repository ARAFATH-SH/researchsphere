  responses:
    InvalidMessage:
      description: |
        `cannot_message_self`, `invalid_body` (empty after trimming, over 5,000 characters,
        or holding a NUL character), or `bad_request` for a body that is not JSON or a
        missing or malformed `userId` or `clientId`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ModerationInvalid:
      description: |
        `reason`, `note`, `days`, `until`, `kind` or `reportId` is not valid (`bad_request`, with
        `field`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ModerationForbidden:
      description: |
        `forbidden`: the user's role does not permit the action (FR-3.2).
        `cannot_moderate_admin`: the target is an administrator, the caller included (FR-15.10).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ModerationConflict:
      description: |
        `already_restricted`, `already_suspended`, `not_suspended`, `restriction_not_active`, or
        `report_already_resolved`. Nothing is changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountSuspendedOrForbidden:
      description: |
        `forbidden`: the user's role does not permit the action (FR-3.2).
        `account_suspended`: the caller's account was suspended after this session began, with
        `reason` and `until`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MessageForbidden:
      description: |
        `forbidden`: the user's role does not permit the action (FR-3.2).
        `cannot_message`: this person cannot be messaged. It does not say why (FR-16.9).
        `account_suspended`: the caller's account was suspended after this session began, with
        `reason` and `until`. `messaging_restricted`: the caller may not send messages until
        `until` (FR-15.6).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MessageRefused:
      description: |
        `request_pending`: the receiver has not accepted the request yet.
        `conversation_closed`: the request was declined.
        `you_blocked_this_user`: the caller has blocked the other user (FR-16.9).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MessageEditRefused:
      description: |
        `edit_window_closed`: the message is older than the edit window (FR-16.5).
        `request_pending`: the receiver has not accepted the request yet.
        `conversation_closed`: the request was declined.
        `you_blocked_this_user`: the caller has blocked the other user (FR-16.9).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MessageRateLimited:
      description: |
        The user has sent too many messages or message requests (`rate_limited`). The
        defaults are 30 messages a minute and 1,000 a day, and 5 new requests a minute and
        20 a day (FR-16.10). An edit counts as a message.
      headers:
        Retry-After:
          description: Seconds until sending is accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidConnectionPage:
      description: "`page` is not a whole number of at least 1 (`bad_request`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The user's role does not permit the action (FR-3.2). The body is always
        `{"code":"forbidden","message":"You do not have permission to do this."}`, with no
        resource data and no reason (FR-3.3).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such route or resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidEducation:
      description: |
        A field is not valid. The code names the first invalid field, in this order:
        `invalid_institution`, `invalid_degree`, `invalid_field_of_study`,
        `invalid_start_year`, `invalid_end_year` (also when `endYear` is before
        `startYear`), `invalid_grade`, `invalid_description`. A body that is not JSON gets
        `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidExperience:
      description: |
        A field is not valid. The code names the first invalid field, in this order:
        `invalid_title`, `invalid_organization`, `invalid_employment_type`,
        `invalid_location`, `invalid_location_type`, `invalid_start_date` (also a future
        month or one before 1950), `invalid_end_date`, `invalid_is_current` (a PATCH that
        sets `isCurrent` to null), `end_date_required` (`isCurrent` false without
        `endDate`), `end_date_not_allowed` (`isCurrent` true with `endDate`),
        `invalid_date_range` (`endDate` before `startDate`), `invalid_description`. A body
        that is not JSON gets `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidPublication:
      description: |
        A field is not valid. The code names the first invalid field, in this order:
        `invalid_title`, `invalid_year` (also before 1900 or after next year),
        `invalid_venue`, `invalid_abstract`, `invalid_url` (also a link that is not http or
        https), `invalid_doi` (also a value that is not of the form `10.NNNN/...` after the
        prefix is removed). A body that is not JSON gets `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidLanguage:
      description: |
        A field is not valid. The code names the first invalid field, in this order:
        `invalid_language_name` (missing, empty after trimming, longer than 50 characters
        or more than one line), `invalid_proficiency`. A body that is not JSON gets
        `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProfileImageStored:
      description: The image is stored and the profile shows it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileImage"
    InvalidImage:
      description: |
        The image is over 8000 pixels wide or high (`image_too_large`), its type matches
        but it cannot be read (`invalid_image`), or the body is not multipart with a part
        named `file` (`bad_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoProfile:
      description: The account has no profile row yet (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FileTooLarge:
      description: The file is over the size limit (`file_too_large`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedImageType:
      description: The file is not a JPEG, PNG or still WebP image (`unsupported_type`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UploadRateLimited:
      description: The user has uploaded 5 images in the current hour (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until the hour ends and uploads are accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidDOI:
      description: |
        The DOI is missing or not of the form `10.NNNN/...` after the prefix is removed
        (`invalid_doi`). A body that is not JSON gets `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DOINotFound:
      description: OpenAlex has no work with this DOI, or none with a title (`doi_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MetadataUnavailable:
      description: |
        OpenAlex did not answer in time, failed or refused the request (FR-5.6). The body is
        `{"code":"metadata_unavailable","message":"We couldn't reach the publication
        database. You can add this publication by hand."}`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LookupRateLimited:
      description: The user has made 30 lookups that reached OpenAlex in the current hour (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until the hour ends and lookups are accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrcidNotSet:
      description: The caller's profile has no ORCID iD (`orcid_not_set`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrcidNotFound:
      description: ORCID has no record with the iD on the profile (`orcid_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrcidUnavailable:
      description: |
        ORCID did not answer in time, failed or refused the request (FR-5.6). The body is
        `{"code":"metadata_unavailable","message":"We couldn't reach ORCID. You can still
        add publications by DOI or by hand."}`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrcidRateLimited:
      description: The user has made 10 calls that reached ORCID in the current hour (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until the hour ends and calls are accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SearchRateLimited:
      description: The user has searched 60 times in the current minute (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until the minute ends and searches are accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: An unexpected error on the server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
