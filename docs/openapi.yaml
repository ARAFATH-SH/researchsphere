          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Education"
        "400":
          $ref: "#/components/responses/InvalidEducation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The user has no education entry with this ID (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeMyEducation
      summary: Remove one of the logged-in user's education entries (FR-4.4)
      description: |
        Needs the access cookie and the platform action "Edit own profile, connect, post,
        like, comment" (SRS 2.3). An entry that does not exist and one that belongs to
        someone else both get 404 `not_found`.
      tags: [profile]
      parameters:
        - $ref: "#/components/parameters/EducationID"
      responses:
        "204":
          description: The entry is removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The user has no education entry with this ID (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/me/experience:
    post:
      operationId: addMyExperience
      summary: Add a work experience entry to the logged-in user's profile (FR-4.8)
      description: |
