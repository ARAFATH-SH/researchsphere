      required: [code, message, projects]
      properties:
        code:
          type: string
          example: owns_shared_project
        message:
          type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRef"

    ProjectRef:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          example: ada@example.org
        password:
          type: string
          maxLength: 128
          format: password

    CurrentUser:
      type: object
      required: [id, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    Me:
      description: The logged-in user as `GET /auth/me` returns it.
      allOf:
        - $ref: "#/components/schemas/CurrentUser"
        - type: object
          required: [messagingRestrictedUntil]
          properties:
            messagingRestrictedUntil:
              type: string
              format: date-time
              nullable: true
              description: |
                When the user's messaging restriction ends (FR-15.6); null when there is none,
                also once it has ended or been lifted.

    Role:
      type: string
      description: |
        The platform role (SRS 2.2). Administrators are made only from the command line
        (`make admin`); no operation changes a role.
      enum: [researcher, admin]

    AdminUser:
      type: object
      description: One user account as an administrator sees it.
      required: [id, fullName, email, role, verified, suspended, suspensionReason, suspendedUntil, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        verified:
          type: boolean
          description: The email address is verified (FR-1.4).
        suspended:
          type: boolean
          description: |
            The account is suspended now (FR-3.4). A suspension that has ended by time reads
            false, also before the user's next login clears it.
        suspensionReason:
          type: string
          nullable: true
          description: |
            What the user was told. Null unless `suspended` is true, and for an account
            suspended before reasons were recorded.
        suspendedUntil:
          type: string
          format: date-time
          nullable: true
          description: When a temporary suspension ends. Null unless `suspended` is true, and when it is permanent.
        createdAt:
          type: string
          format: date-time

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        page:
          type: integer
        pageSize:
          type: integer
          description: The page size used, at most 50.
        total:
          type: integer
          description: The number of users on all pages.

    EmbeddingStats:
      type: object
      required: [model, ownerTypes]
      properties:
        model:
          type: string
          nullable: true
          description: The AI service's model as `name@revision`; null when it does not answer.
          example: intfloat/multilingual-e5-base@d128750597153bb5987e10b1c3493a34e5a4502a
        ownerTypes:
          type: array
          items:
            $ref: "#/components/schemas/EmbeddingOwnerStats"

    EmbeddingOwnerStats:
      type: object
      required: [ownerType, total, currentModel, queued, failed]
      properties:
        ownerType:
          type: string
          description: What the embeddings belong to. A later slice adds post.
          enum: [profile, project, venue]
        total:
          type: integer
          description: Stored embeddings.
        currentModel:
          type: integer
          description: Of them, those the current model made; 0 when the model is unknown.
        queued:
          type: integer
          description: Owners waiting to be embedded, failed ones not counted.
        failed:
          type: integer
          description: Owners whose text failed 5 times; they wait for their next change or a rebuild.

    EmbeddingRebuild:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer
          description: How many owners were queued.

    Profile:
      type: object
      description: |
        A researcher's profile (FR-4.1, FR-4.2, FR-4.4, FR-4.5, FR-4.6, FR-4.7, FR-5.5, FR-7). The optional text fields are
        always present and null when not set.
      required:
        - userId
        - fullName
        - headline
        - bio
        - institution
        - department
        - jobTitle
        - country
        - city
        - orcidId
        - interests
        - skills
        - education
        - experience
        - languages
        - publicationCount
        - connectionStatus
        - connectionRequestId
        - connectionCount
        - conversation
        - contact
        - photoUrl
        - coverUrl
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
          description: Empty only for an account that has no profile row yet.
        headline:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        jobTitle:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 code in capitals, such as DE.
          example: DE
        city:
          type: string
          nullable: true
          example: Cambridge
        orcidId:
          type: string
          nullable: true
          description: |
            The user's ORCID iD (FR-5.3), a public identifier shown to every viewer; set
            with `setMyOrcidId`.
          example: 0000-0002-1825-0097
        interests:
          type: array
          description: The user's research interests (FR-4.2), sorted by name ignoring letter case.
          items:
            $ref: "#/components/schemas/Tag"
        skills:
          type: array
          description: The user's skills (FR-4.2), sorted by name ignoring letter case.
          items:
            $ref: "#/components/schemas/Tag"
        education:
          type: array
          description: |
            The user's education entries (FR-4.4): current entries (no `endYear`) first,
            then by `endYear`, latest first, then by `startYear`, latest first.
          items:
            $ref: "#/components/schemas/Education"
        experience:
          type: array
          description: |
            The user's work experience (FR-4.8): current roles first, then by `startDate`,
            latest first, then oldest entry first.
          items:
            $ref: "#/components/schemas/Experience"
        languages:
          type: array
          description: |
            The languages the user knows (FR-4.9): highest proficiency first
            (`native_or_bilingual` first), then oldest entry first.
          items:
            $ref: "#/components/schemas/Language"
        publicationCount:
          type: integer
          description: |
            How many publications the user has confirmed (FR-5.5). The list itself comes
            from `listPublications`.
        connectionStatus:
          $ref: "#/components/schemas/ConnectionStatus"
        connectionRequestId:
          type: string
          format: uuid
          nullable: true
          description: |
            The pending request between the caller and the profile's owner when
            `connectionStatus` is `pending_sent` (the caller may cancel it) or
            `pending_received` (the caller may accept or reject it); null otherwise.
        connectionCount:
          type: integer
          description: |
            How many connections the user has (FR-7.4), counting only verified accounts
            that are not suspended, and leaving out people who blocked the viewer; the
            `total` of `listProfileConnections`.
        blockedByMe:
          type: boolean
          description: |
            True when the viewer has blocked this user (FR-16.9), so the client can offer
            Unblock instead of Connect and Message. Sent on every profile.
        conversation:
          nullable: true
          description: |
            The viewer's direct conversation with this user, so the client can open it or
            say why it cannot be used (FR-16.1, FR-16.2). Null when they have none and on
            the caller's own profile.
          allOf:
            - $ref: "#/components/schemas/ProfileConversation"
        contact:
          $ref: "#/components/schemas/PublicContact"
        photoUrl:
          type: string
          nullable: true
          description: The profile photo (FR-4.6) as `/api/v1/media/{fileId}`; null when not set.
          example: /api/v1/media/3f1c2b9e-8a41-4d7e-9c55-2f6a1b0e7d10
        coverUrl:
          type: string
          nullable: true
          description: The cover image (FR-4.6) as `/api/v1/media/{fileId}`; null when not set.

    ProfileConversation:
      type: object
      description: The viewer's conversation with a profile's owner.
      required: [id, state, requestedBy, canMessage]
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/ConversationState"
        requestedBy:
          type: string
          format: uuid
          nullable: true
          description: Who sent the request; null when the conversation never was one.
        canMessage:
          type: boolean
          description: As on `Conversation`, a message from the viewer would be accepted now.

    ProfileImage:
      type: object
      description: A stored profile photo or cover image (FR-4.6).
      required: [url]
      properties:
        url:
          type: string
          description: Where the image is read, `/api/v1/media/{fileId}`.
          example: /api/v1/media/3f1c2b9e-8a41-4d7e-9c55-2f6a1b0e7d10

    Tag:
      type: object
      description: |
        A research interest or skill (FR-4.2). Tags are shared by all users; names that
        differ only in letter case are the same tag, and the name keeps the spelling it was
        first created with.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Machine Learning

    AddTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            Trimmed, and every run of spaces, tabs or line breaks becomes one space; then 1 to
            60 characters.
          maxLength: 60
          example: Machine Learning

    TagSuggestions:
      type: object
      description: Existing tags that match the typed text (FR-4.3), best match first.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    ConnectionRequestCreate:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          description: |
            The receiver's ID, a UUID. A value that is not a UUID names no user and gets
            404 `not_found`.

    ConnectionRequest:
      type: object
      description: |
        A pending connection request (FR-7.4). The person fields describe the other user:
        the sender in the received list, the receiver in the sent list.
      required: [requestId, createdAt, userId, fullName, headline, institution, photoUrl]
      properties:
        requestId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        headline:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
          description: The other user's profile photo as `/api/v1/media/{fileId}`; null when not set.

    Connection:
      type: object
      description: |
        A connection (FR-7.4). The person fields describe the other user of the
        connection; `connectionStatus` and `connectionRequestId` are the caller's own link
        with that user, which on another user's list may be anything, `self` included.
      required: [connectedAt, userId, fullName, headline, institution, photoUrl, connectionStatus, connectionRequestId]
      properties:
        connectedAt:
          type: string
          format: date-time
          description: When the request was accepted.
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        headline:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
          description: The other user's profile photo as `/api/v1/media/{fileId}`; null when not set.
        connectionStatus:
          $ref: "#/components/schemas/ConnectionStatus"
        connectionRequestId:
          type: string
          format: uuid
          nullable: true
          description: |
            The pending request between the caller and this user when `connectionStatus`
            is `pending_sent` or `pending_received`; null otherwise.

    ConnectionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        page:
          type: integer
        pageSize:
          type: integer
          description: Always 20.
        total:
          type: integer
          description: The number of connections on all pages.

    ConnectionRequestPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionRequest"
        page:
          type: integer
        pageSize:
          type: integer
          description: Always 20.
        total:
          type: integer
          description: The number of requests on all pages.

    ConnectionConflict:
      type: object
      description: |
        The Error shape of a refused connection request (FR-7.2), with the pending
        request's ID when the other user sent it.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [request_already_pending, request_pending_from_them, already_connected, you_blocked_this_user]
        message:
          type: string
        requestId:
          type: string
          format: uuid
          description: Only with `request_pending_from_them`.

    ConnectionStatus:
      type: string
      description: |
        The connection between the caller and another user (FR-4.5, FR-7), the owner of
        a profile or the person of a search result or connections list item: `none`,
        `pending_sent` (the caller sent a request that is still pending),
        `pending_received` (the other user sent the caller one), `connected`, or `self`
        when the other user is the caller. A rejected request reads as `none` to both
        sides (FR-7.6).
      enum: [none, pending_sent, pending_received, connected, self]

    WarnUserRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: "#/components/schemas/ModerationReason"
        note:
          $ref: "#/components/schemas/ModerationNote"
        reportId:
          $ref: "#/components/schemas/ModerationReportId"

    RestrictUserRequest:
      type: object
      required: [kind, days, reason]
      properties:
        kind:
          type: string
          enum: [messaging]
        days:
          type: integer
          minimum: 1
          maximum: 90
        reason:
          $ref: "#/components/schemas/ModerationReason"
        note:
          $ref: "#/components/schemas/ModerationNote"
        reportId:
          $ref: "#/components/schemas/ModerationReportId"

    SuspendUserRequest:
      type: object
      required: [reason]
      properties:
        until:
          type: string
          format: date-time
          description: |
            When the suspension ends: 1 to 365 days from now, with 5 minutes of slack at each
            end for the time the request takes. Left out, the suspension is permanent.
        reason:
          $ref: "#/components/schemas/ModerationReason"
        note:
          $ref: "#/components/schemas/ModerationNote"
        reportId:
          $ref: "#/components/schemas/ModerationReportId"

    ReverseActionRequest:
      type: object
      description: Lifting and restoring reverse an action, so they name no report.
      required: [reason]
      properties:
        reason:
          $ref: "#/components/schemas/ModerationReason"
        note:
          $ref: "#/components/schemas/ModerationNote"

    ModerationReason:
      type: string
      minLength: 10
      maxLength: 1000
      description: What the user is told, by email and in the app. 10 to 1000 characters, trimmed.

    ModerationNote:
      type: string
      maxLength: 1000
      description: For administrators only. It is never shown or sent to the user.

    ModerationReportId:
      type: string
      description: |
        A report about this user to resolve as `action_taken`. For a group, this user may also be
        anyone in the report's `membersAtReport`, which is how a report of a whole group, with no
        reported user, is acted on (FR-16.6). Unknown gets 404, about someone else 400 with
        `field`, already resolved 409 `report_already_resolved`; each undoes the action.

    ModerationActionKind:
      type: string
      enum: [warning, restriction, restriction_lifted, suspension, restoration]

    ModerationLinkedReport:
      type: object
      nullable: true
      description: The report the action resolved. Null when none, or when it has since been deleted.
      required: [id, reason, outcome, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reason:
          $ref: "#/components/schemas/ReportReason"
        outcome:
          type: string
          enum: [dismissed, action_taken]
        createdAt:
          type: string
          format: date-time

    ModerationAction:
      type: object
      description: One row of the audit trail, as only an administrator sees it.
      required: [id, userId, action, reason, note, adminId, adminName, reportId, report, warningId, restrictionId, endsAt, acknowledgedAt, liftedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/ModerationActionKind"
        reason:
          type: string
        note:
          type: string
          nullable: true
        adminId:
          type: string
          format: uuid
          nullable: true
          description: Null once the administrator's account is deleted.
        adminName:
          type: string
          nullable: true
        reportId:
          type: string
          format: uuid
          nullable: true
        report:
          $ref: "#/components/schemas/ModerationLinkedReport"
        warningId:
          type: string
          format: uuid
          nullable: true
        restrictionId:
          type: string
          format: uuid
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: When a restriction or a temporary suspension ends. Null when permanent.
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
          description: When the user acknowledged a warning.
        liftedAt:
          type: string
          format: date-time
          nullable: true
          description: When a restriction was lifted early.
        createdAt:
          type: string
          format: date-time

    ModerationHistory:
      type: object
      required: [user, items, page, pageSize, total]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModerationAction"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    AccountWarning:
      type: object
      description: A warning as its user sees it. It holds no note and names no administrator.
      required: [id, reason, createdAt, acknowledged, acknowledgedAt]
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
        acknowledged:
          type: boolean
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
          description: When the user first acknowledged it; null until then.

    AccountWarningList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountWarning"

    NotificationType:
      type: string
      description: |
        What happened (FR-9.1). `connection_request_received`: the actor sent the caller a
        connection request. `connection_request_accepted`: the actor accepted the caller's
        request. `account_warning`: an administrator warned the caller; a system notification,
        with no actor. `group_added`: the actor, the group's owner, added the caller to a
        group (FR-16.6). `attachment_blocked`: the malware scan found something in a file the
        caller attached, and it was deleted (FR-16.7); a system notification, with no actor.
        The project types (FR-9.2, FR-11, FR-10.5) all have the project as their `subject`:
        `project_join_request`: the actor asked to join the caller's project.
        `project_join_request_accepted` / `project_join_request_rejected`: the actor, the
        owner, decided the caller's request. `project_invitation`: the actor, the owner,
        invited the caller. `project_invitation_accepted` / `project_invitation_rejected`: the
        actor answered the caller's invitation. `project_member_role_changed`: the actor, the
        owner, changed the caller's role. `project_member_removed`: the actor, the owner,
        removed the caller. `project_ownership_transferred`: the actor made the caller the
        owner. Later slices add the comment and like types.
      enum:
        - connection_request_received
        - connection_request_accepted
        - account_warning
        - group_added
        - attachment_blocked
        - project_join_request
        - project_join_request_accepted
        - project_join_request_rejected
        - project_invitation
        - project_invitation_accepted
        - project_invitation_rejected
        - project_member_role_changed
        - project_member_removed
        - project_ownership_transferred

    NotificationActor:
      type: object
      description: |
        The user who caused the notification. A system notification comes from ResearchSphere
        and has no actor: the field is left out, and a client treats null the same way.
      nullable: true
      required: [userId, fullName, photoUrl]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        photoUrl:
          type: string
          nullable: true
          description: The actor's profile photo as `/api/v1/media/{fileId}`; null when not set.

    Notification:
      type: object
      required: [id, type, createdAt, read, link]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
        link:
          type: string
          description: |
            The web client path of the item it is about (FR-9.5):
            `/network` for a received request, `/profile/{actorId}` for an accepted one,
            `/warnings/{warningId}` for a warning, `/messaging/{conversationId}` for a group
            and for a blocked attachment, `/projects/{projectId}` for every project type.
        actor:
          $ref: "#/components/schemas/NotificationActor"
        subject:
          $ref: "#/components/schemas/NotificationSubject"
        requestId:
          type: string
          format: uuid
          description: Only for `connection_request_received`, the connection request.
        requestPending:
          type: boolean
          description: |
            Only for `connection_request_received`: true while the request is still
            pending, so the client can offer Accept and Ignore.

    NotificationSubject:
      type: object
      required: [type, id, title]
      description: |
        The item a notification is about, as it is now, for types whose sentence names it
        (`group_added`: the group, with its current name; every project type: the project,
        with its current title). Read when the notification is listed or sent, so a rename
        shows. Left out for the other types, and when the item no longer exists or the
        recipient cannot see it (they left the group, or the project is archived and they are
        not a member); the client then uses a sentence without the title ("added you to a
        group").
      properties:
        type:
          type: string
          enum: [conversation, project]
        id:
          type: string
          format: uuid
        title:
          type: string

    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page; null on the last page.

    SendDirectMessageRequest:
      type: object
      required: [userId, body, clientId]
      properties:
        userId:
          type: string
          format: uuid
          description: The receiver.
        body:
          type: string
          description: 1 to 5,000 characters after trimming; line breaks are kept.
        clientId:
          type: string
          format: uuid
          description: Made by the client for each new message and sent again on a retry, so a retry stores nothing new.

    SendMessageRequest:
      type: object
      required: [clientId]
      properties:
        body:
          type: string
          description: |
            1 to 5,000 characters after trimming; line breaks are kept. May be left out when
            `attachmentIds` is not empty.
        clientId:
          type: string
          format: uuid
          description: Made by the client for each new message and sent again on a retry, so a retry stores nothing new.
        attachmentIds:
          type: array
          maxItems: 5
          description: Files from `uploadAttachment` to send with the message, in order (FR-16.7).
          items:
            type: string
            format: uuid

    EditMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: 1 to 5,000 characters after trimming; line breaks are kept.

    MarkConversationReadRequest:
      type: object
      required: [messageId]
      properties:
        messageId:
          type: string
          format: uuid
          description: The latest message the caller has read.

    ConversationState:
      type: string
      description: |
        `active`: both members can send. `request`: waiting for the receiver to accept.
        `declined`: closed for good.
      enum: [active, request, declined]

    MessageKind:
      type: string
      description: |
        `text`: a member's message. `system`: a change to a group (FR-16.6), described by
        `event`; it has no body, cannot be edited, deleted or reported, and never counts as
        unread.
      enum: [text, system]

    SystemEventType:
      type: string
      description: |
        What changed in a group. The client writes its own text for each; the API sends no
        English copy. `group_created` (`newName`, `userIds` the first members),
        `group_renamed` (`oldName`, `newName`), `member_added` (`userIds`), `member_removed`
        (`userIds`, the one removed), `member_left` (the actor left), `owner_changed`
        (`userIds`, the new owner; no actor, as it follows from someone leaving).
      enum: [group_created, group_renamed, member_added, member_removed, member_left, owner_changed]

    SystemEvent:
      type: object
      required: [type, actorId, userIds, oldName, newName]
      properties:
        type:
          $ref: "#/components/schemas/SystemEventType"
        actorId:
          type: string
          format: uuid
          nullable: true
          description: Who made the change; null for `owner_changed`, and when the actor's account is gone.
        userIds:
          type: array
          description: The users the change is about; empty when none.
          items:
            type: string
            format: uuid
        oldName:
          type: string
          nullable: true
        newName:
          type: string
          nullable: true

    AttachmentStatus:
      type: string
      description: |
        The malware scan (FR-16.7). `pending`: not scanned yet; nobody can download it.
        `clean`: it can be downloaded. `infected`: malware was found and the file deleted.
        `failed`: the scanner could not read the file; it will not be served.
      enum: [pending, clean, infected, failed]

    Attachment:
      type: object
      required: [id, name, size, contentType, status]
      properties:
        id:
          type: string
          format: uuid
          description: Download it with `GET /attachments/{id}`.
        name:
          type: string
          description: The file's name for display, cleaned up; at most 200 characters.
        size:
          type: integer
          format: int64
          description: Bytes as stored (an image after it was encoded again).
        contentType:
          type: string
          description: The type found from the content, one of the allowed types.
        status:
          $ref: "#/components/schemas/AttachmentStatus"

    AttachmentUpload:
      type: object
      required: [id, name, size, contentType, status, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        size:
          type: integer
          format: int64
        contentType:
          type: string
        status:
          $ref: "#/components/schemas/AttachmentStatus"
        expiresAt:
          type: string
          format: date-time
          description: The attachment is deleted when it has not been sent by then.

    Message:
      type: object
      required: [id, conversationId, senderId, kind, event, body, createdAt, editedAt, deleted, attachments]
      properties:
        id:
          type: string
          format: uuid
          description: A UUIDv7; within a conversation, a later message has a greater ID.
        conversationId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
          nullable: true
          description: The sender; for a system message the actor, or null when it has none.
        kind:
          $ref: "#/components/schemas/MessageKind"
        event:
          nullable: true
          description: The change a system message describes; null for a text message.
          allOf:
            - $ref: "#/components/schemas/SystemEvent"
        body:
          type: string
          nullable: true
          description: |
            The latest text. Null for a deleted message and for a system message; only
            `deleted` says a message was deleted, as a later message may have no text.
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true
          description: When the text was last edited; null when never (FR-16.5).
        deleted:
          type: boolean
          description: True when the sender deleted the message. It stays in its place, with no body.
        attachments:
          type: array
          description: The message's files in order (FR-16.7); empty when none and for a deleted message.
          items:
            $ref: "#/components/schemas/Attachment"

    SentMessage:
      type: object
      required: [message, conversationState]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        conversationState:
          $ref: "#/components/schemas/ConversationState"

    ConversationMember:
      type: object
      description: The other member of a direct conversation.
      required: [userId, fullName, photoUrl, headline, available]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        photoUrl:
          type: string
          nullable: true
          description: The member's profile photo as `/api/v1/media/{fileId}`; null when not set.
        headline:
          type: string
          nullable: true
        available:
          type: boolean
          description: False when the member is suspended or not verified; the conversation is then read-only.

    MessagePreview:
      type: object
      required: [senderId, senderName, kind, event, body, createdAt, deleted, attachmentCount]
      properties:
        senderId:
          type: string
          format: uuid
          nullable: true
          description: The sender; for a system message the actor, or null when it has none.
        senderName:
          type: string
          nullable: true
          description: |
            The sender's (or actor's) full name, so a group's row can say "Nafisa: …" (FR-16.6).
            Always given, as with `MessagePage.people`, whatever the sender's standing; null when
            there is no sender.
        kind:
          $ref: "#/components/schemas/MessageKind"
        event:
          nullable: true
          description: For a system message, what changed; the client writes its own text.
          allOf:
            - $ref: "#/components/schemas/SystemEventType"
        body:
          type: string
          nullable: true
          description: The first 120 characters of the message's latest text; null when deleted and for a system message.
        deleted:
          type: boolean
          description: True when the latest message was deleted; the client says so.
        attachmentCount:
          type: integer
          description: How many files the latest message carries; 0 when deleted. A message may have files and no text.
        createdAt:
          type: string
          format: date-time

    ConversationKind:
      type: string
      description: "`direct`: two people. `group`: a named group of up to 50 members (FR-16.6)."
      enum: [direct, group]

    GroupRole:
      type: string
      description: "`owner` renames the group and adds and removes members; `member` does not."
      enum: [owner, member]

    GroupAvatar:
      type: object
      required: [userId, fullName, photoUrl]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        photoUrl:
          type: string
          nullable: true
          description: The profile photo as `/api/v1/media/{fileId}`; null when not set.

    GroupMember:
      type: object
      required: [userId, fullName, photoUrl, role, joinedAt, available]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        photoUrl:
          type: string
          nullable: true
          description: The profile photo as `/api/v1/media/{fileId}`; null when not set.
        role:
          $ref: "#/components/schemas/GroupRole"
        joinedAt:
          type: string
          format: date-time
        available:
          type: boolean
          description: False when the member is suspended or not verified. They stay in the group.

    ConversationGroup:
      type: object
      required: [name, memberCount, avatars, myRole, members]
      properties:
        name:
          type: string
        memberCount:
          type: integer
          description: Current members, the caller included.
        avatars:
          type: array
          description: Up to 3 other members, those who joined earliest first.
          items:
            $ref: "#/components/schemas/GroupAvatar"
        myRole:
          $ref: "#/components/schemas/GroupRole"
        members:
          type: array
          nullable: true
          description: |
            Every current member, the owner first, then by joining time. Given by
            `getConversation` and the group operations; null in the lists.
          items:
            $ref: "#/components/schemas/GroupMember"

    Conversation:
      type: object
      required: [id, kind, state, otherMember, group, lastMessage, unreadCount, requestedBy, lastMessageAt, canMessage, blockedByMe]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ConversationKind"
        state:
          $ref: "#/components/schemas/ConversationState"
        otherMember:
          nullable: true
          description: The other member of a direct conversation; null for a group.
          allOf:
            - $ref: "#/components/schemas/ConversationMember"
        group:
          nullable: true
          description: The group's name and members; null for a direct conversation.
          allOf:
            - $ref: "#/components/schemas/ConversationGroup"
        lastMessage:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MessagePreview"
        unreadCount:
          type: integer
          description: |
            Messages from other members after the caller's read marker, not deleted. System
            messages never count.
        requestedBy:
          type: string
          format: uuid
          nullable: true
          description: Who sent the request; null when the conversation never was one.
        lastMessageAt:
          type: string
          format: date-time
        canMessage:
          type: boolean
          description: |
            True when a message from the caller would be accepted now: the conversation is
            `active`, the other member is available and neither has blocked the other
            (FR-16.9). In a group, true while the caller is a member; blocks do not apply.
        blockedByMe:
          type: boolean
          description: |
            True when the caller has blocked the other member. A blocked person is never told.
            Always false for a group.

    ConversationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page; null on the last page.

    MessagePage:
      type: object
      required: [items, nextBefore, nextAfter, otherLastReadMessageId, readers, people]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextBefore:
          type: string
          nullable: true
          description: Pass as `before` to get older messages; null on the last page.
        nextAfter:
          type: string
          nullable: true
          description: |
            Pass as `after` to get newer messages; null when the page reaches the newest
            message, and always null for a page asked without `after` or `around`.
        people:
          $ref: "#/components/schemas/MessagePeople"
        otherLastReadMessageId:
          type: string
          format: uuid
          nullable: true
          description: The other member's read marker; null until they have read a message, and for a group.
        readers:
          type: array
          nullable: true
          description: |
            For a group, every other current member's read marker (FR-16.3), so the client can
            show "Seen by N" under a message; null for a direct conversation.
          items:
            $ref: "#/components/schemas/MessageReader"

    MessagePeople:
      type: object
      description: |
        The people a page names, by user ID: every sender and every user (and actor) a system
        message names, also those who have left the group (FR-16.6). Only people who were ever
        in the conversation appear. A user whose account was deleted is absent; the client
        shows "Deleted account".
      additionalProperties:
        $ref: "#/components/schemas/MessagePerson"

    MessagePerson:
      type: object
      required: [fullName, photoUrl, available]
      properties:
        fullName:
          type: string
          description: Always given, as the members already saw it in the conversation.
        photoUrl:
          type: string
          nullable: true
          description: |
            Null without a photo, and when `available` is false.
        available:
          type: boolean
          description: |
            False when the profile cannot be viewed: the person is suspended or not verified,
            or has blocked the caller. The client then shows initials and no profile link.

    MessageReader:
      type: object
      required: [userId, lastReadMessageId]
      properties:
        userId:
          type: string
          format: uuid
        lastReadMessageId:
          type: string
          format: uuid
          nullable: true
          description: Null until the member has read a message.

    CreateGroupRequest:
      type: object
      required: [name, memberIds, clientId]
      properties:
        name:
          type: string
          description: 1 to 100 characters after trimming, on one line.
        memberIds:
          type: array
          description: 1 to 49 other users; the caller is the owner and is not listed.
          items:
            type: string
            format: uuid
        clientId:
          type: string
          format: uuid
          description: Made by the client for this create; a retry with the same value creates nothing new.

    RenameGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 100 characters after trimming, on one line.

    AddGroupMembersRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          description: 1 to 49 users, not the caller.
          items:
            type: string
            format: uuid

    BlockRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          description: The user to block.

    BlockedPerson:
      type: object
      required: [userId, fullName, photoUrl, headline, blockedAt]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        photoUrl:
          type: string
          nullable: true
          description: The profile photo as `/api/v1/media/{fileId}`; null when not set.
        headline:
          type: string
          nullable: true
        blockedAt:
          type: string
          format: date-time

    BlockedPersonPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BlockedPerson"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: Blocked people on all pages.

    ReportReason:
      type: string
      enum: [spam, harassment, inappropriate, other]

    ReportConversationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: "#/components/schemas/ReportReason"
        details:
          type: string
          description: At most 1,000 characters after trimming; empty means none.
          maxLength: 1000
        messageId:
          type: string
          format: uuid
          description: The message being reported, when it is one message. It must be in this conversation and not the caller's.

    ConversationReportReceipt:
      type: object
      required: [id, createdAt, reportedUserId, blockedByMe]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        reportedUserId:
          type: string
          format: uuid
          nullable: true
          description: |
            The other member, or in a group the sender of the reported message, whom the client
            can offer to block. Null for a report of a whole group.
        blockedByMe:
          type: boolean
          description: Whether the caller has blocked that user. Reporting never does it. False when no one is reported.

    MessageReportPerson:
      type: object
      required: [userId, fullName, photoUrl, headline, role]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        photoUrl:
          type: string
          nullable: true
          description: The profile photo as `/api/v1/media/{fileId}`; null when not set.
        headline:
          type: string
          nullable: true

    MessageReport:
      type: object
      required: [id, conversationId, conversationKind, groupName, status, reason, details, messageId, reporter, reportedUser, createdAt, outcome, note, resolvedAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        conversationKind:
          $ref: "#/components/schemas/ConversationKind"
        groupName:
          type: string
          nullable: true
          description: The group's name now; null for a direct conversation.
        status:
          type: string
          enum: [open, resolved]
        reason:
          $ref: "#/components/schemas/ReportReason"
        details:
          type: string
          nullable: true
          description: The reporter's own words.
        messageId:
          type: string
          format: uuid
          nullable: true
          description: The reported message; null when the whole conversation was reported.
        reporter:
          $ref: "#/components/schemas/MessageReportPerson"
        reportedUser:
          nullable: true
          description: |
            The other member, or in a group the sender of the reported message. Null for a
            report of a whole group: a moderation action may then name any member who was in
            the group at the report's moment (`membersAtReport`).
          allOf:
            - $ref: "#/components/schemas/MessageReportPerson"
        createdAt:
          type: string
          format: date-time
          description: The moment of the report; an administrator sees messages only up to it.
        outcome:
          type: string
          nullable: true
          enum: [dismissed, action_taken]
        note:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    MessageReportPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MessageReport"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: Reports with this status on all pages.

    MessageReportDetail:
      type: object
      required: [report, membersAtReport, messages, nextBefore]
      properties:
        report:
          $ref: "#/components/schemas/MessageReport"
        membersAtReport:
          type: array
          nullable: true
          description: |
            For a group, everyone who was a member at the report's moment, also those who have
            left since; a moderation action that names this report may name any of them. Null
            for a direct conversation.
          items:
            $ref: "#/components/schemas/MessageReportPerson"
        messages:
          type: array
          description: Newest first, none later than the report.
          items:
            $ref: "#/components/schemas/ReportedMessage"
        nextBefore:
          type: string
          nullable: true
          description: Pass as `before` to load earlier messages; null on the last page.

    ReportedMessage:
      type: object
      description: |
        A message of a reported conversation as the administrator sees it (NFR-13): the text
        at the report's moment and the texts shown before it. Text written after the report is
        never shown; `changedAfterReport` only says there was some.
      required: [id, conversationId, senderId, kind, event, createdAt, body, editedAt, deletedAt, changedAfterReport, versions, attachments]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
          nullable: true
          description: The sender; for a system message the actor, or null when it has none.
        kind:
          $ref: "#/components/schemas/MessageKind"
        event:
          nullable: true
          description: The change a system message describes; null for a text message.
          allOf:
            - $ref: "#/components/schemas/SystemEvent"
        createdAt:
          type: string
          format: date-time
        body:
          type: string
          nullable: true
          description: The text shown at the report's moment; null when the message was deleted by then.
        editedAt:
          type: string
          format: date-time
          nullable: true
          description: The latest edit, also one after the report; null when never edited.
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: When the sender deleted the message, also after the report; null when not deleted.
        changedAfterReport:
          type: boolean
          description: The message was edited or deleted after the report. The later text is not shown.
        versions:
          type: array
          description: |
            Earlier texts that were shown at or before the report's moment, oldest first. Each
            ended with an edit or with the deletion. Empty when the text never changed by then.
          items:
            $ref: "#/components/schemas/MessageVersion"
        attachments:
          type: array
          description: |
            The message's files with their scan status, also for a message deleted later. A clean
            one can be downloaded with `getReportedAttachment`.
          items:
            $ref: "#/components/schemas/Attachment"

    MessageVersion:
      type: object
      required: [body, shownFrom, shownUntil, endedBy]
      properties:
        body:
          type: string
        shownFrom:
          type: string
          format: date-time
        shownUntil:
          type: string
          format: date-time
        endedBy:
          type: string
          enum: [edited, deleted]
          description: "`edited`: a new text replaced it. `deleted`: the sender deleted the message."

    ResolveMessageReportRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [dismissed, action_taken]
        note:
          type: string
          description: At most 1,000 characters after trimming; empty means none.
          maxLength: 1000

    ProjectStatus:
      type: string
      description: "`open` projects are found by search (FR-10.3); `archived` projects are seen by members only."
      enum: [open, closed, archived]

    ProjectRole:
      type: string
      description: A member's role in one project (SRS 2.3).
      enum: [owner, editor, viewer]

    MemberRole:
      type: string
      description: A role the owner can give a member (FR-11.2 to FR-11.4); ownership moves only by transfer (FR-10.5).
      enum: [editor, viewer]

    JoinRequestStatus:
      type: string
      enum: [pending, accepted, rejected]

    JoinRequestCreate:
      type: object
      properties:
        message:
          type: string
          nullable: true
          description: A short note to the owner, at most 500 characters after trimming; empty or null means none.

    MemberRoleBody:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/MemberRole"

    InvitationCreate:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MemberRole"

    OwnershipTransfer:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          description: The member who becomes the owner.

    MembershipProject:
      type: object
      description: The project a request or invitation is about, as its sender or invitee sees it.
      required: [id, title, status, owner]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        owner:
          $ref: "#/components/schemas/ProjectPerson"

    ProjectJoinRequest:
      type: object
      description: A join request as the project's owner sees it.
      required: [id, status, message, user, createdAt, decidedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JoinRequestStatus"
        message:
          type: string
          nullable: true
        user:
          $ref: "#/components/schemas/ProjectPerson"
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true

    ProjectJoinRequestPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectJoinRequest"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    MyJoinRequest:
      type: object
      description: A join request as its sender sees it.
      required: [id, status, message, project, createdAt, decidedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JoinRequestStatus"
        message:
          type: string
          nullable: true
        project:
          $ref: "#/components/schemas/MembershipProject"
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true

    MyJoinRequestPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyJoinRequest"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    ProjectInvitation:
      type: object
      description: An invitation as the project's owner sees it.
      required: [id, status, role, user, createdAt, decidedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JoinRequestStatus"
        role:
          $ref: "#/components/schemas/MemberRole"
        user:
          $ref: "#/components/schemas/ProjectPerson"
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true

    ProjectInvitationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectInvitation"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    MyInvitation:
      type: object
      description: A pending invitation as the invitee sees it.
      required: [id, role, project, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MemberRole"
        project:
          $ref: "#/components/schemas/MembershipProject"
        createdAt:
          type: string
          format: date-time

    MyInvitationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyInvitation"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    ProjectMember:
      type: object
      required: [user, role, joinedAt]
      properties:
        user:
          $ref: "#/components/schemas/ProjectPerson"
        role:
          $ref: "#/components/schemas/ProjectRole"
        joinedAt:
          type: string
          format: date-time

    ProjectMemberPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    ProjectPerson:
      type: object
      required: [userId, fullName, headline, photoUrl]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        headline:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
          description: The profile photo as `/api/v1/media/{fileId}`; null when not set.

    ProjectFilePath:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        A path inside the project, folders separated by `/` (FR-12.1). Each part is 1 to 100
        characters of letters `A-Z` and `a-z`, digits, `_`, `-` and `.`, and does not start
        with `.`; **no spaces** (LaTeX's `\input` and `\includegraphics` handle them badly). At
        most 8 parts and 255 characters; no `/` at the start or end and no empty part. Unique
        in the project ignoring letter case. A path that breaks these rules gets 400
        `invalid_path` with `field: path`.
      example: figures/results-2024.png
    ProjectFileKind:
      type: string
      description: "`text`: a text file kept in the database. `binary`: a figure (FR-12.2). `folder`."
      enum: [text, binary, folder]
    ProjectFile:
      type: object
      description: A file or folder of a project (FR-12.1).
      required: [id, path, kind, size, version, contentType, scanStatus, updatedAt, updatedBy]
      properties:
        id:
          type: string
          format: uuid
        path:
          $ref: "#/components/schemas/ProjectFilePath"
        kind:
          $ref: "#/components/schemas/ProjectFileKind"
        size:
          type: integer
          format: int64
          description: Bytes; the UTF-8 length of a text file's content, 0 for a folder.
        version:
          type: integer
          description: |
            A text file's version, raised by every save of its content (FR-12.6); send it back
            with `saveProjectFileContent`. 1 for a folder or a figure.
        contentType:
          type: string
          nullable: true
          description: A figure's type (`image/png`, `image/jpeg` or `application/pdf`); null otherwise.
        scanStatus:
          allOf:
            - $ref: "#/components/schemas/AttachmentStatus"
          nullable: true
          description: A figure's malware scan; null for a text file or folder.
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          allOf:
            - $ref: "#/components/schemas/ProjectPerson"
          nullable: true
          description: Who last changed the file or its path; null when unknown or the account is gone.
    ProjectFileTree:
      type: object
      required: [mainFilePath, items, storage]
      properties:
        mainFilePath:
          type: string
          description: The file compile starts from (FR-13.1); it may not exist.
        storage:
          $ref: "#/components/schemas/ProjectStorage"
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ProjectFile"
    ProjectStorage:
      type: object
      description: |
        The project's figure storage and its limits (FR-12.2; `FIGURE_MAX_BYTES` and
        `PROJECT_STORAGE_MAX_BYTES`, docs/decisions.md 2026-11-18).
      required: [usedBytes, limitBytes, figureMaxBytes]
      properties:
        usedBytes:
          type: integer
          format: int64
          description: The bytes of the project's figures, except those removed as malware.
        limitBytes:
          type: integer
          format: int64
          description: The most the project's figures may take, 500 MB by default.
        figureMaxBytes:
          type: integer
          format: int64
          description: The largest figure, 50 MB by default.
    FigureUploadStart:
      type: object
      required: [path, size]
      properties:
        path:
          type: string
          description: Where the figure goes; see `ProjectFilePath`. It ends in `.png`, `.jpg`, `.jpeg` or `.pdf`.
        size:
          type: integer
          format: int64
          minimum: 1
          description: The file's size in bytes; storage accepts exactly this many.
    FigureUploadTicket:
      type: object
      required: [id, url, fields, expiresAt]
      properties:
        id:
          type: string
          format: uuid
          description: The upload, for `completeFigureUpload`.
        url:
          type: string
          description: Where to POST the form (the storage service, not the API).
        fields:
          type: object
          additionalProperties:
            type: string
          description: Form fields to send, in any order, before the file part named `file`.
        expiresAt:
          type: string
          format: date-time
          description: Storage refuses the POST after this time.
    StorageLimitError:
      type: object
      description: |
        The `Error` shape. On `storage_limit_reached` it adds `usedBytes` and `limitBytes`,
        the project's storage as it is now (docs/decisions.md, 2026-11-18); the message
        names both too. `file_too_large` carries `limitBytes`, the largest figure.
      required: [code, message]
      properties:
        code:
          type: string
          example: storage_limit_reached
        message:
          type: string
        usedBytes:
          type: integer
          format: int64
        limitBytes:
          type: integer
          format: int64
    ProjectFileCreate:
      type: object
      required: [path, kind]
      properties:
        path:
          type: string
          description: See `ProjectFilePath`.
        kind:
          type: string
          enum: [text, folder]
        content:
          type: string
          description: A text file's first content, at most 1 MiB; empty when left out. Not for a folder.
    ProjectFileMove:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: The new path; see `ProjectFilePath`.
    ProjectFileSave:
      type: object
      required: [content, version]
      properties:
        content:
          type: string
          description: The whole text, at most 1 MiB of UTF-8.
        version:
          type: integer
          minimum: 1
          description: The file's version this text was edited from.
    ProjectFileDownload:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          description: |
            A presigned URL to the object, valid for 5 minutes; its answer has
            `Content-Disposition: attachment` and the stored content type.
        expiresAt:
          type: string
          format: date-time
    ProjectFileDetail:
      type: object
      required: [file, content, download]
      properties:
        file:
          $ref: "#/components/schemas/ProjectFile"
        content:
          type: string
          nullable: true
          description: A text file's content; null for a figure or folder.
        download:
          allOf:
            - $ref: "#/components/schemas/ProjectFileDownload"
          nullable: true
          description: A clean figure's download; null for a text file or folder.
    ProjectFileCurrent:
      type: object
      required: [version, content, updatedAt]
      properties:
        version:
          type: integer
        content:
          type: string
        updatedAt:
          type: string
          format: date-time
    CollabTicket:
      type: object
      description: A one-time ticket for the sync server (FR-12.7, docs/sync.md).
      required: [ticket, expiresAt, role, displayName, epoch]
      properties:
        ticket:
          type: string
          description: Opaque; send it as the Hocuspocus token within 30 seconds.
        expiresAt:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/ProjectRole"
        displayName:
          type: string
          description: The caller's profile name, as the other members will see it.
        epoch:
          type: string
          format: uuid
          nullable: true
          description: The file's Yjs history, or null when none is stored.
    SyncTicketRedeem:
      type: object
      required: [ticket, fileId]
      properties:
        ticket:
          type: string
          minLength: 1
          maxLength: 200
        fileId:
          type: string
          format: uuid
    SyncRole:
      type: string
      description: A member's role in the file's project, or `none` without access.
      enum: [owner, editor, viewer, none]
    SyncSession:
      type: object
      required: [userId, projectId, fileId, role, displayName]
      properties:
        userId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ProjectRole"
        displayName:
          type: string
    SyncAccessCheck:
      type: object
      required: [userId, fileId]
      properties:
        userId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
    SyncAccessRequest:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/SyncAccessCheck"
    SyncAccessAnswer:
      type: object
      required: [userId, fileId, role]
      properties:
        userId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/SyncRole"
    SyncAccessResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SyncAccessAnswer"
    SyncFile:
      type: object
      required: [projectId, content, version, ydocState, ydocEpoch]
      properties:
        projectId:
          type: string
          format: uuid
        content:
          type: string
        version:
          type: integer
        ydocState:
          type: string
          format: byte
          nullable: true
          description: "`Y.encodeStateAsUpdate` of the document, base64; null: build it from `content`."
        ydocEpoch:
          type: string
          format: uuid
          nullable: true
    SyncFileStore:
      type: object
      required: [ydocState, ydocEpoch, content, baseVersion]
      properties:
        ydocState:
          type: string
          format: byte
        ydocEpoch:
          type: string
          format: uuid
        content:
          type: string
        baseVersion:
          type: integer
          minimum: 1
        updatedBy:
          type: string
          format: uuid
          nullable: true
    SyncFileStored:
      type: object
      required: [version]
      properties:
        version:
          type: integer
    FileVersionConflict:
      type: object
      description: |
        The `Error` shape with one **conflict-specific extension** (docs/decisions.md,
        2026-11-17): on `version_conflict`, `current` holds the file's version and text as
        they are now, so the client can show or merge them without another request. It is
        absent on `not_a_text_file`. No other error carries it.
      required: [code, message]
      properties:
        code:
          type: string
          example: version_conflict
        message:
          type: string
        current:
          $ref: "#/components/schemas/ProjectFileCurrent"
    CompileStatus:
      type: string
      description: |
        `queued` and `running` are active (one per project, FR-13.4). `succeeded`: a PDF was
        made, even when the log reports errors, which `errors` lists. `failed`: no PDF was
        made (`failure` says why when the reason is not in the log). `timed_out`: stopped
        after 60 seconds (FR-13.5). `cancelled`: no worker took it within 5 minutes.
      enum: [queued, running, succeeded, failed, timed_out, cancelled]

    CompileEngine:
      type: string
      description: The TeX engine; only `pdflatex` for now (FR-13.1), with BibTeX.
      enum: [pdflatex]

    CompileFailure:
      type: string
      description: |
        Why a compile ended without a PDF when the log alone does not say:
        `input_too_large` (the project's files pass the compile limit),
        `output_too_large` (the PDF passes 100 MiB), `out_of_memory` (1 GB, NFR-4),
        `no_pdf` (LaTeX ended without one), `worker_lost` (the compile service stopped
        answering), `sandbox_error` (the container could not run), `queue_expired`
        (cancelled after 5 minutes in the queue).
      enum: [input_too_large, output_too_large, out_of_memory, no_pdf, worker_lost, sandbox_error, queue_expired]

    CompileError:
      type: object
      description: |
        One problem from the log (FR-13.2). `file` is a project path, or null when the
        problem is not in a project file (a package, the class, the engine). `line` is null
        when the log gives none.
      required: [file, line, message, severity]
      properties:
        file:
          type: string
          nullable: true
        line:
          type: integer
          nullable: true
        message:
          type: string
          description: At most 500 characters.
        severity:
          type: string
          enum: [error, warning]

    CompileSkippedFile:
      type: object
      description: A figure left out of the compile because its malware scan has not found it clean.
      required: [path, reason]
      properties:
        path:
          type: string
        reason:
          type: string
          enum: [scan_pending, scan_failed, infected]

    Compile:
      type: object
      description: A compile job (FR-13.1, FR-13.2, FR-13.5).
      required: [id, projectId, status, engine, mainFilePath, requestedBy, createdAt, startedAt, finishedAt, durationMs, failure, errors, skipped, liveTextConfirmed, pages, hasLog, hasPdf]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/CompileStatus"
        engine:
          $ref: "#/components/schemas/CompileEngine"
        mainFilePath:
          type: string
          description: The file compiled, as it was when the compile was asked for.
        requestedBy:
          type: string
          format: uuid
          nullable: true
          description: The member who asked; null when that account is gone.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        durationMs:
          type: integer
          nullable: true
          description: How long the sandbox ran, in milliseconds.
        failure:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CompileFailure"
        errors:
          type: array
          description: Errors first, then warnings, each in log order; at most 100.
          items:
            $ref: "#/components/schemas/CompileError"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/CompileSkippedFile"
        liveTextConfirmed:
          type: boolean
          description: |
            False when files were open for real-time editing and the sync server did not
            confirm within 5 seconds that it stored them: edits of the last seconds may be
            missing from this compile.
        pages:
          type: integer
          nullable: true
          description: The PDF's page count, from the log.
        hasLog:
          type: boolean
          description: Whether `getCompileLog` has a log for it.
        hasPdf:
          type: boolean
          description: Whether this compile's PDF is the one `downloadProjectPdf` serves.

    CompileConflict:
      type: object
      description: |
        The `Error` shape; on `compile_running`, `compileId` names the compile that is queued
        or running.
      required: [code, message]
      properties:
        code:
          type: string
          example: compile_running
        message:
          type: string
        compileId:
          type: string
          format: uuid

    CompileClaim:
      type: object
      required: [workerId]
      properties:
        workerId:
          type: string
          description: The worker's name for its logs, 1 to 100 characters.
          maxLength: 100

    CompileJob:
      type: object
      description: What the compile worker runs.
      required: [id, projectId, mainFilePath, engine]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        mainFilePath:
          type: string
        engine:
          $ref: "#/components/schemas/CompileEngine"

    CompileResult:
      type: object
      description: How the sandbox run ended, as the compile worker saw it.
      required: [outcome, durationMs, log, bibtexLog]
      properties:
        outcome:
          type: string
          description: |
            `completed`: LaTeX ran to its end (with or without errors). `timed_out`: killed
            at 60 seconds. `failed`: the run could not complete; `failure` says why.
          enum: [completed, timed_out, failed]
        failure:
          nullable: true
          description: "With `failed`: `output_too_large`, `out_of_memory` or `sandbox_error`."
          allOf:
            - $ref: "#/components/schemas/CompileFailure"
        exitCode:
          type: integer
          nullable: true
        durationMs:
          type: integer
          minimum: 0
        log:
          type: string
          description: The pdfLaTeX log (`<main>.log`), at most 2 MiB of UTF-8; may be empty.
        bibtexLog:
          type: string
          description: The BibTeX log (`<main>.blg`), at most 256 KiB; may be empty.

    RealtimeCompileUpdated:
      type: object
      description: |
        A compile of a project the user is a member of was queued, started or finished
        (FR-13.1). Sent to every current member.
      required: [projectId, compile]
      properties:
        projectId:
          type: string
          format: uuid
        compile:
          $ref: "#/components/schemas/Compile"

    Project:
      type: object
      description: A research project's page (FR-10.1, SRS 2.3).
      required: [id, title, description, abstract, status, requiredSkills, owner, myRole, memberCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        abstract:
          type: string
          nullable: true
          description: The paper's abstract; null when there is none, and always null for a caller who is not a member.
        status:
          $ref: "#/components/schemas/ProjectStatus"
        requiredSkills:
          type: array
          description: Sorted by name, ignoring letter case.
          items:
            $ref: "#/components/schemas/Tag"
        owner:
          $ref: "#/components/schemas/ProjectPerson"
        myRole:
          nullable: true
          description: The caller's role in the project; null when the caller is not a member.
          allOf:
            - $ref: "#/components/schemas/ProjectRole"
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          description: 3 to 150 characters after trimming.
          maxLength: 150
        description:
          type: string
          description: 1 to 5,000 characters after trimming.
          maxLength: 5000
        requiredSkills:
          type: array
          description: Skill names (FR-4.2); duplicates ignoring letter case are dropped, at most 20 remain.
          items:
            type: string
        abstract:
          type: string
          nullable: true
          description: At most 3,000 characters after trimming; empty or null means none.
          maxLength: 3000

    ProjectUpdate:
      type: object
      description: |
        The fields to change (FR-10.2). A missing field keeps its value. `null` clears
        `abstract`; `null` for any other field is refused (`bad_request`).
      properties:
        title:
          type: string
          nullable: true
          maxLength: 150
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        description:
          type: string
          nullable: true
          maxLength: 5000
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        requiredSkills:
          type: array
          nullable: true
          description: Replaces the whole list.
          items:
            type: string
          x-go-type: nullable.Nullable[[]string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        abstract:
          type: string
          nullable: true
          maxLength: 3000
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        status:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ProjectStatus"
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        mainFilePath:
          type: string
          nullable: true
          maxLength: 255
          description: |
            The file compile starts from (FR-13.1): the path of an existing text file ending
            in `.tex`, letter case as stored (the path is matched ignoring case and stored as
            the file's own). Else 409 `main_file_invalid`.
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable

    ProjectSummary:
      type: object
      description: A project in a list.
      required: [id, title, description, status, requiredSkills, owner, myRole, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          description: The first 300 characters of the description.
        status:
          $ref: "#/components/schemas/ProjectStatus"
        requiredSkills:
          type: array
          maxItems: 5
          description: Up to 5 required skill names, by name ignoring letter case.
          items:
            type: string
        owner:
          $ref: "#/components/schemas/ProjectPerson"
        myRole:
          nullable: true
          description: The caller's role in the project; null when the caller is not a member.
          allOf:
            - $ref: "#/components/schemas/ProjectRole"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: Projects on all pages.

    ProjectSearchResult:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          required: [matchedOn]
          properties:
            matchedOn:
              type: string
              enum: [title, skill, description, meaning]
              description: |
                The field of the result's best match; `meaning` when only the meaning search
                found it (hybrid mode).

    ProjectSearchPage:
      type: object
      required: [items, total, page, pageSize, fuzzy, correctedQuery, mode]
      properties:
        mode:
          type: string
          enum: [hybrid, keyword, keyword_fallback]
          description: |
            How the results were found: `hybrid` by keyword and meaning, `keyword` because
            the request asked for it, `keyword_fallback` by keyword only because the AI
            service did not answer (AI-5.4).
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSearchResult"
        total:
          type: integer
          description: The number of results on all pages.
        page:
          type: integer
        pageSize:
          type: integer
          description: Always 20 (FR-10.3).
        fuzzy:
          type: boolean
          description: True when no title contains `q` and the title results are titles similar to it.
        correctedQuery:
          type: string
          nullable: true
          description: When `fuzzy` is true, the result title most similar to `q`; otherwise null.

    ReportProjectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: "#/components/schemas/ReportReason"
        details:
          type: string
          description: At most 1,000 characters after trimming; empty means none.
          maxLength: 1000

    ProjectReportReceipt:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ProjectReport:
      type: object
      required: [id, projectId, projectTitle, status, reason, details, reporter, owner, createdAt, outcome, note, resolvedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        projectTitle:
          type: string
          description: The project's title now.
        status:
          type: string
          enum: [open, resolved]
        reason:
          $ref: "#/components/schemas/ReportReason"
        details:
          type: string
          nullable: true
          description: The reporter's own words.
        reporter:
          $ref: "#/components/schemas/MessageReportPerson"
        owner:
          description: The project's owner now, whom a moderation action would name.
          allOf:
            - $ref: "#/components/schemas/MessageReportPerson"
        createdAt:
          type: string
          format: date-time
        outcome:
          type: string
          nullable: true
          enum: [dismissed, action_taken]
        note:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    ProjectReportPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectReport"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: Reports with this status on all pages.

    ReportedProject:
      type: object
      description: The reported project as it is now, whatever its status.
      required: [id, title, description, abstract, status, requiredSkills, memberCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        abstract:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ProjectStatus"
        requiredSkills:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectReportDetail:
      type: object
      required: [report, project]
      properties:
        report:
          $ref: "#/components/schemas/ProjectReport"
        project:
          $ref: "#/components/schemas/ReportedProject"

    ResolveProjectReportRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [dismissed, action_taken]
        note:
          type: string
          description: At most 1,000 characters after trimming; empty means none.
          maxLength: 1000

    MessageUnreadCount:
      type: object
      required: [total, requests]
      properties:
        total:
          type: integer
