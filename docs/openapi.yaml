# ResearchSphere API contract (SRS 5.3). Change this file before a handler,
# then run `make generate` to regenerate backend/internal/api/api.gen.go.
openapi: 3.0.3
info:
  title: ResearchSphere API
  version: 0.1.0
  description: |
    JSON API between the web client and the API server. Every error response uses the
    Error schema. Lists are paginated and the server caps the page size at 50.
servers:
  - url: /api/v1

# Every operation needs a session unless it declares `security: []` (FR-3.1).
security:
  - cookieAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the database and Redis respond
      description: Public, needs no session. Returns no user data.
      tags: [health]
      security: []
      responses:
        "200":
          description: The database and Redis both respond.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database, Redis or both do not respond.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/register:
    post:
      operationId: registerUser
      summary: Register a new account and send a verification link (FR-1.1 to FR-1.3)
      description: |
        Public. Creates the user, the profile and a verification token in one transaction,
        then emails the link. The account exists even when the email cannot be sent; the
        user can ask for a new link (FR-1.5).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account was created and a verification link was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: |
            The input is not valid. `code` is one of `bad_request`, `invalid_full_name`,
            `invalid_email`, `password_too_short` or `password_too_long`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The email address is already registered (`email_taken`), ignoring letter case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address with the token from the link (FR-1.3)
      description: Public. A token works once and expires 24 hours after it was sent.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: The email address is verified.
        "400":
          description: |
            The token cannot be used. `code` is `token_invalid` (unknown), `token_used`
            or `token_expired`, or `bad_request` for a malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Send a new verification link (FR-1.5)
      description: |
        Public. The response is the same whether or not the address is registered or
        already verified. A new link makes the older unused links stop working.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "202":
          description: If the address belongs to an unverified account, a new link was sent.
        "400":
          description: The address is not well formed (`invalid_email`), or the body is malformed (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      operationId: loginUser
      summary: Log in with email address and password (FR-2.1, FR-1.4)
      description: |
        Public. On success the response sets two httpOnly, SameSite=Lax cookies (Secure
        when the site runs on HTTPS): `rs_access`, a signed access token valid for 15
        minutes (path `/`), and `rs_refresh`, a refresh token valid for 30 days (path
        `/api/v1/auth`). Each login starts a new session, which lasts 30 days; refresh it
        with `POST /auth/refresh` and end it with `POST /auth/logout`. A wrong password and
        an unknown email address get the same answer.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in. The cookies are set and the body is the user.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, in two headers."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: The body is malformed (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            The email address or the password is wrong (`invalid_credentials`). The answer
            does not say which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The password is right but the email address is not verified yet
            (`email_not_verified`, FR-1.4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Issue new tokens for the session in the refresh cookie (FR-2.1, FR-2.2)
      description: |
        Public: the access token may already have expired. Reads the `rs_refresh` cookie,
        replaces the session's refresh token with a new one and issues a new access token.
        The old refresh token stops working. The session keeps the expiry it got at login.
        Sending a refresh token that was already replaced ends the session, since the token
        may have been stolen. A browser must not send two refreshes at the same time.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Refreshed. `rs_access` and `rs_refresh` are set again.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, in two headers."
              schema:
                type: string
        "401":
          description: |
            The cookie is missing, or its session is unknown, expired, ended or was reused
            (`session_invalid`). The answer does not say which, and clears both cookies.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, cleared, in two headers."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      operationId: logoutUser
      summary: End the session on this device (FR-2.2)
      description: |
        Public. Ends the session in the `rs_refresh` cookie, so its refresh token no longer
        works, and clears both cookies. Other devices stay logged in. Answers 204 even when
        there is no cookie or no such session.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Logged out. Both cookies are cleared.
          headers:
            Set-Cookie:
              description: "`rs_access` and `rs_refresh`, cleared, in two headers."
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the logged-in user
      description: Needs the access cookie.
      tags: [auth]
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: rs_access
      description: The access token set by `POST /auth/login`.

  parameters:
    RefreshCookie:
      name: rs_refresh
      in: cookie
      required: false
      description: The refresh token set by `POST /auth/login` or `POST /auth/refresh`.
      schema:
        type: string

  schemas:
    Error:
      type: object
      description: The shape of every error response (SRS 5.3).
      required: [code, message]
      properties:
        code:
          type: string
          description: Short machine-readable code, in snake_case.
          example: not_found
        message:
          type: string
          description: Readable explanation for the user.
          example: The requested resource does not exist.

    Health:
      type: object
      required: [status, database, redis]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]
        redis:
          type: string
          enum: [ok]

    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName:
          type: string
          description: Trimmed, 1 to 200 characters.
          maxLength: 200
          example: Ada Lovelace
        email:
          type: string
          maxLength: 254
          example: ada@example.org
        password:
          type: string
          description: 8 to 128 characters.
          minLength: 8
          maxLength: 128
          format: password

    RegisterResponse:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The address the verification link was sent to.

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token from the verification link.

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          example: ada@example.org
        password:
          type: string
          maxLength: 128
          format: password

    CurrentUser:
      type: object
      required: [id, email, fullName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string

  responses:
    Unauthorized:
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such route or resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: An unexpected error on the server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
