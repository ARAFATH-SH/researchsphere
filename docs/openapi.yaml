      description: How the publication was added (FR-5.1, FR-5.2, FR-5.3).
      enum: [manual, doi, orcid]

    Publication:
      type: object
      description: One publication (FR-5.1). The optional fields are always present and null when not set.
      required: [id, doi, title, year, venue, abstract, url, source, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        doi:
          type: string
          nullable: true
          description: The bare, lower-case DOI.
          example: 10.1145/3292500.3330701
        title:
          type: string
        year:
          type: integer
          nullable: true
          description: Always set for a publication added by hand; an imported one may have none.
          example: 2024
        venue:
          type: string
          nullable: true
          example: KDD
        abstract:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          example: https://example.org/paper
        source:
          $ref: "#/components/schemas/PublicationSource"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicationAdded:
      description: The publication, and whether the caller was linked to one that already existed (FR-5.4).
      allOf:
        - $ref: "#/components/schemas/Publication"
        - type: object
          required: [linked]
          properties:
            linked:
              type: boolean
              description: True when a publication with the same DOI already existed and the caller was linked to it.

    PublicationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Publication"
        page:
          type: integer
        pageSize:
          type: integer
          description: The page size used, at most 50.
        total:
          type: integer
          description: The number of publications on all pages.

    PeopleSearchPage:
      type: object
      required: [items, total, page, pageSize, fuzzy, correctedQuery, facets, mode]
      properties:
        mode:
          type: string
          enum: [hybrid, keyword, keyword_fallback]
          description: |
            How the results were found: `hybrid` by keyword and meaning, `keyword` because
            the request asked for it, `keyword_fallback` by keyword only because the AI
            service did not answer (AI-5.4).
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonSearchResult"
        total:
          type: integer
          description: The number of results on all pages, with every filter applied.
        page:
          type: integer
        pageSize:
          type: integer
          description: Always 20 (FR-6.1).
        fuzzy:
          type: boolean
          description: |
            True when no name contains `q` and the name results are names similar to it
            (FR-6.2).
        correctedQuery:
          type: string
          nullable: true
          description: |
            When `fuzzy` is true, the result name most similar to `q`, for "Showing results
            for ..."; otherwise null.
        facets:
          $ref: "#/components/schemas/PeopleSearchFacets"
    PersonSearchResult:
      type: object
      required: [userId, fullName, headline, institution, photoUrl, interests, matchedOn, connectionStatus, connectionRequestId]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        headline:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
          description: The profile photo as `/api/v1/media/{fileId}`; null when not set.
        interests:
          type: array
          maxItems: 3
          description: |
            Up to 3 of the user's research interests: the ones that match `q` or a
            selected interest first, then by name.
          items:
            type: string
        matchedOn:
          type: string
          enum: [name, institution, interest, headline, meaning]
          description: |
            The field of the result's best keyword match, or `meaning` when only the search by
            meaning found it (hybrid mode, AI-5.2).
        connectionStatus:
          $ref: "#/components/schemas/ConnectionStatus"
        connectionRequestId:
          type: string
          format: uuid
          nullable: true
          description: |
            The pending request between the caller and this user when `connectionStatus`
            is `pending_sent` or `pending_received`; null otherwise.
    PeopleRecommendations:
      type: object
      required: [state, missing, items]
      properties:
        state:
          type: string
          enum: [ready, needs_profile, processing]
          description: |
            `ready`: `items` holds the recommendations (possibly none). `needs_profile`: the
            profile has no interests, skills or bio (AI-4.2). `processing`: the profile's
            embedding is not made yet.
        missing:
          type: array
          maxItems: 3
          description: |
            With `needs_profile`, the profile fields to fill in, in this order: `interests`,
            `skills`, `bio`. Empty in the other states.
          items:
            type: string
            enum: [interests, skills, bio]
        items:
          type: array
          maxItems: 10
          description: Most similar first. Empty unless `state` is `ready`.
          items:
            $ref: "#/components/schemas/PersonRecommendation"
    PersonRecommendation:
      type: object
      required: [userId, fullName, headline, institution, photoUrl, connectionStatus, score, shared]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        headline:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
          description: The profile photo as `/api/v1/media/{fileId}`; null when not set.
        connectionStatus:
          $ref: "#/components/schemas/ConnectionStatus"
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            How similar the two profiles are, as a percentage (AI-2.2). It is the cosine
            similarity of the embeddings put through a fixed increasing mapping fitted on
            sample data (docs/evaluation.md), not the raw cosine.
        shared:
          type: array
          maxItems: 3
          description: |
            In `recommendPeople`: up to 3 research interests or skills both users have (the
            same name, ignoring letter case), interests first, then skills, each in the
            caller's order. In `recommendProjectResearchers`: up to 3 of the project's
            required skills the researcher has, in the project's order. May be empty.
          items:
            type: string
    ProjectRecommendations:
      type: object
      required: [state, missing, items]
      properties:
        state:
          type: string
          enum: [ready, needs_profile, processing]
          description: As in `PeopleRecommendations`.
        missing:
          type: array
          maxItems: 3
          description: |
            With `needs_profile`, the profile fields to fill in, in this order: `interests`,
            `skills`, `bio`. Empty in the other states.
          items:
            type: string
            enum: [interests, skills, bio]
        items:
          type: array
          maxItems: 10
          description: Most similar first. Empty unless `state` is `ready`.
          items:
            $ref: "#/components/schemas/ProjectRecommendation"
    ProjectRecommendation:
      type: object
      required: [project, score, shared]
      properties:
        project:
          $ref: "#/components/schemas/RecommendedProject"
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            How similar the project is to the caller's profile, as a percentage. It is the
            cosine similarity of the embeddings put through a fixed increasing mapping fitted
            on sample data (docs/evaluation.md), not the raw cosine.
        shared:
          type: array
          maxItems: 3
          description: |
            Up to 3 of the project's required skills the caller has (the same name, ignoring
            letter case), in the project's order. May be empty.
          items:
            type: string
    RecommendedProject:
      type: object
      description: A recommended project's summary.
      required: [id, title, description, requiredSkills, owner, memberCount]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          description: The first 300 characters of the description.
        requiredSkills:
          type: array
          maxItems: 5
          description: Up to 5 required skill names, by name ignoring letter case.
          items:
            type: string
        owner:
          $ref: "#/components/schemas/ProjectPerson"
        memberCount:
          type: integer
          minimum: 1
          description: Shown only; it never affects the order (AI-2.4).
    PeopleSearchFacets:
      type: object
      required: [institutions, interests]
      properties:
        institutions:
          type: array
          description: |
            Up to 20 institutions of the results with `q` and the interest filters applied
            but not the institution filter, most results first, then by name.
          items:
            $ref: "#/components/schemas/SearchFacet"
        interests:
          type: array
          description: |
            The research interests of the results with every filter applied: first every
            selected interest (in the order given; its count equals `total`, since every
            result has it), then up to 20 others, most results first, then by name. Each
            count is how many results would remain with that interest selected too.
          items:
            $ref: "#/components/schemas/SearchFacet"
    SearchFacet:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer

    PublicationFromDOI:
      type: object
      required: [doi]
      properties:
        doi:
          type: string
          description: The DOI from the preview, in any form `lookupPublicationByDOI` accepts.
          example: 10.1145/3292500.3330701

    PublicationPreview:
      type: object
      description: |
        A publication's metadata for a DOI (FR-5.2), shown for confirmation before it is
        saved. The optional fields are always present and null when not known.
      required: [doi, title, year, venue, abstract, url, existsAlready, linkedToMe]
      properties:
        doi:
          type: string
          description: The bare, lower-case DOI.
          example: 10.1145/3292500.3330701
        title:
          type: string
        year:
          type: integer
          nullable: true
        venue:
          type: string
          nullable: true
        abstract:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        existsAlready:
          type: boolean
          description: True when a publication with this DOI is already stored; the fields are the stored record's.
        publicationId:
          type: string
          format: uuid
          description: The stored publication's ID, present only when `existsAlready` is true.
        linkedToMe:
          type: boolean
          description: True when the stored publication is confirmed on the caller's profile.

    OrcidIdUpdate:
      type: object
      required: [orcidId]
      properties:
        orcidId:
          type: string
          nullable: true
          example: 0000-0002-1825-0097

    OrcidWorkList:
      type: object
      required: [orcidId, items]
      properties:
        orcidId:
          type: string
          description: The ORCID iD the works were listed for.
          example: 0000-0002-1825-0097
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrcidWork"

    OrcidWork:
      type: object
      description: One public work of an ORCID record (FR-5.3). The optional fields are always present and null when not known.
      required: [putCode, title, year, venue, doi, type, url, existsAlready, linkedToMe]
      properties:
        putCode:
          type: string
          description: ORCID's identifier of the work within the record.
          example: "123456"
        title:
          type: string
        year:
          type: integer
          nullable: true
        venue:
          type: string
          nullable: true
          description: The journal title.
        doi:
          type: string
          nullable: true
          description: The bare, lower-case DOI.
        type:
          type: string
          nullable: true
          description: ORCID's work type, such as `journal-article`.
        url:
          type: string
          nullable: true
        existsAlready:
          type: boolean
          description: True when a publication with this DOI is already stored.
        publicationId:
          type: string
          format: uuid
          description: The stored publication's ID, present only when `existsAlready` is true.
        linkedToMe:
          type: boolean
          description: True when the stored publication is confirmed on the caller's profile.

    OrcidImportRequest:
      type: object
      required: [putCodes]
      properties:
        putCodes:
          type: array
          description: 1 to 100 put-codes from `listMyOrcidWorks`, each once.
          items:
            type: string

    OrcidImportOutcome:
      type: string
      description: |
        `created`: a new record was stored. `linked`: the caller was linked to a stored
        record, or confirmed a link they had. `skipped`: the caller had confirmed it already.
      enum: [created, linked, skipped]

    OrcidImportItem:
      type: object
      required: [putCode, result, publicationId]
      properties:
        putCode:
          type: string
        result:
          $ref: "#/components/schemas/OrcidImportOutcome"
        publicationId:
          type: string
          format: uuid

    OrcidImportResult:
      type: object
      required: [items, created, linked, skipped]
      properties:
        items:
          type: array
          description: One item per put-code, in the order given.
          items:
            $ref: "#/components/schemas/OrcidImportItem"
        created:
          type: integer
        linked:
          type: integer
        skipped:
          type: integer

    PublicationCreate:
      type: object
      description: |
        A publication added by hand (FR-5.1). Text is trimmed first and lengths count
        characters after trimming; `title` and `venue` must be one line.
      required: [title, year]
      properties:
        title:
          type: string
          description: 1 to 500 characters.
          maxLength: 500
        year:
          type: integer
          description: From 1900 to next year (UTC).
        venue:
          type: string
          nullable: true
          description: At most 300 characters; empty means not set.
          maxLength: 300
        abstract:
          type: string
          nullable: true
          description: At most 5000 characters, line breaks allowed; empty means not set.
          maxLength: 5000
        url:
          type: string
          nullable: true
          description: An http or https link of at most 500 characters; empty means not set.
          maxLength: 500
        doi:
          type: string
          nullable: true
          description: |
            A DOI such as `10.1145/3292500.3330701`, optionally as a `https://doi.org/` link
            or with a `doi:` prefix; empty means not set.
          example: 10.1145/3292500.3330701

    PublicationUpdate:
      type: object
      description: |
        The fields to change in a publication (FR-5.1). A missing field keeps its value.
        `null` clears `venue`, `abstract`, `url` or `doi`; `null` for `title` or `year` is
        refused, because they are required. The rules of PublicationCreate apply to the
        publication after the change.
      properties:
        title:
          type: string
          nullable: true
          maxLength: 500
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        year:
          type: integer
          nullable: true
          x-go-type: nullable.Nullable[int]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        venue:
          type: string
          nullable: true
          maxLength: 300
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        abstract:
          type: string
          nullable: true
          maxLength: 5000
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        url:
          type: string
          nullable: true
          maxLength: 500
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        doi:
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable


  responses:
    InvalidMessage:
      description: |
        `cannot_message_self`, `invalid_body` (empty after trimming, over 5,000 characters,
        or holding a NUL character; or no body and no attachments), `invalid_attachment`
        (`field: attachmentIds`: more than 5, a repeated ID, or one that cannot be sent), or
        `bad_request` for a body that is not JSON or a missing or malformed `userId` or
        `clientId`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ModerationInvalid:
      description: |
        `reason`, `note`, `days`, `until`, `kind` or `reportId` is not valid (`bad_request`, with
        `field`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ModerationForbidden:
      description: |
        `forbidden`: the user's role does not permit the action (FR-3.2).
        `cannot_moderate_admin`: the target is an administrator, the caller included (FR-15.10).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ModerationConflict:
      description: |
        `already_restricted`, `already_suspended`, `not_suspended`, `restriction_not_active`, or
        `report_already_resolved`. Nothing is changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadSyncRequest:
      description: The body is not valid (`bad_request`, with `field` when one field is at fault).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountSuspendedOrForbidden:
      description: |
        `forbidden`: the user's role does not permit the action (FR-3.2).
        `account_suspended`: the caller's account was suspended after this session began, with
        `reason` and `until`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MessageForbidden:
      description: |
        `forbidden`: the user's role does not permit the action (FR-3.2).
        `cannot_message`: this person cannot be messaged. It does not say why (FR-16.9).
        `account_suspended`: the caller's account was suspended after this session began, with
        `reason` and `until`. `messaging_restricted`: the caller may not send messages until
        `until` (FR-15.6).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MessageRefused:
      description: |
        `request_pending`: the receiver has not accepted the request yet.
        `conversation_closed`: the request was declined.
        `you_blocked_this_user`: the caller has blocked the other user (FR-16.9).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MessageEditRefused:
      description: |
        `edit_window_closed`: the message is older than the edit window (FR-16.5).
        `request_pending`: the receiver has not accepted the request yet.
        `conversation_closed`: the request was declined.
        `you_blocked_this_user`: the caller has blocked the other user (FR-16.9).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GroupInvalid:
      description: |
        `invalid_group_name`: the name is empty after trimming, over 100 characters, or not
        on one line (with `field`). `bad_request` (with `field`) for a missing or malformed
        `clientId`, or `memberIds` or `userIds` that is empty, over 49, or names the caller.
        `ineligible_members` with `userIds`: users who are not the caller's connections, not
        verified, suspended, or in a block with the caller; it never says which reason.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GroupForbidden:
      description: |
        `forbidden`: the user's role does not permit the action (FR-3.2).
        `not_group_owner`: only the group's owner may do this.
        `account_suspended`: the caller's account was suspended after this session began, with
        `reason` and `until`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GroupRateLimited:
      description: |
        `rate_limited`: the caller has created 10 groups today, or added 100 members today
        (FR-16.10).
      headers:
        Retry-After:
          description: Seconds until creating or adding is accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MessageRateLimited:
      description: |
        The user has sent too many messages or message requests (`rate_limited`). The
        defaults are 30 messages a minute and 1,000 a day, and 5 new requests a minute and
        20 a day (FR-16.10). An edit counts as a message.
      headers:
        Retry-After:
          description: Seconds until sending is accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MessageSearchRateLimited:
      description: The user has searched messages more than 30 times in a minute (`rate_limited`, FR-16.8).
      headers:
        Retry-After:
          description: Seconds until searching is accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidConnectionPage:
      description: "`page` is not a whole number of at least 1 (`bad_request`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The user's role does not permit the action (FR-3.2). The body is always
        `{"code":"forbidden","message":"You do not have permission to do this."}`, with no
        resource data and no reason (FR-3.3). A session whose email address is not
        verified gets `email_not_verified` instead (FR-17.3, see the API description).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid access token was sent (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such route or resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidVenue:
      description: |
        A body field or parameter is not valid (`bad_request`, with `field`). The message says
        what rule it breaks.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidProject:
      description: |
        A field is not valid (`bad_request`, with `field`: `title`, `description`, `abstract`,
        `status`, `requiredSkills` or `requiredSkills[i]` for one name). The value is never
        repeated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidProjectFile:
      description: |
        `invalid_path` (`field: path`): the path breaks the path rules (`ProjectFilePath`), or
        names a figure's extension for a text file, or a figure's path does not end in an
        extension of its type. `invalid_move`: a folder cannot move into itself or below
        itself. `type_mismatch`: the figure's content is not the type its extension names.
        `invalid_image`: a figure's image structure cannot be read. `bad_request`
        (with `field` when one is at fault): any other invalid body, such as a folder with
        `content` or text with control characters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProjectFileConflict:
      description: |
        `path_taken`: another entry has this path, ignoring letter case. `parent_not_folder`:
        a part of the path is a file, not a folder. `file_limit_reached`: the project would
        have more than 200 files and folders.
        `upload_incomplete`: storage has no file for this upload yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidEducation:
      description: |
        A field is not valid. The code names the first invalid field, in this order:
        `invalid_institution`, `invalid_degree`, `invalid_field_of_study`,
        `invalid_start_year`, `invalid_end_year` (also when `endYear` is before
        `startYear`), `invalid_grade`, `invalid_description`. A body that is not JSON gets
        `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidExperience:
      description: |
        A field is not valid. The code names the first invalid field, in this order:
        `invalid_title`, `invalid_organization`, `invalid_employment_type`,
        `invalid_location`, `invalid_location_type`, `invalid_start_date` (also a future
        month or one before 1950), `invalid_end_date`, `invalid_is_current` (a PATCH that
        sets `isCurrent` to null), `end_date_required` (`isCurrent` false without
        `endDate`), `end_date_not_allowed` (`isCurrent` true with `endDate`),
        `invalid_date_range` (`endDate` before `startDate`), `invalid_description`. A body
        that is not JSON gets `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidPublication:
      description: |
        A field is not valid. The code names the first invalid field, in this order:
        `invalid_title`, `invalid_year` (also before 1900 or after next year),
        `invalid_venue`, `invalid_abstract`, `invalid_url` (also a link that is not http or
        https), `invalid_doi` (also a value that is not of the form `10.NNNN/...` after the
        prefix is removed). A body that is not JSON gets `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidLanguage:
      description: |
        A field is not valid. The code names the first invalid field, in this order:
        `invalid_language_name` (missing, empty after trimming, longer than 50 characters
        or more than one line), `invalid_proficiency`. A body that is not JSON gets
        `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProfileImageStored:
      description: The image is stored and the profile shows it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileImage"
    InvalidImage:
      description: |
        The image is over 8000 pixels wide or high (`image_too_large`), its type matches
        but it cannot be read (`invalid_image`), or the body is not multipart with a part
        named `file` (`bad_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoProfile:
      description: The account has no profile row yet (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FileTooLarge:
      description: The file is over the size limit (`file_too_large`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedImageType:
      description: The file is not a JPEG, PNG or still WebP image (`unsupported_type`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedAttachmentType:
      description: |
        The file is not a PDF, PNG, JPEG, still WebP, DOCX, XLSX or PPTX file by its content
        (`unsupported_type`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AttachmentRateLimited:
      description: |
        The user has uploaded 20 files in the current hour or 200 MB in the current day
        (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until the window ends and uploads are accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AttachmentRedirect:
      description: The scan said clean; the file is at the URL in `Location`.
      headers:
        Location:
          description: |
            A presigned URL to the object, valid for 5 minutes. Its answer has
            `Content-Disposition: attachment` with the file's name and the stored content type.
          required: true
          schema:
            type: string
        Cache-Control:
          description: Always `no-store`.
          required: true
          schema:
            type: string
        X-Content-Type-Options:
          description: Always `nosniff`.
          required: true
          schema:
            type: string
    AttachmentNotReady:
      description: |
        `scan_pending`: the malware scan has not finished. `scan_failed`: the scanner could not
        read the file; it will not be served.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AttachmentRemoved:
      description: "`file_removed`: the scan found malware and the file was deleted."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FigureTooLarge:
      description: |
        `file_too_large`: the figure is over the largest figure (`limitBytes`).
        `storage_limit_reached`: the project's figures would pass its storage limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StorageLimitError"
    UnsupportedFigureType:
      description: The file is not a PNG, JPEG or PDF by its content (`unsupported_type`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProjectFileRateLimited:
      description: |
        `rate_limited`: the caller has uploaded 30 figures in the current hour, saved 120
        times in the current minute, asked for 60 collaboration tickets in the current
        minute, or downloaded 10 archives in the current hour.
      headers:
        Retry-After:
          description: Seconds until the window ends.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CompileRateLimited:
      description: "`rate_limited`: the caller has started 10 compiles in the current minute."
      headers:
        Retry-After:
          description: Seconds until the window ends.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UploadRateLimited:
      description: The user has uploaded 5 images in the current hour (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until the hour ends and uploads are accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidDOI:
      description: |
        The DOI is missing or not of the form `10.NNNN/...` after the prefix is removed
        (`invalid_doi`). A body that is not JSON gets `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DOINotFound:
      description: OpenAlex has no work with this DOI, or none with a title (`doi_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MetadataUnavailable:
      description: |
        OpenAlex did not answer in time, failed or refused the request (FR-5.6). The body is
        `{"code":"metadata_unavailable","message":"We couldn't reach the publication
        database. You can add this publication by hand."}`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LookupRateLimited:
      description: The user has made 30 lookups that reached OpenAlex in the current hour (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until the hour ends and lookups are accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrcidNotSet:
      description: The caller's profile has no ORCID iD (`orcid_not_set`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrcidNotFound:
      description: ORCID has no record with the iD on the profile (`orcid_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrcidUnavailable:
      description: |
        ORCID did not answer in time, failed or refused the request (FR-5.6). The body is
        `{"code":"metadata_unavailable","message":"We couldn't reach ORCID. You can still
        add publications by DOI or by hand."}`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrcidRateLimited:
      description: The user has made 10 calls that reached ORCID in the current hour (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until the hour ends and calls are accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SearchRateLimited:
      description: The user has searched 60 times in the current minute (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until the minute ends and searches are accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MembershipInvalid:
      description: |
        A body field or parameter is not valid (`bad_request`, with `field` when one field is
        at fault: `message`, `role`, `userId`, `page` or `pageSize`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MembershipConflict:
      description: |
        The project's membership does not allow the change (FR-11), and nothing is changed:
        `already_member`, `project_not_open`, `request_pending`, `invitation_pending`,
        `already_invited`, `request_not_pending`, `invitation_not_pending`, `use_transfer`,
        `cannot_remove_owner`, `owner_must_transfer`, `not_a_member`, `already_owner` or
        `member_unavailable`. Each operation says which of them it returns.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MembershipRateLimited:
      description: |
        `rate_limited`: the caller has sent 20 join requests, or 20 invitations, in the current
        day.
      headers:
        Retry-After:
          description: Seconds until sending is accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: An unexpected error on the server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
