# golangci-lint v2 settings for the backend. CI runs v2.14.0 (docs/decisions.md).
version: "2"

run:
  # Also lint the repository tests that need a database (make test-integration).
  build-tags: [integration]

linters:
  # The default set (errcheck, govet, ineffassign, staticcheck, unused) plus:
  enable:
    - bodyclose  # HTTP response bodies are closed
    - depguard   # the dependency rule between layers (AGENTS.md, Conventions)
    - errorlint  # errors are compared with errors.Is / errors.As
    - gosec      # common security mistakes
    - misspell
    - noctx      # outgoing requests and queries carry a context
    - sloglint   # consistent log/slog calls
  settings:
    # Dependency rule: domain -> standard library only; usecase -> its own domain only.
    # depguard cannot say "its own module", so every module adds a usecase-<module> rule;
    # the usecase-layer rule still catches a module that forgets.
    depguard:
      rules:
        domain:
          files: ["**/internal/*/domain/**"]
          list-mode: strict
          allow: [$gostd]
          deny:
            - pkg: net/http
              desc: the domain must not know about HTTP
        usecase-layer:
          files: ["**/internal/*/usecase/**"]
          list-mode: lax
          deny:
            - pkg: net/http
              desc: a usecase must not know about HTTP
            - pkg: github.com/jackc
              desc: depend on an interface in the module's domain instead
            - pkg: github.com/redis
              desc: depend on an interface in the module's domain instead
            - pkg: github.com/minio
              desc: depend on an interface in the module's domain instead
            - pkg: github.com/ARAFATH-SH/researchsphere/backend/internal/api
              desc: generated code is for adapters
            - pkg: github.com/ARAFATH-SH/researchsphere/backend/internal/platform
              desc: platform is an outer layer
        usecase-health:
          files: ["**/internal/health/usecase/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/ARAFATH-SH/researchsphere/backend/internal/health/domain
        usecase-auth:
          files: ["**/internal/auth/usecase/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/ARAFATH-SH/researchsphere/backend/internal/auth/domain
        usecase-moderation:
          files: ["**/internal/moderation/usecase/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/ARAFATH-SH/researchsphere/backend/internal/moderation/domain
        usecase-profile:
          files: ["**/internal/profile/usecase/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/ARAFATH-SH/researchsphere/backend/internal/profile/domain
        usecase-media:
          files: ["**/internal/media/usecase/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/ARAFATH-SH/researchsphere/backend/internal/media/domain
        usecase-social:
          files: ["**/internal/social/usecase/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/ARAFATH-SH/researchsphere/backend/internal/social/domain
        usecase-notification:
          files: ["**/internal/notification/usecase/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/ARAFATH-SH/researchsphere/backend/internal/notification/domain
        usecase-messaging:
          files: ["**/internal/messaging/usecase/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/ARAFATH-SH/researchsphere/backend/internal/messaging/domain
        usecase-realtime:
          files: ["**/internal/realtime/usecase/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/ARAFATH-SH/researchsphere/backend/internal/realtime/domain
        # The image codec sees only bytes and the media domain: no HTTP, database or
        # storage, so a decoding bug cannot reach anything else (FR-4.6).
        adapter-imaging:
          files: ["**/internal/media/adapter/imaging/**"]
          list-mode: strict
          allow:
            - $gostd
            - golang.org/x/image
            - github.com/ARAFATH-SH/researchsphere/backend/internal/media/domain
        # The ClamAV client sees only a TCP socket and the media domain (FR-16.7).
        adapter-clamav:
          files: ["**/internal/media/adapter/clamav/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/ARAFATH-SH/researchsphere/backend/internal/media/domain
        # The OpenAlex client sees only HTTP and the profile domain: no database, Redis or
        # generated API code (FR-5.2).
        adapter-openalex:
          files: ["**/internal/profile/adapter/openalex/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/ARAFATH-SH/researchsphere/backend/internal/profile/domain
        # The ORCID client sees only HTTP and the profile domain (FR-5.3).
        adapter-orcid:
          files: ["**/internal/profile/adapter/orcid/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/ARAFATH-SH/researchsphere/backend/internal/profile/domain
    sloglint:
      attr-only: false
      no-mixed-args: true
  exclusions:
    generated: strict  # never lint api.gen.go and other generated files
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ARAFATH-SH/researchsphere/backend
