# oapi-codegen settings. Run `make generate` from the repository root after changing
# docs/openapi.yaml; never edit api.gen.go by hand.
package: gen
output: api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
compatibility:
  # Store each secured operation's scopes in the request context (gen.CookieAuthScopes),
  # so the auth middleware protects exactly what the contract's `security` says
  # (docs/decisions.md). Deprecated upstream only because it cannot express OR/AND
  # combinations of schemes, which this API does not use.
  enable-auth-scopes-on-context: true
output-options:
  # Read JSON request bodies with decodeJSONBody (decode.go), which refuses unknown
  # fields, instead of a plain json.Decoder that ignores them.
  user-templates:
    strict/strict-http.tmpl: templates/strict-http.tmpl
